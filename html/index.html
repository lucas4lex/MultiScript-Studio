<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiScript HTML Editor V14</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #111318;
    color: #e7eaf0;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 42px 1fr 24px;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 16px;
    background: #181a20;
    border-bottom: 1px solid #30343d;
}

.logo {
    font-size: 15px;
    font-weight: 700;
    white-space: nowrap;
}

.logo b {
    color: #4da3ff;
}

.version {
    color: #707784;
    font-size: 11px;
}

.menu {
    display: flex;
    gap: 3px;
}

.menu button {
    border: 0;
    background: transparent;
    color: #aeb4bf;
    padding: 7px 10px;
    border-radius: 4px;
}

.menu button:hover {
    background: #292d35;
    color: #fff;
}

.project-title {
    margin-left: auto;
    color: #858c99;
    font-size: 11px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    background: #202329;
    border-bottom: 1px solid #30343d;
}

.toolbar button {
    background: #292d35;
    color: #dce0e7;
    border: 1px solid #3a3f49;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
}

.toolbar button:hover {
    background: #353a44;
}

.toolbar .blue {
    background: #1769aa;
    border-color: #2586d2;
    color: #fff;
}

.toolbar-spacer {
    flex: 1;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-height: 0;
    display: grid;
    grid-template-columns: 54px 250px minmax(500px, 1fr) 40%;
}

/* =========================================================
   ACTIVITY BAR
========================================================= */

.activity {
    background: #181a20;
    border-right: 1px solid #30343d;
    display: flex;
    flex-direction: column;
}

.activity button {
    width: 54px;
    height: 52px;
    border: 0;
    border-left: 2px solid transparent;
    background: transparent;
    color: #777f8c;
    font-size: 18px;
}

.activity button:hover,
.activity button.active {
    background: #20232a;
    color: #fff;
    border-left-color: #4da3ff;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    min-width: 0;
    overflow-y: auto;
    background: #191b21;
    border-right: 1px solid #30343d;
}

.sidebar-header {
    height: 40px;
    padding: 13px 14px 8px;
    color: #9da4b0;
    font-size: 11px;
    font-weight: 700;
}

.tree {
    padding: 4px 8px 20px;
}

.tree-row {
    display: flex;
    align-items: center;
    height: 29px;
    gap: 8px;
    padding: 0 8px;
    border-radius: 4px;
    color: #c6cad2;
    font-size: 12px;
    user-select: none;
}

.tree-row:hover {
    background: #252931;
}

.tree-row.selected {
    background: #293543;
    color: #fff;
}

.tree-row.folder {
    font-weight: 600;
    color: #dedfe3;
}

.indent {
    padding-left: 28px;
}

.file-icon {
    width: 15px;
    text-align: center;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 37px 1fr 155px;
    background: #101216;
}

.tabs {
    display: flex;
    overflow-x: auto;
    background: #191b20;
    border-bottom: 1px solid #30343d;
}

.tab {
    min-width: 135px;
    max-width: 190px;
    padding: 10px 13px;
    color: #858c98;
    border-right: 1px solid #30343d;
    font-size: 12px;
}

.tab.active {
    color: #fff;
    background: #101216;
    border-top: 2px solid #4da3ff;
    padding-top: 8px;
}

/* =========================================================
   EDITOR
========================================================= */

.editor {
    min-height: 0;
    display: flex;
}

.line-numbers {
    width: 54px;
    flex-shrink: 0;
    padding: 12px 9px;
    overflow: hidden;
    background: #15171c;
    border-right: 1px solid #252931;
    color: #535a66;
    text-align: right;
    font: 13px/20px Consolas, monospace;
    user-select: none;
}

#code {
    width: calc(100% - 54px);
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 12px 14px;
    background: #101216;
    color: #d9dde5;
    font: 13px/20px Consolas, monospace;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

/* =========================================================
   TERMINAL
========================================================= */

.terminal {
    min-height: 0;
    background: #0d0f12;
    border-top: 1px solid #30343d;
}

.terminal-header {
    height: 31px;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 12px;
    background: #181a1f;
    border-bottom: 1px solid #30343d;
    color: #858c98;
    font-size: 11px;
}

.terminal-header .active {
    color: #fff;
}

#terminal {
    height: calc(100% - 31px);
    padding: 8px 12px;
    overflow-y: auto;
    font: 12px/18px Consolas, monospace;
}

.log-info {
    color: #65b9ff;
}

.log-ok {
    color: #6edc8c;
}

.log-warning {
    color: #e3c95c;
}

.log-error {
    color: #ef7272;
}

/* =========================================================
   PREVIEW
========================================================= */

.preview {
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-rows: 37px 1fr;
    background: #ddd;
    border-left: 1px solid #30343d;
}

.preview-header {
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: #191b20;
    border-bottom: 1px solid #30343d;
    color: #9299a5;
    font-size: 11px;
}

#preview {
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
}

/* =========================================================
   STATUS
========================================================= */

.statusbar {
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 10px;
    background: #1769aa;
    color: #fff;
    font-size: 10px;
}

.status-right {
    margin-left: auto;
}

/* =========================================================
   MODAL
========================================================= */

.modal-bg {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
}

.modal {
    width: 700px;
    max-height: 88vh;
    overflow: auto;
    background: #1b1e24;
    border: 1px solid #3d424c;
    border-radius: 8px;
    box-shadow: 0 30px 100px rgba(0,0,0,.55);
}

.modal-header {
    display: flex;
    align-items: center;
    padding: 15px 18px;
    border-bottom: 1px solid #343841;
}

.modal-header h2 {
    margin: 0;
    font-size: 15px;
}

.modal-close {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: #9097a3;
    font-size: 19px;
}

.modal-body {
    padding: 18px;
}

.modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid #343841;
}

.input,
.select,
.textarea {
    width: 100%;
    border: 1px solid #3b4049;
    outline: 0;
    border-radius: 5px;
    background: #101216;
    color: #e8ebef;
}

.input,
.select {
    height: 38px;
    padding: 0 10px;
}

.textarea {
    min-height: 320px;
    padding: 12px;
    resize: vertical;
    font: 13px/20px Consolas, monospace;
}

.input:focus,
.select:focus,
.textarea:focus {
    border-color: #4da3ff;
}

.label {
    display: block;
    margin-bottom: 7px;
    color: #b7bdc8;
    font-size: 12px;
}

.btn {
    padding: 8px 13px;
    border: 1px solid #3d424c;
    border-radius: 5px;
    background: #292d35;
    color: #fff;
}

.btn:hover {
    background: #353a44;
}

.btn.blue {
    background: #1769aa;
    border-color: #2786d1;
}

.btn.red {
    background: #762f38;
    border-color: #9c404b;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.section-title {
    margin: 15px 0 8px;
    color: #aeb4bf;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
}

/* =========================================================
   PLUGIN
========================================================= */

.plugin-box {
    padding: 13px;
    margin-bottom: 8px;
    background: #17191e;
    border: 1px solid #363b45;
    border-radius: 6px;
}

.plugin-name {
    font-size: 13px;
    font-weight: 600;
}

.plugin-path {
    margin-top: 5px;
    color: #6edc8c;
    font: 10px Consolas, monospace;
}

.plugin-actions {
    display: flex;
    gap: 7px;
    margin-top: 10px;
}

/* =========================================================
   GENERATOR INFO
========================================================= */

.info {
    padding: 10px 12px;
    margin-top: 10px;
    border-left: 3px solid #4da3ff;
    background: #151a21;
    color: #8e97a5;
    font-size: 11px;
    line-height: 17px;
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="topbar">

        <div class="logo">
            MultiScript <b>HTML Editor</b>
        </div>

        <div class="version">
            V14.0.0
        </div>

        <div class="menu">

            <button onclick="openGenerator()">
                Gerador
            </button>

            <button onclick="openPluginManager()">
                Plugins
            </button>

            <button onclick="formatHTML()">
                Formatar
            </button>

            <button onclick="saveProject()">
                Salvar
            </button>

        </div>

        <div class="project-title">
            MEU-PROJETO
        </div>

    </header>

    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">

        <button onclick="openGenerator()">
            ＋ Nova Página
        </button>

        <button onclick="openPluginManager()">
            🧩 Plugins
        </button>

        <button onclick="previewPage()">
            ▶ Preview
        </button>

        <button onclick="saveProject()">
            💾 Salvar
        </button>

        <button
            class="blue"
            onclick="exportProject()">
            📦 Exportar ZIP
        </button>

        <div class="toolbar-spacer"></div>

        <button onclick="clearTerminal()">
            Limpar Terminal
        </button>

    </div>

    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="main">

        <!-- ACTIVITY -->

        <aside class="activity">

            <button
                class="active"
                title="Arquivos">
                📁
            </button>

            <button
                onclick="openGenerator()"
                title="Gerador">
                ＋
            </button>

            <button
                onclick="openPluginManager()"
                title="Plugins">
                🧩
            </button>

        </aside>

        <!-- SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">
                EXPLORADOR
            </div>

            <div class="tree">

                <div class="tree-row folder">
                    📂 MEU-PROJETO
                </div>

                <div class="tree-row folder indent">
                    📂 PUBLIC
                </div>

                <div id="fileTree"></div>

                <div class="tree-row folder indent">
                    📂 PLUGINS DO USUÁRIO
                </div>

                <div id="pluginTree"></div>

            </div>

        </aside>

        <!-- EDITOR -->

        <section class="workspace">

            <div
                id="tabs"
                class="tabs">
            </div>

            <div class="editor">

                <div
                    id="lineNumbers"
                    class="line-numbers">
                </div>

                <textarea
                    id="code"
                    spellcheck="false"
                    oninput="editorInput()"
                    onscroll="syncScroll()"
                    onkeydown="editorKey(event)">
                </textarea>

            </div>

            <div class="terminal">

                <div class="terminal-header">

                    <span class="active">
                        TERMINAL
                    </span>

                    <span>
                        OUTPUT
                    </span>

                </div>

                <div id="terminal"></div>

            </div>

        </section>

        <!-- PREVIEW -->

        <section class="preview">

            <div class="preview-header">
                PREVIEW
            </div>

            <iframe
                id="preview"
                sandbox="allow-scripts allow-forms">
            </iframe>

        </section>

    </main>

    <!-- STATUS -->

    <footer class="statusbar">

        <span id="status">
            Pronto
        </span>

        <span>
            UTF-8
        </span>

        <span>
            HTML
        </span>

        <span class="status-right">
            MultiScript V14
        </span>

    </footer>

</div>

<!-- INPUT OCULTO PARA PHP -->

<input
    type="file"
    id="phpInput"
    accept=".php"
    multiple
    hidden
>

<script>
"use strict";

/* =========================================================
   CONFIGURAÇÃO
========================================================= */

const STORAGE_KEY =
    "multiscript_html_editor_v14";

let currentFile =
    "index.html";

let dirty =
    false;


/* =========================================================
   PROJETO INICIAL
========================================================= */

let project = {

    name:
        "MEU-PROJETO",

    files: {

        "index.html":
`<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Site</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <header>

        <h1>
            Meu Site
        </h1>

        <nav>

            <a href="index.html">
                Início
            </a>

        </nav>

    </header>

    <main>

        <section>

            <h2>
                Bem-vindo
            </h2>

            <p>
                Esta página foi criada
                pelo MultiScript HTML Editor V14.
            </p>

        </section>

    </main>

    <footer>

        <p>
            Meu Site
        </p>

    </footer>

    <script src="script.js"><\/script>

</body>

</html>`,

        "style.css":
`* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

header {
    padding: 25px;
    background: #111827;
    color: white;
}

header a {
    color: white;
}

main {
    width: 1000px;
    margin: auto;
    padding: 50px 25px;
}

section {
    padding: 35px;
    background: white;
    border-radius: 10px;
}

footer {
    padding: 25px;
    background: #111827;
    color: white;
    text-align: center;
}`,

        "script.js":
`console.log(
    "MultiScript V14 iniciado."
);`
    },

    plugins: {}

};


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

window.addEventListener(
    "load",
    init
);

function init() {

    loadProject();

    renderFiles();

    renderPlugins();

    openFile(
        currentFile
    );

    log(
        "MultiScript HTML Editor V14 iniciado.",
        "ok"
    );

    log(
        "Os plugins PHP pertencem ao usuário.",
        "info"
    );

    previewPage();
}


/* =========================================================
   STORAGE
========================================================= */

function saveProject() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(project)
    );

    dirty = false;

    setStatus(
        "Projeto salvo."
    );

    log(
        "Projeto salvo localmente.",
        "ok"
    );
}

function loadProject() {

    const saved =
        localStorage.getItem(
            STORAGE_KEY
        );

    if (!saved) {
        return;
    }

    try {

        const data =
            JSON.parse(saved);

        if (
            data &&
            data.files
        ) {

            project =
                data;

            if (
                !project.plugins
            ) {

                project.plugins =
                    {};
            }

            log(
                "Projeto restaurado.",
                "ok"
            );
        }

    } catch (error) {

        log(
            "Erro ao restaurar projeto.",
            "error"
        );
    }
}


/* =========================================================
   ARQUIVOS
========================================================= */

function renderFiles() {

    const tree =
        document.getElementById(
            "fileTree"
        );

    tree.innerHTML =
        "";

    Object.keys(
        project.files
    ).forEach(
        function(file) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "tree-row indent";

            if (
                file === currentFile
            ) {

                row.classList.add(
                    "selected"
                );
            }

            let icon =
                "📄";

            if (
                file.endsWith(
                    ".html"
                )
            ) {

                icon =
                    "🌐";
            }

            else if (
                file.endsWith(
                    ".css"
                )
            ) {

                icon =
                    "🎨";
            }

            else if (
                file.endsWith(
                    ".js"
                )
            ) {

                icon =
                    "📜";
            }

            else if (
                file.endsWith(
                    ".php"
                )
            ) {

                icon =
                    "🐘";
            }

            row.innerHTML =
                `
                <span class="file-icon">
                    ${icon}
                </span>

                <span>
                    ${escapeHTML(file)}
                </span>
                `;

            row.onclick =
                function() {

                    openFile(
                        file
                    );
                };

            tree.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   PLUGINS DO USUÁRIO
========================================================= */

function renderPlugins() {

    const tree =
        document.getElementById(
            "pluginTree"
        );

    tree.innerHTML =
        "";

    Object.keys(
        project.plugins
    ).forEach(
        function(path) {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "tree-row indent";

            row.innerHTML =
                `
                <span class="file-icon">
                    🐘
                </span>

                <span>
                    ${escapeHTML(path)}
                </span>
                `;

            row.onclick =
                function() {

                    openFile(
                        path
                    );
                };

            tree.appendChild(
                row
            );
        }
    );
}


/* =========================================================
   ABRIR ARQUIVO
========================================================= */

function openFile(
    file
) {

    if (
        !project.files.hasOwnProperty(
            file
        )
    ) {

        return;
    }

    currentFile =
        file;

    document.getElementById(
        "code"
    ).value =
        project.files[file];

    renderTabs();

    renderFiles();

    renderPlugins();

    updateLines();

    syncScroll();

    setStatus(
        "Editando " +
        file
    );

    if (
        file === "index.html"
    ) {

        previewPage();
    }
}

function renderTabs() {

    const tabs =
        document.getElementById(
            "tabs"
        );

    tabs.innerHTML =
        "";

    const tab =
        document.createElement(
            "div"
        );

    tab.className =
        "tab active";

    tab.textContent =
        currentFile;

    tabs.appendChild(
        tab
    );
}


/* =========================================================
   EDITOR
========================================================= */

function editorInput() {

    project.files[
        currentFile
    ] =
        document.getElementById(
            "code"
        ).value;

    dirty =
        true;

    updateLines();

    setStatus(
        "Alterações não salvas"
    );

    if (
        currentFile === "index.html"
    ) {

        previewPage();
    }
}

function updateLines() {

    const value =
        document.getElementById(
            "code"
        ).value;

    const count =
        Math.max(
            1,
            value.split("\n").length
        );

    let html =
        "";

    for (
        let i = 1;
        i <= count;
        i++
    ) {

        html +=
            i +
            "<br>";
    }

    document.getElementById(
        "lineNumbers"
    ).innerHTML =
        html;
}

function syncScroll() {

    document.getElementById(
        "lineNumbers"
    ).scrollTop =
        document.getElementById(
            "code"
        ).scrollTop;
}

function editorKey(
    event
) {

    if (
        event.key === "Tab"
    ) {

        event.preventDefault();

        const editor =
            event.target;

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        editor.value =
            editor.value.substring(
                0,
                start
            ) +
            "    " +
            editor.value.substring(
                end
            );

        editor.selectionStart =
            editor.selectionEnd =
            start + 4;

        editorInput();
    }

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "s"
    ) {

        event.preventDefault();

        saveProject();
    }
}


/* =========================================================
   GERADOR DE PÁGINAS
========================================================= */

function openGenerator() {

    openModal(

        "Gerador de Páginas",

        `
        <div class="grid">

            <div>

                <label class="label">
                    Nome do arquivo
                </label>

                <input
                    id="pageName"
                    class="input"
                    value="nova-pagina.html"
                    placeholder="pagina.html"
                >

                <div class="section-title">
                    Conteúdo da página
                </div>

                <textarea
                    id="pageContent"
                    class="textarea"
                    placeholder="Digite o conteúdo HTML da nova página..."
                ></textarea>

            </div>

            <div>

                <div class="section-title">
                    Plugins PHP do usuário
                </div>

                <div
                    id="generatorPlugins">
                </div>

                <div class="info">

                    Os arquivos PHP não são fornecidos
                    pelo MultiScript.

                    <br><br>

                    Eles são plugins adicionados
                    pelo próprio usuário.

                </div>

        `

            onclick="closeModal()">
            Cancelar
        </button>

        <button
            class="btn blue"
            onclick="generatePage()">
            Gerar Página
        </button>
        `
    );

    renderGeneratorPlugins();
}

function renderGeneratorPlugins() {

    const box =
        document.getElementById(
            "generatorPlugins"
        );

    if (!box) {
        return;
    }

    const plugins =
        Object.keys(
            project.plugins
        );

    if (
        plugins.length === 0
    ) {

        box.innerHTML =
            `
            <p style="color:#777f8c;font-size:12px">
                Nenhum plugin PHP instalado.
            </p>
            `;

        return;
    }

    box.innerHTML =
        "";

    plugins.forEach(
        function(path) {

            const item =
                document.createElement(
                    "label"
                );

            item.style.display =
                "flex";

            item.style.alignItems =
                "center";

            item.style.gap =
                "8px";

            item.style.marginBottom =
                "9px";

            item.style.color =
                "#c8ccd4";

            item.style.fontSize =
                "12px";

            item.innerHTML =
                `
                <input
                    type="checkbox"
                    value="${escapeAttribute(path)}"
                >

                🐘
                ${escapeHTML(path)}
                `;

            box.appendChild(
                item
            );
        }
    );
}

function generatePage() {

    let filename =
        document.getElementById(
            "pageName"
        ).value.trim();

    const content =
        document.getElementById(
            "pageContent"
        ).value;

    if (!filename) {

        alert(
            "Digite o nome da página."
        );

        return;
    }

    filename =
        filename
            .replace(
                /[\\\/:*?"<>|]/g,
                ""
            );

    if (
        !filename
            .toLowerCase()
            .endsWith(
                ".html"
            )
    ) {

        filename +=
            ".html";
    }

    if (
        project.files[
            filename
        ]
    ) {

        if (
            !confirm(
                "Essa página já existe. Substituir?"
            )
        ) {

            return;
        }
    }

    const selectedPlugins =
        [];

    document
        .querySelectorAll(
            "#generatorPlugins input[type=checkbox]:checked"
        )
        .forEach(
            function(input) {

                selectedPlugins.push(
                    input.value
                );
            }
        );

    const html =
        createHTMLPage(
            filename,
            content,
            selectedPlugins
        );

    project.files[
        filename
    ] =
        html;

    currentFile =
        filename;

    closeModal();

    renderFiles();

    openFile(
        filename
    );

    saveProject();

    log(
        "Página gerada: " +
        filename,
        "ok"
    );

    if (
        selectedPlugins.length
    ) {

        log(
            "Plugins associados: " +
            selectedPlugins.join(
                ", "
            ),
            "info"
        );
    }
}

function createHTMLPage(
    filename,
    content,
    plugins
) {

    const title =
        filename
            .replace(
                /\.html$/i,
                ""
            )
            .replace(
                /[-_]/g,
                " "
            );

    return `<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        ${escapeHTML(
            title
        )}
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <main>

${content}

    </main>

    <script src="script.js"><\/script>

</body>

</html>`;
}


/* =========================================================
   IMPORTAR PHP DO USUÁRIO
========================================================= */

function openPHPImporter() {

    document.getElementById(
        "phpInput"
    ).click();
}

document.getElementById(
    "phpInput"
).addEventListener(
    "change",
    importPHPFiles
);

async function importPHPFiles(
    event
) {

    const files =
        Array.from(
            event.target.files
        );

    if (
        files.length === 0
    ) {

        return;
    }

    for (
        const file of files
    ) {

        if (
            !file.name
                .toLowerCase()
                .endsWith(
                    ".php"
                )
        ) {

            continue;
        }

        const content =
            await file.text();

        const path =
            "plugins/" +
            file.name;

        project.files[
            path
        ] =
            content;

        project.plugins[
            path
        ] =
            true;

        log(
            "Plugin PHP importado: " +
            path,
            "ok"
        );
    }

    renderFiles();

    renderPlugins();

    saveProject();

    event.target.value =
        "";
}

function removePlugin(
    path
) {

    if (
        !confirm(
            "Remover o plugin " +
            path +
            "?"
        )
    ) {

        return;
    }

    delete project.plugins[
        path
    ];

    delete project.files[
        path
    ];

    if (
        currentFile === path
    ) {

        currentFile =
            "index.html";
    }

    saveProject();

    renderFiles();

    renderPlugins();

    openPluginManager();

    log(
        "Plugin removido: " +
        path,
        "warning"
    );
}


/* =========================================================

========================================================= */

function previewPage() {

    const html =
        project.files[
            "index.html"
        ];

    if (!html) {
        return;
    }

    let output =
        html;

    const css =
        project.files[
            "style.css"
        ] || "";

    const js =
        project.files[
            "script.js"
        ] || "";

    if (
        !/<link[^>]+style\.css/i
            .test(output)
    ) {

        output =
            output.replace(
                "</head>",
                `
                <style>
                ${css}
                </style>

                </head>
                `
            );
    }

    const safeJS =
        js.replace(
            /<\/script/gi,
            "<" +
            "/script"
        );

    output =
        output.replace(
            /<script[^>]+script\.js[^>]*><\/script>/i,
            `
            <script>
            ${safeJS}
            <` +
            `/script>
            `
        );

    document.getElementById(
        "preview"
    ).srcdoc =
        output;

    setStatus(
        "Preview atualizado."
    );
}


/* =========================================================
   FORMATADOR
========================================================= */

function formatHTML() {

    if (
        !currentFile
            .toLowerCase()
            .endsWith(
                ".html"
            )
    ) {

        alert(
            "O formatador é para arquivos HTML."
        );

    }

    const editor =
        document.getElementById(

        );

    editor.value =
        basicHTMLFormat(
            editor.value
        );

    editorInput();

    log(
        "HTML formatado.",
        "ok"
    );
}

function basicHTMLFormat(
    html
) {

    html =
        html
            .replace(
                />\s*</g,
                ">\n<"
            )
            .trim();

    const lines =
        html.split(
            "\n"
        );

    let depth =
        0;

    const voidTags = [
        "area",
        "base",
        "br",
        "col",
        "embed",
        "hr",
        "img",
        "input",
        "link",
        "meta",
        "param",
        "source",
        "track",
        "wbr"
    ];

    return lines.map(
        function(line) {

            line =
                line.trim();

            if (!line) {
                return "";
            }

            if (
                /^<\//.test(
                    line
                )
            ) {

                depth =
                    Math.max(
                        0,
                        depth - 1
                    );
            }

            const result =
                "    ".repeat(
                    depth
                ) +
                line;

            const match =
                line.match(
                    /^<([a-zA-Z0-9]+)(?:\s|>)/
                );

            const hasClose =
                /<\/[a-zA-Z0-9]+>/
                    .test(
                        line
                    );

            if (
                match &&
                !hasClose
            ) {

                const tag =
                    match[1]
                        .toLowerCase();

                if (
                    !voidTags.includes(
                        tag
                    )
                ) {

                    depth++;
                }
            }

            return result;

        }
    ).join(
        "\n"
    );
}

function exportProject() {

            antes de gerar o ZIP.

        >

            <option value="none">

            </option>

            </option>

async function confirmExport() {

    const credit =
        document.getElementById(
            "credit"
        ).value;

    closeModal();

    const zip =
        new JSZip();

    Object.keys(
        project.files
    ).forEach(
        function(path) {

            let content =
                project.files[
                    path
                ];

            if (
                path
                    .toLowerCase()
                    .endsWith(
                        ".html"
                    )
            ) {

                content =
                    applyCredit(
                        content,
                        credit
                    );
            }

            zip.file(
                path,
                content
            );
        }
    );

    const blob =
        await zip.generateAsync({
            type: "blob"
        });

    const url =
        URL.createObjectURL(
            blob
        );

    const link =
        document.createElement(
            "a"
        );

    link.href =
        url;

    link.download =
        project.name +
        ".zip";

    document.body.appendChild(
        link
    );

    link.click();

    link.remove();

    URL.revokeObjectURL(
        url
    );

    log(
        "Projeto exportado para ZIP.",
        "ok"
    );

    setStatus(
        "ZIP exportado."
    );
}

/* =========================================================
   ESCAPES
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

function escapeAttribute(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        );
}

function escapeJS(
    value
) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        );
}
