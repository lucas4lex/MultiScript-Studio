<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MultiScript V14 — Image Editor</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#111827;
    color:#e5e7eb;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

button,
input,
select{
    font:inherit;
}

/* =========================
   EDITOR
========================= */

.image-editor{
    width:100vw;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* =========================
   TOPBAR
========================= */

.image-topbar{
    height:54px;
    background:#0b1220;
    border-bottom:1px solid #263244;
    display:flex;
    align-items:center;
    gap:8px;
    padding:0 12px;
    flex-shrink:0;
}

.image-topbar .brand{
    font-weight:bold;
    color:#fff;
    margin-right:15px;
}

.image-topbar button{
    border:1px solid #334155;
    background:#182235;
    color:#dbeafe;
    border-radius:5px;
    padding:7px 11px;
    cursor:pointer;
}

.image-topbar button:hover{
    background:#24324a;
}

.image-topbar button.primary{
    background:#2563eb;
    border-color:#2563eb;
    color:white;
}

.image-topbar button.primary:hover{
    background:#1d4ed8;
}

/* =========================
   MAIN
========================= */

.image-main{
    flex:1;
    display:flex;
    min-height:0;
}

/* =========================
   LEFT TOOLBAR
========================= */

.image-tools{
    width:72px;
    background:#0b1220;
    border-right:1px solid #263244;
    padding:8px 5px;
    display:flex;
    flex-direction:column;
    gap:5px;
}

.tool{
    width:60px;
    min-height:52px;
    border:1px solid transparent;
    background:transparent;
    color:#cbd5e1;
    border-radius:6px;
    cursor:pointer;
    font-size:11px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
}

.tool span{
    font-size:20px;
}

.tool:hover{
    background:#172033;
}

.tool.active{
    background:#1d4ed8;
    border-color:#3b82f6;
    color:white;
}

/* =========================
   CANVAS AREA
========================= */

.canvas-area{
    flex:1;
    min-width:0;
    position:relative;
    overflow:auto;
    background:
        linear-gradient(45deg,#151d2b 25%,transparent 25%),
        linear-gradient(-45deg,#151d2b 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#151d2b 75%),
        linear-gradient(-45deg,transparent 75%,#151d2b 75%);
    background-size:28px 28px;
    background-position:0 0,0 14px,14px -14px,-14px 0;
}

/* =========================
   SVG WORKSPACE
========================= */

.workspace{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transform-origin:center center;
    box-shadow:0 15px 50px rgba(0,0,0,.5);
}

#svgCanvas{
    display:block;
    background:white;
    overflow:visible;
}

.selection-box{
    fill:none;
    stroke:#2563eb;
    stroke-width:1;
    stroke-dasharray:5 3;
    pointer-events:none;
}

.selection-handle{
    fill:white;
    stroke:#2563eb;
    stroke-width:1;
    pointer-events:none;
}

/* =========================
   RIGHT PANEL
========================= */

.properties{
    width:285px;
    background:#0b1220;
    border-left:1px solid #263244;
    overflow:auto;
    flex-shrink:0;
}

.panel{
    border-bottom:1px solid #263244;
    padding:13px;
}

.panel-title{
    color:white;
    font-size:12px;
    font-weight:bold;
    text-transform:uppercase;
    margin-bottom:12px;
}

.field{
    margin-bottom:10px;
}

.field label{
    display:block;
    color:#94a3b8;
    font-size:11px;
    margin-bottom:4px;
}

.field input,
.field select{
    width:100%;
    background:#111827;
    border:1px solid #334155;
    color:#e5e7eb;
    border-radius:4px;
    padding:7px;
}

.field-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
}

.color-row{
    display:flex;
    gap:8px;
    align-items:center;
}

.color-row input[type=color]{
    width:45px;
    height:35px;
    padding:2px;
    cursor:pointer;
}

.color-value{
    flex:1;
    background:#111827;
    border:1px solid #334155;
    border-radius:4px;
    padding:8px;
    color:#cbd5e1;
    font-size:12px;
}

/* =========================
   LAYERS
========================= */

.layers{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.layer{
    background:#151e2e;
    border:1px solid #273449;
    border-radius:5px;
    padding:8px;
    display:flex;
    align-items:center;
    gap:7px;
    cursor:pointer;
}

.layer:hover{
    background:#1b2940;
}

.layer.selected{
    border-color:#3b82f6;
    background:#172d52;
}

.layer-eye{
    width:22px;
    border:0;
    background:none;
    color:#cbd5e1;
    cursor:pointer;
}

.layer-name{
    flex:1;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:12px;
}

/* =========================
   STATUS
========================= */

.statusbar{
    height:30px;
    background:#0b1220;
    border-top:1px solid #263244;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 12px;
    color:#94a3b8;
    font-size:11px;
    flex-shrink:0;
}

.zoom-controls{
    display:flex;
    align-items:center;
    gap:5px;
}

.zoom-controls button{
    width:25px;
    height:22px;
    border:1px solid #334155;
    background:#182235;
    color:white;
    cursor:pointer;
    border-radius:3px;
}

@media(max-width:900px){
    .properties{
        width:240px;
    }
}

@media(max-width:700px){
    .properties{
        display:none;
    }

    .image-tools{
        width:60px;
    }

    .tool{
        width:50px;
    }

    .image-topbar .brand{
        display:none;
    }
}
</style>
</head>

<body>

<div class="image-editor">

    <!-- TOPBAR -->
    <div class="image-topbar">

        <div class="brand">
            🎨 MultiScript Image Editor
        </div>

        <button onclick="newImage()">Novo</button>
        <button onclick="undo()">↶</button>
        <button onclick="redo()">↷</button>

        <button onclick="zoomOut()">−</button>
        <button onclick="zoomReset()">100%</button>
        <button onclick="zoomIn()">+</button>

        <button onclick="downloadPNG()">PNG</button>

        <button class="primary" onclick="saveSVG()">
            💾 Salvar SVG
        </button>

        <button onclick="closeEditor()">
            ✕ Fechar
        </button>

    </div>

    <!-- MAIN -->
    <div class="image-main">

        <!-- TOOLS -->
        <aside class="image-tools">

            <button class="tool active"
                    data-tool="select"
                    onclick="setTool('select')">
                <span>↖</span>
                Seleção
            </button>

            <button class="tool"
                    data-tool="rect"
                    onclick="setTool('rect')">
                <span>▭</span>
                Retângulo
            </button>

            <button class="tool"
                    data-tool="circle"
                    onclick="setTool('circle')">
                <span>○</span>
                Círculo
            </button>

            <button class="tool"
                    data-tool="line"
                    onclick="setTool('line')">
                <span>╱</span>
                Linha
            </button>

            <button class="tool"
                    data-tool="text"
                    onclick="setTool('text')">
                <span>T</span>
                Texto
            </button>

            <button class="tool"
                    data-tool="free"
                    onclick="setTool('free')">
                <span>✎</span>
                Pincel
            </button>

            <button class="tool"
                    data-tool="image"
                    onclick="importImage()">
                <span>🖼</span>
                Imagem
            </button>

        </aside>

        <!-- CANVAS -->
        <main class="canvas-area" id="canvasArea">

            <div class="workspace" id="workspace">

                <svg
                    id="svgCanvas"
                    xmlns="http://www.w3.org/2000/svg"
                    width="1000"
                    height="650"
                    viewBox="0 0 1000 650">

                    <rect
                        id="background"
                        x="0"
                        y="0"
                        width="1000"
                        height="650"
                        fill="#ffffff"/>

                </svg>

            </div>

        </main>

        <!-- PROPERTIES -->
        <aside class="properties">

            <!-- DOCUMENT -->
            <section class="panel">

                <div class="panel-title">
                    Documento
                </div>

                <div class="field-row">

                    <div class="field">
                        <label>Largura</label>
                        <input
                            id="canvasWidth"
                            type="number"
                            value="1000"
                            onchange="resizeCanvas()">
                    </div>

                    <div class="field">
                        <label>Altura</label>
                        <input
                            id="canvasHeight"
                            type="number"
                            value="650"
                            onchange="resizeCanvas()">
                    </div>

                </div>

                <div class="field">

                    <label>
                        Fundo
                    </label>

                    <div class="color-row">

                        <input
                            id="backgroundColor"
                            type="color"
                            value="#ffffff"
                            onchange="changeBackground()">

                        <div
                            class="color-value"
                            id="backgroundValue">
                            #ffffff
                        </div>

                    </div>

                </div>

            </section>

            <!-- OBJECT -->
            <section class="panel">

                <div class="panel-title">
                    Objeto
                </div>

                <div class="field-row">

                    <div class="field">
                        <label>X</label>
                        <input
                            id="objX"
                            type="number"
                            onchange="updateObject()">
                    </div>

                    <div class="field">
                        <label>Y</label>
                        <input
                            id="objY"
                            type="number"
                            onchange="updateObject()">
                    </div>

                </div>

                <div class="field-row">

                    <div class="field">
                        <label>Largura</label>
                        <input
                            id="objW"
                            type="number"
                            onchange="updateObject()">
                    </div>

                    <div class="field">
                        <label>Altura</label>
                        <input
                            id="objH"
                            type="number"
                            onchange="updateObject()">
                    </div>

                </div>

                <div class="field">

                    <label>
                        Rotação
                    </label>

                    <input
                        id="objRotation"
                        type="number"
                        value="0"
                        onchange="updateObject()">

                </div>

            </section>

            <!-- APPEARANCE -->
            <section class="panel">

                <div class="panel-title">
                    Aparência
                </div>

                <div class="field">

                    <label>
                        Preenchimento
                    </label>

                    <div class="color-row">

                        <input
                            id="fillColor"
                            type="color"
                            value="#2563eb"
                            onchange="updateAppearance()">

                        <div
                            id="fillValue"
                            class="color-value">
                            #2563eb
                        </div>

                    </div>

                </div>

                <div class="field">

                    <label>
                        Borda
                    </label>

                    <div class="color-row">

                        <input
                            id="strokeColor"
                            type="color"
                            value="#111827"
                            onchange="updateAppearance()">

                        <div
                            id="strokeValue"
                            class="color-value">
                            #111827
                        </div>

                    </div>

                </div>

                <div class="field">

                    <label>
                        Espessura da borda
                    </label>

                    <input
                        id="strokeWidth"
                        type="number"
                        min="0"
                        value="0"
                        onchange="updateAppearance()">

                </div>

                <div class="field">

                    <label>
                        Opacidade
                    </label>

                    <input
                        id="opacity"
                        type="range"
                        min="0"
                        max="1"
                        step="0.01"
                        value="1"
                        onchange="updateAppearance()">

                </div>

            </section>

            <!-- TEXT -->
            <section
                class="panel"
                id="textPanel"
                style="display:none">

                <div class="panel-title">
                    Texto
                </div>

                <div class="field">

                    <label>
                        Conteúdo
                    </label>

                    <input
                        id="textContent"
                        type="text"
                        onchange="updateText()">

                </div>

                <div class="field">

                    <label>
                        Tamanho
                    </label>

                    <input
                        id="textSize"
                        type="number"
                        value="40"
                        onchange="updateText()">

                </div>

                <div class="field">

                    <label>
                        Fonte
                    </label>

                    <select
                        id="textFont"
                        onchange="updateText()">

                        <option>Arial</option>
                        <option>Verdana</option>
                        <option>Tahoma</option>
                        <option>Georgia</option>
                        <option>Times New Roman</option>
                        <option>Courier New</option>

                    </select>

                </div>

            </section>

            <!-- LAYERS -->
            <section class="panel">

                <div class="panel-title">
                    Camadas
                </div>

                <div
                    id="layers"
                    class="layers">
                </div>

            </section>

        </aside>

    </div>

    <!-- STATUS -->
    <div class="statusbar">

        <span id="fileStatus">
            Novo SVG
        </span>

        <div class="zoom-controls">

            <button onclick="zoomOut()">−</button>

            <span id="zoomLabel">
                100%
            </span>

            <button onclick="zoomIn()">+</button>

        </div>

    </div>

</div>

<script>

/* =========================================================
   MULTISCRIPT IMAGE EDITOR
========================================================= */

let currentFile = "images/logo.svg";

let currentTool = "select";

let selectedElement = null;

let zoom = 1;

let history = [];

let historyIndex = -1;

let drawing = false;

let drawingPath = null;

let startPoint = null;


/* =========================================================
   SVG
========================================================= */

const svg = document.getElementById("svgCanvas");

const workspace = document.getElementById("workspace");


/* =========================================================
   PROJECT
   Se project já existir no MultiScript, será utilizado.
========================================================= */

if(typeof project === "undefined"){

    window.project = {

        name:"MEU-PROJETO",

        files:{

            "images/logo.svg":
`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="220" viewBox="0 0 600 220">
<rect width="600" height="220" rx="30" fill="#2563eb"/>
<text x="300" y="140"
      text-anchor="middle"
      font-family="Arial"
      font-size="72"
      font-weight="bold"
      fill="#ffffff">
MULTISCRIPT
</text>
</svg>`,

            "images/favicon.svg":
`<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
<rect width="128" height="128" rx="25" fill="#2563eb"/>
<text x="64" y="88"
      text-anchor="middle"
      font-family="Arial"
      font-size="70"
      font-weight="bold"
      fill="#ffffff">
M
</text>
</svg>`

        },

        plugins:{},

        pages:{},

        protectedFiles:["multiscript.json"]

    };

}


/* =========================================================
   TOOL
========================================================= */

function setTool(tool){

    currentTool = tool;

    document
        .querySelectorAll(".tool")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.tool === tool
            );

        });

}


/* =========================================================
   COORDENADAS
========================================================= */

function getSVGPoint(event){

    const rect = svg.getBoundingClientRect();

    return {

        x:(event.clientX - rect.left) / zoom,

        y:(event.clientY - rect.top) / zoom

    };

}


/* =========================================================
   MOUSE
========================================================= */

svg.addEventListener("mousedown", function(event){

    const point = getSVGPoint(event);

    if(currentTool === "select"){

        const target =
            event.target.closest("[data-layer]");

        if(target){

            selectElement(target);

        }else{

            deselect();

        }

        return;

    }


    if(currentTool === "rect"){

        createRectangle(
            point.x,
            point.y
        );

        return;

    }


    if(currentTool === "circle"){

        createCircle(
            point.x,
            point.y
        );

        return;

    }


    if(currentTool === "line"){

        createLine(
            point.x,
            point.y
        );

        return;

    }


    if(currentTool === "text"){

        createText(
            point.x,
            point.y
        );

        return;

    }


    if(currentTool === "free"){

        startFreeDrawing(point);

    }

});


svg.addEventListener("mousemove", function(event){

    if(currentTool !== "free" || !drawing){

        return;

    }

    const point = getSVGPoint(event);

    drawingPath.setAttribute(
        "d",
        drawingPath.getAttribute("d") +
        ` L ${point.x} ${point.y}`
    );

});


svg.addEventListener("mouseup", function(){

    if(currentTool === "free" && drawing){

        drawing = false;

        saveHistory();

        updateLayers();

    }

});


/* =========================================================
   CREATE RECTANGLE
========================================================= */

function createRectangle(x,y){

    const rect =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
        );

    rect.setAttribute("data-layer","true");

    rect.setAttribute("x",x);

    rect.setAttribute("y",y);

    rect.setAttribute("width",180);

    rect.setAttribute("height",100);

    rect.setAttribute("rx",8);

    rect.setAttribute("fill","#2563eb");

    rect.setAttribute("stroke","#111827");

    rect.setAttribute("stroke-width","0");

    svg.appendChild(rect);

    selectElement(rect);

    saveHistory();

}


/* =========================================================
   CREATE CIRCLE
========================================================= */

function createCircle(x,y){

    const circle =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute("data-layer","true");

    circle.setAttribute("cx",x);

    circle.setAttribute("cy",y);

    circle.setAttribute("r",70);

    circle.setAttribute("fill","#ef4444");

    circle.setAttribute("stroke","#111827");

    circle.setAttribute("stroke-width","0");

    svg.appendChild(circle);

    selectElement(circle);

    saveHistory();

}


/* =========================================================
   CREATE LINE
========================================================= */

function createLine(x,y){

    const line =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute("data-layer","true");

    line.setAttribute("x1",x);

    line.setAttribute("y1",y);

    line.setAttribute("x2",x+200);

    line.setAttribute("y2",y+100);

    line.setAttribute("stroke","#111827");

    line.setAttribute("stroke-width","5");

    svg.appendChild(line);

    selectElement(line);

    saveHistory();

}


/* =========================================================
   CREATE TEXT
========================================================= */

function createText(x,y){

    const text =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    text.setAttribute("data-layer","true");

    text.setAttribute("x",x);

    text.setAttribute("y",y);

    text.setAttribute("font-family","Arial");

    text.setAttribute("font-size","40");

    text.setAttribute("font-weight","bold");

    text.setAttribute("fill","#111827");

    text.textContent="Novo Texto";

    svg.appendChild(text);

    selectElement(text);

    saveHistory();

}


/* =========================================================
   FREE DRAW
========================================================= */

function startFreeDrawing(point){

    drawing = true;

    drawingPath =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    drawingPath.setAttribute(
        "data-layer",
        "true"
    );

    drawingPath.setAttribute(
        "d",
        `M ${point.x} ${point.y}`
    );

    drawingPath.setAttribute(
        "fill",
        "none"
    );

    drawingPath.setAttribute(
        "stroke",
        "#111827"
    );

    drawingPath.setAttribute(
        "stroke-width",
        "5"
    );

    drawingPath.setAttribute(
        "stroke-linecap",
        "round"
    );

    drawingPath.setAttribute(
        "stroke-linejoin",
        "round"
    );

    svg.appendChild(drawingPath);

    selectElement(drawingPath);

}


/* =========================================================
   SELECT
========================================================= */

function selectElement(element){

    selectedElement = element;

    document
        .querySelectorAll("[data-layer]")
        .forEach(el => {

            el.style.outline =
                el === element
                    ? "1px dashed #2563eb"
                    : "";

        });

    updateProperties();

    updateLayers();

}


/* =========================================================
   DESELECT
========================================================= */

function deselect(){

    selectedElement = null;

    document
        .querySelectorAll("[data-layer]")
        .forEach(el => {

            el.style.outline="";

        });

    updateLayers();

}


/* =========================================================
   PROPERTIES
========================================================= */

function updateProperties(){

    if(!selectedElement){

        return;

    }

    const el = selectedElement;

    let x = 0;

    let y = 0;

    let w = 0;

    let h = 0;


    if(el.tagName === "rect"){

        x = parseFloat(el.getAttribute("x")) || 0;

        y = parseFloat(el.getAttribute("y")) || 0;

        w = parseFloat(el.getAttribute("width")) || 0;

        h = parseFloat(el.getAttribute("height")) || 0;

    }


    if(el.tagName === "circle"){

        const r =
            parseFloat(el.getAttribute("r")) || 0;

        x =
            (parseFloat(el.getAttribute("cx")) || 0) - r;

        y =
            (parseFloat(el.getAttribute("cy")) || 0) - r;

        w = r * 2;

        h = r * 2;

    }


    if(el.tagName === "text"){

        x =
            parseFloat(el.getAttribute("x")) || 0;

        y =
            parseFloat(el.getAttribute("y")) || 0;

        w = 0;

        h = 0;

    }


    document.getElementById("objX").value =
        Math.round(x);

    document.getElementById("objY").value =
        Math.round(y);

    document.getElementById("objW").value =
        Math.round(w);

    document.getElementById("objH").value =
        Math.round(h);


    const fill =
        el.getAttribute("fill") || "#000000";

    if(fill !== "none"){

        document.getElementById("fillColor").value =
            normalizeColor(fill);

        document.getElementById("fillValue").textContent =
            normalizeColor(fill);

    }


    const stroke =
        el.getAttribute("stroke") || "#000000";

    if(stroke !== "none"){

        document.getElementById("strokeColor").value =
            normalizeColor(stroke);

        document.getElementById("strokeValue").textContent =
            normalizeColor(stroke);

    }


    document.getElementById("strokeWidth").value =
        parseFloat(
            el.getAttribute("stroke-width") || 0
        );

    document.getElementById("opacity").value =
        parseFloat(
            el.getAttribute("opacity") || 1
        );


    const textPanel =
        document.getElementById("textPanel");

    if(el.tagName === "text"){

        textPanel.style.display="block";

        document.getElementById("textContent").value =
            el.textContent;

        document.getElementById("textSize").value =
            parseFloat(
                el.getAttribute("font-size") || 40
            );

        document.getElementById("textFont").value =
            el.getAttribute("font-family") || "Arial";

    }else{

        textPanel.style.display="none";

    }

}


/* =========================================================
   UPDATE OBJECT
========================================================= */

function updateObject(){

    if(!selectedElement){

        return;

    }

    const el = selectedElement;

    const x =
        parseFloat(
            document.getElementById("objX").value
        ) || 0;

    const y =
        parseFloat(
            document.getElementById("objY").value
        ) || 0;

    const w =
        parseFloat(
            document.getElementById("objW").value
        ) || 0;

    const h =
        parseFloat(
            document.getElementById("objH").value
        ) || 0;


    if(el.tagName === "rect"){

        el.setAttribute("x",x);

        el.setAttribute("y",y);

        el.setAttribute("width",w);

        el.setAttribute("height",h);

    }


    if(el.tagName === "circle"){

        const r =
            Math.min(w,h) / 2;

        el.setAttribute(
            "cx",
            x + r
        );

        el.setAttribute(
            "cy",
            y + r
        );

        el.setAttribute(
            "r",
            r
        );

    }


    if(el.tagName === "text"){

        el.setAttribute("x",x);

        el.setAttribute("y",y);

    }

    saveHistory();

}


/* =========================================================
   APPEARANCE
========================================================= */

function updateAppearance(){

    if(!selectedElement){

        return;

    }

    const fill =
        document.getElementById("fillColor").value;

    const stroke =
        document.getElementById("strokeColor").value;

    const strokeWidth =
        document.getElementById("strokeWidth").value;

    const opacity =
        document.getElementById("opacity").value;


    selectedElement.setAttribute(
        "fill",
        fill
    );

    selectedElement.setAttribute(
        "stroke",
        stroke
    );

    selectedElement.setAttribute(
        "stroke-width",
        strokeWidth
    );

    selectedElement.setAttribute(
        "opacity",
        opacity
    );


    document.getElementById("fillValue").textContent =
        fill;

    document.getElementById("strokeValue").textContent =
        stroke;

    saveHistory();

}


/* =========================================================
   TEXT
========================================================= */

function updateText(){

    if(!selectedElement ||
       selectedElement.tagName !== "text"){

        return;

    }

    selectedElement.textContent =
        document.getElementById(
            "textContent"
        ).value;

    selectedElement.setAttribute(
        "font-size",
        document.getElementById(
            "textSize"
        ).value
    );

    selectedElement.setAttribute(
        "font-family",
        document.getElementById(
            "textFont"
        ).value
    );

    saveHistory();

}


/* =========================================================
   BACKGROUND
========================================================= */

function changeBackground(){

    const color =
        document.getElementById(
            "backgroundColor"
        ).value;

    const background =
        document.getElementById(
            "background"
        );

    background.setAttribute(
        "fill",
        color
    );

    document.getElementById(
        "backgroundValue"
    ).textContent = color;

    saveHistory();

}


/* =========================================================
   CANVAS
========================================================= */

function resizeCanvas(){

    const width =
        parseInt(
            document.getElementById(
                "canvasWidth"
            ).value
        ) || 1000;

    const height =
        parseInt(
            document.getElementById(
                "canvasHeight"
            ).value
        ) || 650;


    svg.setAttribute(
        "width",
        width
    );

    svg.setAttribute(
        "height",
        height
    );

    svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
    );


    const background =
        document.getElementById(
            "background"
        );

    background.setAttribute(
        "width",
        width
    );

    background.setAttribute(
        "height",
        height
    );

    saveHistory();

}


/* =========================================================
   LAYERS
========================================================= */

function updateLayers(){

    const container =
        document.getElementById(
            "layers"
        );

    container.innerHTML="";


    const elements =
        Array.from(
            svg.querySelectorAll(
                "[data-layer]"
            )
        );


    elements.reverse().forEach(
        (element,index) => {

            const layer =
                document.createElement("div");

            layer.className =
                "layer" +
                (
                    element === selectedElement
                        ? " selected"
                        : ""
                );


            const eye =
                document.createElement("button");

            eye.className="layer-eye";

            eye.textContent =
                element.style.display === "none"
                    ? "○"
                    : "●";


            eye.onclick = function(event){

                event.stopPropagation();

                if(element.style.display === "none"){

                    element.style.display="";

                }else{

                    element.style.display="none";

                }

                updateLayers();

            };


            const name =
                document.createElement("div");

            name.className =
                "layer-name";


            name.textContent =
                getElementName(
                    element,
                    index
                );


            layer.appendChild(eye);

            layer.appendChild(name);


            layer.onclick = function(){

                selectElement(element);

            };


            container.appendChild(layer);

        }
    );

}


/* =========================================================
   LAYER NAME
========================================================= */

function getElementName(element,index){

    if(element.tagName === "text"){

        return "🔤 " +
            (
                element.textContent ||
                "Texto"
            );

    }

    if(element.tagName === "rect"){

        if(element.id === "background"){

            return "Fundo";

        }

        return "▭ Retângulo " +
            (index + 1);

    }

    if(element.tagName === "circle"){

        return "○ Círculo " +
            (index + 1);

    }

    if(element.tagName === "line"){

        return "╱ Linha " +
            (index + 1);

    }

    if(element.tagName === "path"){

        return "✎ Desenho " +
            (index + 1);

    }

    if(element.tagName === "image"){

        return "🖼 Imagem " +
            (index + 1);

    }

    return element.tagName;

}


/* =========================================================
   DELETE
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Delete" &&
            selectedElement &&
            selectedElement.id !== "background"
        ){

            selectedElement.remove();

            selectedElement=null;

            saveHistory();

            updateLayers();

        }

    }
);


/* =========================================================
   DUPLICATE
========================================================= */

function duplicateSelected(){

    if(!selectedElement){

        return;

    }

    const clone =
        selectedElement.cloneNode(true);

    clone.removeAttribute("id");

    clone.setAttribute(
        "data-layer",
        "true"
    );


    if(clone.hasAttribute("x")){

        clone.setAttribute(
            "x",
            parseFloat(
                clone.getAttribute("x")
            ) + 20
        );

    }

    if(clone.hasAttribute("y")){

        clone.setAttribute(
            "y",
            parseFloat(
                clone.getAttribute("y")
            ) + 20
        );

    }


    svg.appendChild(clone);

    selectElement(clone);

    saveHistory();

}


/* =========================================================
   MOVE LAYER
========================================================= */

function bringForward(){

    if(!selectedElement){

        return;

    }

    const next =
        selectedElement.nextElementSibling;

    if(next){

        svg.insertBefore(
            next,
            selectedElement
        );

    }

    saveHistory();

    updateLayers();

}


function sendBackward(){

    if(!selectedElement){

        return;

    }

    const previous =
        selectedElement.previousElementSibling;

    if(previous){

        svg.insertBefore(
            selectedElement,
            previous
        );

    }

    saveHistory();

    updateLayers();

}


/* =========================================================
   IMPORT IMAGE
========================================================= */

function importImage(){

    const input =
        document.createElement("input");

    input.type="file";

    input.accept="image/*,.svg";

    input.onchange = function(){

        const file =
            input.files[0];

        if(!file){

            return;

        }


        const reader =
            new FileReader();


        reader.onload = function(event){

            const image =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "image"
                );


            image.setAttribute(
                "data-layer",
                "true"
            );

            image.setAttribute(
                "x",
                100
            );

            image.setAttribute(
                "y",
                100
            );

            image.setAttribute(
                "width",
                300
            );

            image.setAttribute(
                "height",
                200
            );


            image.setAttribute(
                "preserveAspectRatio",
                "xMidYMid meet"
            );


            image.setAttribute(
                "href",
                event.target.result
            );


            svg.appendChild(image);

            selectElement(image);

            saveHistory();

        };


        reader.readAsDataURL(file);

    };

    input.click();

}


/* =========================================================
   HISTORY
========================================================= */

function saveHistory(){

    const content =
        svg.outerHTML;

    history =
        history.slice(
            0,
            historyIndex + 1
        );

    history.push(content);

    historyIndex =
        history.length - 1;


    if(history.length > 50){

        history.shift();

        historyIndex--;

    }

    updateLayers();

}


function restoreHistory(content){

    const parser =
        new DOMParser();

    const documentSVG =
        parser.parseFromString(
            content,
            "image/svg+xml"
        );


    const newSVG =
        documentSVG.documentElement;


    svg.replaceWith(
        newSVG
    );


    newSVG.id="svgCanvas";

    window.svg =
        document.getElementById(
            "svgCanvas"
        );


    bindSVGEvents();

    deselect();

    updateLayers();

}


function undo(){

    if(historyIndex <= 0){

        return;

    }

    historyIndex--;

    restoreHistory(
        history[historyIndex]
    );

}


function redo(){

    if(
        historyIndex >=
        history.length - 1
    ){

        return;

    }

    historyIndex++;

    restoreHistory(
        history[historyIndex]
    );

}


/* =========================================================
   REBIND EVENTS
========================================================= */

function bindSVGEvents(){

    svg.addEventListener(
        "mousedown",
        svgMouseDown
    );

    svg.addEventListener(
        "mousemove",
        svgMouseMove
    );

    svg.addEventListener(
        "mouseup",
        svgMouseUp
    );

}


/* =========================================================
   ZOOM
========================================================= */

function applyZoom(){

    workspace.style.transform =
        `translate(-50%,-50%) scale(${zoom})`;

    document.getElementById(
        "zoomLabel"
    ).textContent =
        Math.round(zoom * 100) + "%";

}


function zoomIn(){

    zoom =
        Math.min(
            4,
            zoom + .1
        );

    applyZoom();

}


function zoomOut(){

    zoom =
        Math.max(
            .2,
            zoom - .1
        );

    applyZoom();

}


function zoomReset(){

    zoom=1;

    applyZoom();

}


/* =========================================================
   NORMALIZE COLOR
========================================================= */

function normalizeColor(color){

    if(
        !color ||
        color === "none"
    ){

        return "#000000";

    }

    if(color.startsWith("#")){

        return color;

    }

    const temp =
        document.createElement("div");

    temp.style.color=color;

    document.body.appendChild(temp);

    const rgb =
        getComputedStyle(temp)
            .color;

    temp.remove();

    const match =
        rgb.match(/\d+/g);

    if(!match){

        return "#000000";

    }

    return "#" +
        match
            .slice(0,3)
            .map(
                n =>
                    Number(n)
                    .toString(16)
                    .padStart(2,"0")
            )
            .join("");

}


/* =========================================================
   LOAD SVG
========================================================= */

function loadSVGFile(filename){

    currentFile=filename;

    const content =
        project.files[filename];

    if(!content){

        newImage();

        return;

    }


    const parser =
        new DOMParser();

    const parsed =
        parser.parseFromString(
            content,
            "image/svg+xml"
        );


    const imported =
        document.importNode(
            parsed.documentElement,
            true
        );


    svg.replaceWith(
        imported
    );


    imported.id="svgCanvas";

    window.svg =
        document.getElementById(
            "svgCanvas"
        );


    document.getElementById(
        "fileStatus"
    ).textContent =
        filename;


    bindSVGEvents();

    history=[];

    historyIndex=-1;

    saveHistory();

    updateLayers();

}


/* =========================================================
   SAVE SVG
========================================================= */

function saveSVG(){

    if(!svg){

        return;

    }


    const clone =
        svg.cloneNode(true);


    clone
        .querySelectorAll("[data-layer]")
        .forEach(
            el => {

                el.style.outline="";

                el.removeAttribute(
                    "data-layer"
                );

            }
        );


    const serializer =
        new XMLSerializer();


    const svgCode =
        serializer.serializeToString(
            clone
        );


    project.files[currentFile] =
        svgCode;


    if(
        typeof updateProjectMetadata ===
        "function"
    ){

        updateProjectMetadata();

    }


    document.getElementById(
        "fileStatus"
    ).textContent =
        "✓ Salvo: " + currentFile;


    if(
        typeof saveProject ===
        "function"
    ){

        saveProject();

    }

}


/* =========================================================
   PNG
========================================================= */

function downloadPNG(){

    const serializer =
        new XMLSerializer();

    const source =
        serializer.serializeToString(
            svg
        );


    const blob =
        new Blob(
            [source],
            {
                type:"image/svg+xml"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const image =
        new Image();


    image.onload=function(){

        const canvas =
            document.createElement(
                "canvas"
            );

        canvas.width =
            parseInt(
                svg.getAttribute("width")
            );

        canvas.height =
            parseInt(
                svg.getAttribute("height")
            );


        const ctx =
            canvas.getContext(
                "2d"
            );


        ctx.drawImage(
            image,
            0,
            0
        );


        const png =
            canvas.toDataURL(
                "image/png"
            );


        const a =
            document.createElement(
                "a"
            );

        a.href=png;

        a.download =
            currentFile
                .split("/")
                .pop()
                .replace(
                    /\.svg$/i,
                    ".png"
                );

        a.click();

        URL.revokeObjectURL(url);

    };


    image.src=url;

}


/* =========================================================
   NEW
========================================================= */

function newImage(){

    svg.innerHTML = `
        <rect
            id="background"
            x="0"
            y="0"
            width="1000"
            height="650"
            fill="#ffffff"/>
    `;

    document.getElementById(
        "canvasWidth"
    ).value=1000;

    document.getElementById(
        "canvasHeight"
    ).value=650;

    document.getElementById(
        "backgroundColor"
    ).value="#ffffff";

    document.getElementById(
        "backgroundValue"
    ).textContent="#ffffff";

    deselect();

    saveHistory();

}


/* =========================================================
   CLOSE
========================================================= */

function closeEditor(){

    if(
        typeof closeImageEditor ===
        "function"
    ){

        closeImageEditor();

        return;

    }

    window.history.back();

}


/* =========================================================
   INITIAL
========================================================= */

function initializeEditor(){

    loadSVGFile(
        currentFile
    );

    applyZoom();

    updateLayers();

}


/* =========================================================
   START
========================================================= */

initializeEditor();
