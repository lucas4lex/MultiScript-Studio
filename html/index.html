<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MultiScript HTML Editor V14</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #111318;
    color: #e8e8e8;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    display: grid;
    grid-template-rows: 48px 42px 1fr 24px;
    width: 100vw;
    height: 100vh;
}

/* TOPBAR */

.topbar {
    background: #181a20;
    border-bottom: 1px solid #30333b;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 18px;
}

.logo {
    font-weight: 700;
    color: #fff;
    font-size: 15px;
}

.logo span {
    color: #4da3ff;
}

.version {
    color: #777d89;
    font-size: 11px;
}

.topmenu {
    display: flex;
    gap: 4px;
}

.topmenu button {
    background: transparent;
    border: 0;
    color: #bfc3cc;
    padding: 7px 10px;
    border-radius: 4px;
}

.topmenu button:hover {
    background: #292d36;
    color: white;
}

.top-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
}

.project-name {
    color: #9ea4b1;
    font-size: 12px;
}

/* TOOLBAR */

.toolbar {
    background: #202329;
    border-bottom: 1px solid #30333b;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
}

.toolbar button {
    background: #292d35;
    border: 1px solid #3a3e47;
    color: #d8dbe1;
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
}

.toolbar button:hover {
    background: #343944;
}

.toolbar .primary {
    background: #1769aa;
    border-color: #2585d0;
    color: white;
}

.toolbar .primary:hover {
    background: #1b7bc5;
}

/* MAIN */

.main {
    min-height: 0;
    display: grid;
    grid-template-columns: 54px 250px minmax(450px, 1fr) 42%;
    background: #111318;
}

/* ACTIVITY BAR */

.activity {
    background: #181a20;
    border-right: 1px solid #30333b;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.activity button {
    width: 54px;
    height: 52px;
    background: transparent;
    border: 0;
    border-left: 2px solid transparent;
    color: #7f8692;
    font-size: 19px;
}

.activity button:hover,
.activity button.active {
    color: white;
    border-left-color: #4da3ff;
    background: #20232a;
}

/* SIDEBAR */

.sidebar {
    min-width: 0;
    background: #191b21;
    border-right: 1px solid #30333b;
    overflow: auto;
}

.sidebar-title {
    height: 40px;
    padding: 13px 14px 8px;
    color: #aeb4bf;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .5px;
}

.tree {
    padding: 3px 8px 20px;
}

.tree-row {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 29px;
    padding: 0 8px;
    border-radius: 4px;
    color: #c6cad2;
    font-size: 12px;
    user-select: none;
}

.tree-row:hover {
    background: #252931;
}

.tree-row.selected {
    background: #2a3441;
    color: #fff;
}

.tree-row.folder {
    color: #ddd;
    font-weight: 600;
}

.tree-indent {
    padding-left: 22px;
}

.file-icon {
    width: 15px;
    text-align: center;
}

/* WORKSPACE */

.workspace {
    min-width: 0;
    display: grid;
    grid-template-rows: 37px 1fr 155px;
    background: #111318;
}

.tabs {
    background: #191b20;
    border-bottom: 1px solid #30333b;
    display: flex;
    align-items: stretch;
    overflow-x: auto;
}

.tab {
    min-width: 125px;
    max-width: 180px;
    padding: 10px 13px;
    border-right: 1px solid #30333b;
    color: #888f9c;
    font-size: 12px;
    cursor: pointer;
}

.tab.active {
    background: #111318;
    color: white;
    border-top: 2px solid #4da3ff;
    padding-top: 8px;
}

/* EDITOR */

.editor-area {
    position: relative;
    min-height: 0;
    background: #101216;
}

.editor-wrap {
    display: flex;
    width: 100%;
    height: 100%;
}

.lines {
    width: 52px;
    background: #15171c;
    border-right: 1px solid #252831;
    color: #555b67;
    text-align: right;
    padding: 12px 9px;
    font: 13px/20px Consolas, monospace;
    overflow: hidden;
    user-select: none;
}

#codeEditor {
    width: calc(100% - 52px);
    height: 100%;
    resize: none;
    outline: none;
    border: 0;
    background: #101216;
    color: #d9dde5;
    padding: 12px 14px;
    font: 13px/20px Consolas, "Courier New", monospace;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

/* TERMINAL */

.terminal {
    background: #0d0f12;
    border-top: 1px solid #30333b;
    min-height: 0;
}

.terminal-head {
    height: 31px;
    background: #181a1f;
    border-bottom: 1px solid #30333b;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 12px;
    color: #9299a5;
    font-size: 11px;
}

.terminal-head .active {
    color: white;
}

#terminalOutput {
    padding: 8px 12px;
    height: calc(100% - 31px);
    overflow: auto;
    font: 12px/18px Consolas, monospace;
    color: #aeb5c0;
}

.log-ok {
    color: #6edc8c;
}

.log-info {
    color: #65b9ff;
}

.log-warning {
    color: #e7c85b;
}

/* PREVIEW */

.preview {
    min-width: 0;
    background: #d7d7d7;
    border-left: 1px solid #30333b;
    display: grid;
    grid-template-rows: 37px 1fr;
}

.preview-head {
    background: #191b20;
    color: #9298a3;
    border-bottom: 1px solid #30333b;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
}

#previewFrame {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

/* STATUS */

.status {
    background: #1769aa;
    color: white;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 10px;
    font-size: 10px;
}

.status-right {
    margin-left: auto;
}

/* MODAL */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,.72);
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal {
    width: 620px;
    max-height: 85vh;
    overflow: auto;
    background: #1b1e24;
    border: 1px solid #3b404a;
    border-radius: 8px;
    box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

.modal-head {
    padding: 16px 18px;
    border-bottom: 1px solid #343841;
    display: flex;
    align-items: center;
}

.modal-head h2 {
    margin: 0;
    font-size: 15px;
}

.modal-close {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: #9298a3;
    font-size: 18px;
}

.modal-body {
    padding: 18px;
}

.modal-foot {
    padding: 12px 18px;
    border-top: 1px solid #343841;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.form-label {
    display: block;
    margin-bottom: 7px;
    color: #b8bdc7;
    font-size: 12px;
}

.input,
.select,
.generator-textarea {
    width: 100%;
    background: #101216;
    border: 1px solid #393e47;
    color: #e7e9ed;
    border-radius: 5px;
    outline: none;
}

.input,
.select {
    height: 38px;
    padding: 0 10px;
}

.generator-textarea {
    min-height: 300px;
    padding: 12px;
    resize: vertical;
    font: 13px/20px Consolas, monospace;
}

.input:focus,
.select:focus,
.generator-textarea:focus {
    border-color: #4da3ff;
}

.btn {
    border: 1px solid #3c414b;
    background: #292d35;
    color: white;
    padding: 8px 13px;
    border-radius: 5px;
}

.btn:hover {
    background: #353a45;
}

.btn.primary {
    background: #1769aa;
    border-color: #2785cf;
}

.btn.danger {
    background: #762d35;
    border-color: #9d3d48;
}

/* GENERATOR */

.generator-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.plugin-list {
    border: 1px solid #363b45;
    border-radius: 6px;
    overflow: hidden;
}

.plugin-item {
    padding: 11px 12px;
    border-bottom: 1px solid #30343c;
    display: flex;
    align-items: center;
    gap: 10px;
}

.plugin-item:last-child {
    border-bottom: 0;
}

.plugin-item input {
    width: 16px;
    height: 16px;
}

.plugin-info strong {
    display: block;
    font-size: 12px;
}

.plugin-info small {
    color: #7f8794;
    font-size: 10px;
}

.section-title {
    color: #aeb4bf;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    margin: 16px 0 8px;
}

/* PLUGINS */

.plugin-card {
    padding: 13px;
    border: 1px solid #363b45;
    border-radius: 6px;
    margin-bottom: 8px;
    background: #17191e;
}

.plugin-card strong {
    font-size: 13px;
}

.plugin-card p {
    color: #8f96a2;
    font-size: 11px;
    margin: 6px 0 10px;
}

.plugin-status {
    color: #6edc8c;
    font-size: 10px;
}

/* SCROLL */

::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

::-webkit-scrollbar-track {
    background: #111318;
}

::-webkit-scrollbar-thumb {
    background: #363b45;
}

::-webkit-scrollbar-thumb:hover {
    background: #464c58;
}
</style>
</head>

<body>

<div class="app">

    <!-- TOPBAR -->
    <header class="topbar">

        <div class="logo">
            MultiScript <span>HTML Editor</span>
        </div>

        <div class="version">
            V14.0.0
        </div>

        <nav class="topmenu">
            <button onclick="openPageGenerator()">Gerar Página</button>
            <button onclick="openPlugins()">Plugins</button>
            <button onclick="formatHTML()">Formatar</button>
            <button onclick="saveProject()">Salvar</button>
        </nav>

        <div class="top-right">
            <span class="project-name">
                MEU-PROJETO
            </span>
        </div>

    </header>

    <!-- TOOLBAR -->
    <div class="toolbar">

        <button onclick="newPage()">
            ＋ Nova Página
        </button>

        <button onclick="openPageGenerator()">
            ⚙ Gerador
        </button>

        <button onclick="openPlugins()">
            🧩 Plugins
        </button>

        <button onclick="runPreview()">
            ▶ Preview
        </button>

        <button onclick="saveProject()">
            💾 Salvar
        </button>

        <button class="primary" onclick="exportZIP()">
            📦 Exportar ZIP
        </button>

        <div style="flex:1"></div>

        <button onclick="clearTerminal()">
            Limpar Terminal
        </button>

    </div>

    <!-- MAIN -->
    <main class="main">

        <!-- ACTIVITY -->
        <aside class="activity">

            <button
                class="active"
                title="Explorador"
                onclick="showExplorer()">
                📁
            </button>

            <button
                title="Gerador"
                onclick="openPageGenerator()">
                ＋
            </button>

            <button
                title="Plugins"
                onclick="openPlugins()">
                🧩
            </button>

        </aside>

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="sidebar-title">
                EXPLORADOR
            </div>

            <div class="tree">

                <div class="tree-row folder">
                    📂 MEU-PROJETO
                </div>

                <div class="tree-row folder tree-indent">
                    📂 PUBLIC
                </div>

                <div id="fileTree"></div>

                <div class="tree-row folder tree-indent">
                    📂 plugins
                </div>

                <div id="pluginTree"></div>

            </div>

        </aside>

        <!-- WORKSPACE -->
        <section class="workspace">

            <div
                class="tabs"
                id="tabs">
            </div>

            <div class="editor-area">

                <div class="editor-wrap">

                    <div
                        class="lines"
                        id="lineNumbers">
                    </div>

                    <textarea
                        id="codeEditor"
                        spellcheck="false"
                        oninput="editorChanged()"
                        onscroll="syncLines()"
                        onkeydown="handleEditorKey(event)">
                    </textarea>

                </div>

            </div>

            <div class="terminal">

                <div class="terminal-head">
                    <span class="active">
                        TERMINAL
                    </span>

                    <span>
                        OUTPUT
                    </span>
                </div>

                <div id="terminalOutput"></div>

            </div>

        </section>

        <!-- PREVIEW -->
        <section class="preview">

            <div class="preview-head">
                PREVIEW — index.html
            </div>

            <iframe
                id="previewFrame"
                sandbox="allow-scripts allow-forms allow-modals">
            </iframe>

        </section>

    </main>

    <!-- STATUS -->
    <footer class="status">

        <span id="statusMessage">
            Pronto
        </span>

        <span>
            UTF-8
        </span>

        <span>
            HTML
        </span>

        <span class="status-right">
            MultiScript V14
        </span>

    </footer>

</div>

<script>
"use strict";

/*
===========================================================
MULTISCRIPT HTML EDITOR V14
===========================================================
*/

const PROJECT_KEY = "multiscript_v14_project";

let project = {
    name: "MEU-PROJETO",

    files: {

        "index.html": `<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Site</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>Meu Site</h1>

        <nav>
            <a href="index.html">Início</a>
        </nav>
    </header>

    <main>

        <section class="hero">
            <h2>Bem-vindo!</h2>

            <p>
                Esta página foi criada pelo MultiScript HTML Editor V14.
            </p>
        </section>

        <section>
            <h2>Sobre o projeto</h2>

            <p>
                Use o Gerador de Páginas para criar novas páginas HTML.
            </p>
        </section>

    </main>

    <footer>
        <p>Meu Site</p>
    </footer>

    <script src="script.js"><\/script>
</body>
</html>`,

        "style.css": `* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.site-header {
    background: #111827;
    color: white;
    padding: 25px;
}

.site-header nav a {
    color: white;
}

main {
    max-width: 1000px;
    margin: auto;
    padding: 50px 25px;
}

.hero {
    background: white;
    padding: 50px;
    border-radius: 12px;
    margin-bottom: 30px;
}

footer {
    background: #111827;
    color: white;
    text-align: center;
    padding: 25px;
}`,

        "script.js": `console.log("MultiScript V14 iniciado.");

document.addEventListener("DOMContentLoaded", function () {
    console.log("Página carregada.");
});`
    },

    plugins: {}
};

let currentFile = "index.html";
let dirty = false;

/* =========================================================
   PLUGINS
========================================================= */

const pluginLibrary = {

    contato: {
        name: "Formulário de Contato",
        description: "Processa formulários através de PHP.",
        file: "contato.php",

        php: `<?php

/*
    MultiScript V14
    Plugin: Formulário de Contato
*/

if ($_SERVER['REQUEST_METHOD'] !== 'POST') {
    http_response_code(405);
    exit('Método não permitido.');
}

$nome = trim($_POST['nome'] ?? '');
$email = trim($_POST['email'] ?? '');
$mensagem = trim($_POST['mensagem'] ?? '');

if ($nome === '' || $email === '' || $mensagem === '') {
    exit('Preencha todos os campos.');
}

$destino = 'seuemail@exemplo.com';

$assunto = 'Novo contato pelo site';

$corpo =
    "Nome: " . $nome . "\\n" .
    "E-mail: " . $email . "\\n\\n" .
    "Mensagem:\\n" . $mensagem;

$headers =
    "From: " . $email . "\\r\\n" .
    "Reply-To: " . $email . "\\r\\n";

mail($destino, $assunto, $corpo, $headers);

echo 'Mensagem enviada com sucesso.';
?>`
    },

    antispam: {
        name: "Anti-Spam",
        description: "Filtro básico contra envios automatizados.",
        file: "anti-spam.php",

        php: `<?php

/*
    MultiScript V14
    Plugin: Anti-Spam
*/

session_start();

$tempoMinimo = 3;

if (!isset($_SESSION['multiscript_inicio'])) {
    $_SESSION['multiscript_inicio'] = time();
}

if (
    time() - $_SESSION['multiscript_inicio']
    < $tempoMinimo
) {
    http_response_code(429);
    exit('Envio muito rápido. Tente novamente.');
}

?>`
    },

    whatsapp: {
        name: "WhatsApp",
        description: "Gera links e integração básica com WhatsApp.",
        file: "whatsapp.php",

        php: `<?php

/*
    MultiScript V14
    Plugin: WhatsApp
*/

$numero = preg_replace(
    '/[^0-9]/',
    '',
    $_GET['numero'] ?? ''
);

$mensagem = $_GET['mensagem'] ?? '';

if ($numero === '') {
    exit('Número não informado.');
}

$url =
    'https://wa.me/' .
    $numero .
    '?text=' .
    urlencode($mensagem);

header('Location: ' . $url);

exit;
?>`
    },

    seo: {
        name: "SEO Básico",
        description: "Arquivo PHP para informações básicas de SEO.",
        file: "seo.php",

        php: `<?php

/*
    MultiScript V14
    Plugin: SEO Básico
*/

$siteTitle = 'Meu Site';

$description =
    'Descrição do meu site.';

$keywords =
    'site, empresa, serviços';

?>`
    }
};

/* =========================================================
   INIT
========================================================= */

function init() {

    loadProject();

    renderFileTree();
    renderPluginTree();

    openFile(currentFile);

    updateLineNumbers();

    runPreview();

    log(
        "MultiScript V14 iniciado.",
        "ok"
    );

    log(
        "Projeto carregado com " +
        Object.keys(project.files).length +
        " arquivo(s).",
        "info"
    );
}

/* =========================================================
   PROJECT
========================================================= */

function loadProject() {

    const saved =
        localStorage.getItem(PROJECT_KEY);

    if (!saved) {
        return;
    }

    try {

        const data =
            JSON.parse(saved);

        if (
            data &&
            data.files
        ) {
            project = data;

            if (!project.plugins) {
                project.plugins = {};
            }

            log(
                "Projeto restaurado do armazenamento local.",
                "ok"
            );
        }

    } catch (error) {

        console.error(error);

        log(
            "Não foi possível restaurar o projeto.",
            "warning"
        );
    }
}

function saveProject() {

    localStorage.setItem(
        PROJECT_KEY,
        JSON.stringify(project)
    );

    dirty = false;

    updateStatus("Projeto salvo.");

    log(
        "Projeto salvo no armazenamento local.",
        "ok"
    );
}

/* =========================================================
   FILE TREE
========================================================= */

function renderFileTree() {

    const tree =
        document.getElementById("fileTree");

    tree.innerHTML = "";

    Object.keys(project.files)
        .forEach(function (file) {

            const row =
                document.createElement("div");

            row.className =
                "tree-row tree-indent";

            if (file === currentFile) {
                row.classList.add("selected");
            }

            let icon = "📄";

            if (file.endsWith(".html")) {
                icon = "🌐";
            }

            if (file.endsWith(".css")) {
                icon = "🎨";
            }

            if (file.endsWith(".js")) {
                icon = "📜";
            }

            row.innerHTML =
                `<span class="file-icon">${icon}</span>
                 <span>${escapeHTML(file)}</span>`;

            row.onclick =
                function () {
                    openFile(file);
                };

            tree.appendChild(row);
        });
}

function renderPluginTree() {

    const tree =
        document.getElementById("pluginTree");

    tree.innerHTML = "";

    Object.keys(project.plugins)
        .forEach(function (key) {

            const plugin =
                pluginLibrary[key];

            if (!plugin) {
                return;
            }

            const row =
                document.createElement("div");

            row.className =
                "tree-row tree-indent";

            row.innerHTML =
                `<span class="file-icon">🐘</span>
                 <span>${escapeHTML(plugin.file)}</span>`;

            row.onclick =
                function () {

                    const path =
                        "plugins/" +
                        plugin.file;

                    if (!project.files[path]) {

                        project.files[path] =
                            plugin.php;

                    }

                    openFile(path);
                };

            tree.appendChild(row);
        });
}

/* =========================================================
   EDITOR
========================================================= */

function openFile(file) {

    if (!project.files.hasOwnProperty(file)) {
        return;
    }

    currentFile = file;

    document.getElementById(
        "codeEditor"
    ).value = project.files[file];

    renderTabs();
    renderFileTree();
    updateLineNumbers();
    syncLines();

    updateStatus(
        "Editando " + file
    );

    if (file === "index.html") {
        runPreview();
    }
}

function renderTabs() {

    const tabs =
        document.getElementById("tabs");

    tabs.innerHTML = "";

    const tab =
        document.createElement("div");

    tab.className =
        "tab active";

    tab.textContent =
        currentFile;

    tabs.appendChild(tab);
}

function editorChanged() {

    project.files[currentFile] =
        document.getElementById(
            "codeEditor"
        ).value;

    dirty = true;

    updateLineNumbers();

    updateStatus(
        "Alterações não salvas"
    );

    if (currentFile === "index.html") {
        runPreview();
    }
}

function updateLineNumbers() {

    const code =
        document.getElementById(
            "codeEditor"
        ).value;

    const total =
        Math.max(
            1,
            code.split("\n").length
        );

    let html = "";

    for (let i = 1; i <= total; i++) {
        html += i + "<br>";
    }

    document.getElementById(
        "lineNumbers"
    ).innerHTML = html;
}

function syncLines() {

    const editor =
        document.getElementById(
            "codeEditor"
        );

    document.getElementById(
        "lineNumbers"
    ).scrollTop =
        editor.scrollTop;
}

function handleEditorKey(event) {

    if (event.key === "Tab") {

        event.preventDefault();

        const editor =
            event.target;

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        editor.value =
            editor.value.substring(
                0,
                start
            ) +
            "    " +
            editor.value.substring(end);

        editor.selectionStart =
            editor.selectionEnd =
            start + 4;

        editorChanged();
    }

    if (
        event.ctrlKey &&
        event.key.toLowerCase() === "s"
    ) {

        event.preventDefault();

        saveProject();
    }
}

function generatePage() {

    let filename =
        document.getElementById(
            "generatorFilename"
        ).value.trim();

    let content =
        document.getElementById(
            "generatorContent"
        ).value;

    if (!filename) {
        alert("Digite o nome do arquivo.");
        return;
    }

    filename =
        filename
            .replace(/\\/g, "")
            .replace(/\//g, "")
            .trim();

    if (!filename.toLowerCase().endsWith(".html")) {
        filename += ".html";
    }

    if (filename === "index.html") {

        if (
            !confirm(
                "index.html já é a página principal. Deseja substituir?"
            )
        ) {
            return;
        }
    }

    const pluginsToInstall = [];

    [
        "contato",
        "antispam",
        "whatsapp",
        "seo"
    ].forEach(function (id) {

        const checkbox =
            document.getElementById(
                "plugin_" + id
            );

        if (
            checkbox &&
            checkbox.checked
        ) {
            pluginsToInstall.push(id);
        }
    });

    pluginsToInstall.forEach(
        installPlugin
    );

    const html =
        buildHTMLPage(
            filename,
            content,
            pluginsToInstall
        );

    project.files[filename] =
        html;

    currentFile = filename;

    closeModal();

    renderFileTree();
    renderPluginTree();
    openFile(filename);

    saveProject();

    log(
        "Página criada: " +
        filename,
        "ok"
    );

    log(
        "Plugins selecionados: " +
        (
            pluginsToInstall.length
                ? pluginsToInstall.join(", ")
                : "nenhum"
        ),
        "info"
    );
}

    project.files[
        "plugins/" + plugin.file

function uninstallPlugin(id) {

        pluginLibrary[id];

}

function runPreview() {

    const html =
        project.files["index.html"];

    if (!html) {
        return;
    }

    const frame =
        document.getElementById(
            "previewFrame"
        );

    const css =
        project.files["style.css"] || "";

    const js =
        project.files["script.js"] || "";

    let output =
        html;

    if (
        !/<link[^>]+href=["']style\.css["']/i
            .test(output)
    ) {

        output =
            output.replace(
                "</head>",
                "<style>\n" +
                css +
                "\n</style>\n</head>"
            );
    }

    const safeJS =
        js.replace(
            /<\/script/gi,
            "<" + "/script"
        );

    if (
        !/<script[^>]+src=["']script\.js["']/i
            .test(output)
    ) {

        output =
            output.replace(
                "</body>",
                "<script>\n" +
                safeJS +
                "\n<" +
                "/script>\n</body>"
            );

    } else {

        output =
            output.replace(
                /<script[^>]+src=["']script\.js["'][^>]*><\/script>/i,
                "<script>\n" +
                safeJS +
                "\n<" +
                "/script>"
            );
    }

    frame.srcdoc =
        output;

    updateStatus(
        "Preview atualizado."
    );
}

/* =========================================================
   FORMAT
========================================================= */

function formatHTML() {

    if (
        !currentFile.endsWith(".html")
    ) {

        alert(
            "O formatador foi criado para arquivos HTML."
        );

        return;
    }

    let html =
        document.getElementById(
            "codeEditor"
        ).value;

    html =
        simpleFormatHTML(html);

    document.getElementById(
        "codeEditor"
    ).value =
        html;

    editorChanged();

    log(
        "HTML formatado.",
        "ok"
    );
}

function simpleFormatHTML(html) {

    html =
        html
            .replace(/>\s*</g, ">\n<")
            .trim();

    const lines =
        html.split("\n");

    let depth = 0;

    const voidTags = [
        "area",
        "base",
        "br",
        "col",
        "embed",
        "hr",
        "img",
        "input",
        "link",
        "meta",
        "param",
        "source",
        "track",
        "wbr"
    ];

    return lines.map(function (line) {

        line =
            line.trim();

        if (!line) {
            return "";
        }

        if (
            /^<\/[^>]+>/.test(line)
        ) {
            depth =
                Math.max(
                    0,
                    depth - 1
                );
        }

        const result =
            "    ".repeat(depth) +
            line;

        const opening =
            line.match(
                /^<([a-zA-Z0-9]+)(?:\s|>)/ 
            );

        const closing =
            /<\/[a-zA-Z0-9]+>/.test(line);

        if (
            opening &&
            !closing &&
            !line.startsWith("<!")
        ) {

            const tag =
                opening[1].toLowerCase();

            if (
                !voidTags.includes(tag)
            ) {
                depth++;
            }
        }

        return result;

    }).join("\n");
}

async function confirmExportZIP() {

    const credit =
        document.getElementById(
            "creditSelect"
        ).value;

    localStorage.setItem(
        "multiscript_credit",
        credit
    );

    closeModal();

    const zip =
        new JSZip();

    const exportedFiles = {};

    Object.keys(project.files)
        .forEach(function (file) {

            let content =
                project.files[file];

            if (
                file.endsWith(".html")
            ) {

                content =
                    insertCredit(
                        content,
                        credit
                    );
            }

            exportedFiles[file] =
                content;

            zip.file(
                file,
                content
            );
        });

    const blob =
        await zip.generateAsync({
            type: "blob"
        });

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        project.name +
        ".zip";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    log(
        "ZIP exportado com sucesso.",
        "ok"
    );

    updateStatus(
        "ZIP exportado."
    );
}

function insertCredit(
    html,
    credit
) {

    const begin =
        "<!-- MULTISCRIPT CREDITOS INICIO -->";

    const end =
        "<!-- MULTISCRIPT CREDITOS FIM -->";

    html =
        html.replace(
            new RegExp(
                begin +
                "[\\s\\S]*?" +
                end,
                "gi"
            ),
            ""
        );

    if (credit === "none") {
        return html;
    }

    const credits = {

        multipage: {
            name: "Multipage Mel",
            url: "https://multipagemel.pages.dev/"
        },

        corretores: {
            name: "Apenas Corretores",
            url: "https://apenascorretores.pages.dev/"
        },

        homemsite: {
            name: "HomemSite",
            url: "https://homemsite.pages.dev/"
        },

        parana: {
            name: "HomemSite Paraná",
            url: "https://homemsite.pages.dev/parana/"
        }

    };

    const selected =
        credits[credit];

    if (!selected) {
        return html;
    }

    const block = `

<!-- MULTISCRIPT CREDITOS INICIO -->

<footer class="multiscript-credit">

    <p>
        Este site garante a segurança na coleta
        e tratamento de dados, em conformidade
        com a LGPD.
    </p>

    <p>
        © V14.0.0 by Multipage SEO Editor
    </p>

    <p>
        <a
            href="${selected.url}"
            target="_blank"
            rel="noopener"
        >
            ${selected.name}
        </a>
    </p>

</footer>

<!-- MULTISCRIPT CREDITOS FIM -->

`;

    return html.replace(
        /<\/body>/i,
        block +
        "</body>"
    );
}

/* =========================================================

========================================================= */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
}
