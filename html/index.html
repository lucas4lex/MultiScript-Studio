<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MultiScript HTML Editor V14</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif;
    background: #11151a;
    color: #e7eaf0;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.app {
    width: 100vw;
    height: 100vh;
    display: grid;
    grid-template-rows: 48px 1fr 24px;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar {
    background: #1b2027;
    border-bottom: 1px solid #303640;
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 12px;
}

.logo {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: linear-gradient(135deg, #1677ff, #744cff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 14px;
}

.title {
    font-size: 14px;
    font-weight: 600;
}

.version {
    color: #8c96a6;
    font-size: 11px;
}

.top-actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
}

.tool-btn {
    border: 1px solid #353c47;
    background: #242a32;
    color: #dfe4ec;
    padding: 7px 11px;
    border-radius: 5px;
    font-size: 12px;
}

.tool-btn:hover {
    background: #303741;
}

.tool-btn.primary {
    background: #1266d6;
    border-color: #1975ed;
    color: white;
}

.tool-btn.primary:hover {
    background: #1975ed;
}

.tool-btn.success {
    background: #16794c;
    border-color: #1b915b;
    color: white;
}

/* =========================================================
   MAIN
========================================================= */

.main {
    min-height: 0;
    display: grid;
    grid-template-columns: 54px 250px minmax(500px, 1fr) 40%;
}

/* =========================================================
   ACTIVITY BAR
========================================================= */

.activity {
    background: #171b20;
    border-right: 1px solid #2c323b;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 10px;
    gap: 5px;
}

.activity-btn {
    width: 42px;
    height: 42px;
    border: 0;
    background: transparent;
    color: #818a98;
    font-size: 18px;
    border-radius: 5px;
}

.activity-btn:hover,
.activity-btn.active {
    background: #272d35;
    color: white;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    background: #191e24;
    border-right: 1px solid #303640;
    overflow: auto;
}

.sidebar-header {
    height: 44px;
    display: flex;
    align-items: center;
    padding: 0 14px;
    color: #aab3c0;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .7px;
}

.project-name {
    padding: 7px 14px;
    color: #dce2eb;
    font-size: 12px;
    font-weight: 700;
}

.file-tree {
    padding: 3px 7px;
}

.tree-title {
    color: #7f8997;
    font-size: 10px;
    padding: 8px 7px 5px;
    letter-spacing: .7px;
    font-weight: 700;
}

.file-item {
    min-height: 31px;
    padding: 0 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-radius: 4px;
    color: #cbd1db;
    font-size: 12px;
    cursor: pointer;
}

.file-item:hover {
    background: #272d35;
}

.file-item.active {
    background: #303742;
    color: white;
}

.folder {
    color: #8e99a8;
    font-size: 11px;
    padding: 9px 7px 4px;
}

.file-html {
    color: #e44d26;
}

.file-css {
    color: #1677ff;
}

.file-js {
    color: #f3d34a;
}

.file-php {
    color: #777bb4;
}

.file-ms {
    color: #54c7ff;
}

.plugin-area {
    margin-top: 15px;
    border-top: 1px solid #2c323a;
    padding-top: 8px;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-area {
    min-width: 0;
    display: grid;
    grid-template-rows: 38px 1fr 150px;
    background: #101419;
}

.tabs {
    display: flex;
    background: #191e24;
    border-bottom: 1px solid #303640;
    overflow: hidden;
}

.tab {
    min-width: 150px;
    height: 38px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
    border-right: 1px solid #303640;
    color: #9da6b4;
    font-size: 12px;
}

.tab.active {
    color: white;
    background: #101419;
    border-top: 2px solid #1877f2;
}

.editor-wrapper {
    min-height: 0;
    display: grid;
    grid-template-columns: 48px 1fr;
    overflow: hidden;
}

.lines {
    background: #0d1115;
    color: #56606d;
    text-align: right;
    padding: 13px 9px;
    font: 13px/20px Consolas, monospace;
    user-select: none;
    overflow: hidden;
}

#editor {
    width: 100%;
    height: 100%;
    border: 0;
    outline: 0;
    resize: none;
    padding: 13px 15px;
    background: #101419;
    color: #d9dee7;
    font: 13px/20px Consolas, "Courier New", monospace;
    tab-size: 4;
    white-space: pre;
    overflow: auto;
}

/* =========================================================
   TERMINAL
========================================================= */

.terminal {
    min-height: 0;
    background: #0b0e11;
    border-top: 1px solid #303640;
    overflow: auto;
    font: 12px/19px Consolas, monospace;
    padding: 9px 12px;
}

.terminal-title {
    color: #788392;
    margin-bottom: 5px;
}

.log-line {
    color: #9fa8b5;
}

.log-success {
    color: #6bd58c;
}

.log-error {
    color: #ff7272;
}

.log-info {
    color: #62a9ff;
}

/* =========================================================
   PREVIEW
========================================================= */

.preview {
    min-width: 0;
    background: #dfe3e8;
    display: grid;
    grid-template-rows: 38px 1fr;
    border-left: 1px solid #303640;
}

.preview-header {
    background: #191e24;
    border-bottom: 1px solid #303640;
    display: flex;
    align-items: center;
    padding: 0 12px;
    color: #aeb6c2;
    font-size: 11px;
}

.preview-header strong {
    color: white;
    margin-right: 8px;
}

#previewFrame {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
}

/* =========================================================
   STATUS
========================================================= */

.statusbar {
    background: #1266d6;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 10px;
}

.status-right {
    margin-left: auto;
    display: flex;
    gap: 15px;
}

/* =========================================================
   MODAL
========================================================= */

.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .68);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.modal-backdrop.open {
    display: flex;
}

.modal {
    width: 720px;
    max-height: 86vh;
    background: #1b2027;
    border: 1px solid #3a424d;
    border-radius: 9px;
    box-shadow: 0 25px 80px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.modal-header {
    min-height: 50px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    border-bottom: 1px solid #303640;
}

.modal-header h2 {
    margin: 0;
    font-size: 14px;
}

.modal-close {
    margin-left: auto;
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #8f99a8;
    font-size: 18px;
}

.modal-close:hover {
    background: #2a3038;
    color: white;
}

.modal-body {
    padding: 20px;
    overflow: auto;
}

.modal-footer {
    min-height: 58px;
    border-top: 1px solid #303640;
    padding: 10px 18px;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}

.form-label {
    display: block;
    color: #aeb7c4;
    font-size: 11px;
    margin-bottom: 7px;
    font-weight: 600;
}

.form-control,
.form-select {
    width: 100%;
    border: 1px solid #39414c;
    background: #11151a;
    color: #e5e9ef;
    padding: 10px 11px;
    border-radius: 5px;
    outline: 0;
    font-size: 12px;
}

.form-control:focus,
.form-select:focus {
    border-color: #1877f2;
}

textarea.form-control {
    min-height: 180px;
    resize: vertical;
    font-family: Consolas, monospace;
}

.form-group {
    margin-bottom: 17px;
}

/* =========================================================
   PAGE TYPE
========================================================= */

.type-question {
    text-align: center;
    margin-bottom: 22px;
}

.type-question h3 {
    margin: 0 0 7px;
    font-size: 18px;
    color: white;
}

.type-question p {
    margin: 0;
    color: #8e98a6;
    font-size: 12px;
}

.type-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.type-card {
    position: relative;
}

.type-card input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.type-card label {
    min-height: 145px;
    border: 1px solid #39414c;
    border-radius: 8px;
    background: #14191f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 15px;
    cursor: pointer;
    transition: .15s;
}

.type-card label:hover {
    background: #20262e;
    border-color: #536071;
}

.type-card input:checked + label {
    background: #172b48;
    border-color: #1877f2;
    box-shadow: inset 0 0 0 1px #1877f2;
}

.type-icon {
    width: 48px;
    height: 48px;
    border-radius: 10px;
    background: #262d36;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    margin-bottom: 12px;
}

.type-name {
    color: white;
    font-size: 13px;
    font-weight: 700;
}

.type-desc {
    color: #818b99;
    font-size: 10px;
    margin-top: 5px;
}

/* =========================================================
   CHECKBOXES
========================================================= */

.option-box {
    border: 1px solid #39414c;
    background: #14191f;
    border-radius: 7px;
    padding: 13px;
    margin-bottom: 18px;
}

.option-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    cursor: pointer;
}

.option-check input {
    margin-top: 3px;
    accent-color: #1877f2;
}

.option-check strong {
    display: block;
    color: white;
    font-size: 12px;
}

.option-check span {
    display: block;
    color: #7f8996;
    font-size: 10px;
    margin-top: 4px;
}

/* =========================================================
   PLUGINS
========================================================= */

.plugin-list {
    border: 1px solid #353d48;
    border-radius: 5px;
    background: #11151a;
    max-height: 170px;
    overflow: auto;
}

.plugin-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 11px;
    border-bottom: 1px solid #252b33;
    font-size: 11px;
}

.plugin-row:last-child {
    border-bottom: 0;
}

.plugin-row input {
    accent-color: #1877f2;
}

.no-plugins {
    padding: 13px;
    color: #737d8a;
    font-size: 11px;
}

/* =========================================================
   CREDIT
========================================================= */

.credit-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 9px;
}

.credit-option {
    border: 1px solid #39414c;
    background: #14191f;
    border-radius: 6px;
    padding: 12px;
    cursor: pointer;
}

.credit-option:hover {
    border-color: #596576;
    background: #1d232b;
}

.credit-option strong {
    display: block;
    color: white;
    font-size: 12px;
}

.credit-option span {
    display: block;
    margin-top: 4px;
    color: #7f8996;
    font-size: 10px;
}

/* =========================================================
   MOBILE DO EDITOR
========================================================= */

@media (max-width: 1100px) {

    .main {
        grid-template-columns: 54px 210px minmax(400px, 1fr);
    }

    .preview {
        display: none;
    }

    .top-actions .optional-action {
        display: none;
    }

}

@media (max-width: 760px) {

    .app {
        grid-template-rows: 56px 1fr 24px;
    }

    .topbar {
        padding: 0 9px;
    }

    .title {
        font-size: 12px;
    }

    .version {
        display: none;
    }

    .top-actions {
        gap: 4px;
    }

    .top-actions .tool-btn {
        padding: 6px 8px;
        font-size: 10px;
    }

    .main {
        display: flex;
        flex-direction: column;
    }

    .activity,
    .sidebar {
        display: none;
    }

    .editor-area {
        flex: 1;
        min-height: 0;
        grid-template-rows: 38px minmax(0, 1fr) 110px;
    }

    .editor-wrapper {
        grid-template-columns: 38px 1fr;
    }

    .lines {
        font-size: 11px;
        padding-right: 6px;
    }

    #editor {
        font-size: 12px;
        padding: 10px;
    }

    .preview {
        display: none;
    }

    .type-grid {
        grid-template-columns: 1fr;
    }

    .type-card label {
        min-height: 95px;
    }

    .credit-grid {
        grid-template-columns: 1fr;
    }

    .modal {
        width: calc(100vw - 24px);
        max-height: calc(100vh - 24px);
    }

    .status-right span:nth-child(2),
    .status-right span:nth-child(3) {
        display: none;
    }
}

::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-track {
    background: #11151a;
}

::-webkit-scrollbar-thumb {
    background: #353d48;
    border-radius: 8px;
}

::-webkit-scrollbar-thumb:hover {
    background: #46505d;
}
</style>
</head>

<body>

<div class="app">

<header class="topbar">

    <div class="logo">
        MS
    </div>

    <div>
        <div class="title">
            MultiScript HTML Editor
        </div>

        <div class="version">
            V14.0.0 — Page Generator
        </div>
    </div>

    <div class="top-actions">

        <button
            class="tool-btn success"
            onclick="openNewProject()"
        >
            ＋ Novo Projeto
        </button>

        <button
            class="tool-btn"
            onclick="openGenerator()"
        >
            ＋ Gerar Página
        </button>

        <button
            class="tool-btn optional-action"
            onclick="openPHPImporter()"
        >
            ＋ Plugin PHP
        </button>

        <button
            class="tool-btn optional-action"
            onclick="openPluginManager()"
        >
            Plugins
        </button>

        <button
            class="tool-btn optional-action"
            onclick="formatHTML()"
        >
            Formatar
        </button>

        <button
            class="tool-btn"
            onclick="saveProject()"
        >
            Salvar
        </button>

        <button
            class="tool-btn optional-action"
            onclick="previewPage()"
        >
            Preview
        </button>

        <button
            class="tool-btn primary"
            onclick="openCreditDialog()"
        >
            Exportar ZIP
        </button>

    </div>

</header>


<main class="main">

<aside class="activity">

    <button
        class="activity-btn active"
        title="Explorer"
    >
        ▤
    </button>

    <button
        class="activity-btn"
        title="Novo Projeto"
        onclick="openNewProject()"
    >
        ＋
    </button>

    <button
        class="activity-btn"
        title="Gerar Página"
        onclick="openGenerator()"
    >
        ◇
    </button>

    <button
        class="activity-btn"
        title="Plugins"
        onclick="openPluginManager()"
    >
        PHP
    </button>

</aside>


<aside class="sidebar">

    <div class="sidebar-header">
        EXPLORER
    </div>

    <div
        class="project-name"
        id="projectNameDisplay"
    >
        ▾ MEU-PROJETO
    </div>

    <div
        id="fileTree"
        class="file-tree"
    ></div>

    <div class="plugin-area">

        <div class="tree-title">
            PLUGINS DO USUÁRIO
        </div>

        <div
            id="pluginTree"
            class="file-tree"
        ></div>

    </div>

</aside>


<section class="editor-area">

    <div class="tabs">

        <div
            class="tab active"
            id="currentTab"
        >
            <span class="file-html">
                ▤
            </span>

            <span>
                index.html
            </span>
        </div>

    </div>


    <div class="editor-wrapper">

        <div
            id="lineNumbers"
            class="lines"
        >
            1
        </div>

        <textarea
            id="editor"
            spellcheck="false"
            oninput="editorInput()"
            onscroll="syncEditorScroll()"
            onkeydown="handleEditorKey(event)"
        ></textarea>

    </div>


    <div class="terminal">

        <div class="terminal-title">
            TERMINAL — MULTISCRIPT
        </div>

        <div id="terminalOutput"></div>

    </div>

</section>


<section class="preview">

    <div class="preview-header">

        <strong>
            PREVIEW
        </strong>

        <span id="previewFile">
            index.html
        </span>

    </div>

    <iframe
        id="previewFrame"
    ></iframe>

</section>

</main>


<footer class="statusbar">

    <span id="statusText">
        Pronto
    </span>

    <div class="status-right">

        <span id="fileStatus">
            index.html
        </span>

        <span>
            HTML
        </span>

        <span>
            UTF-8
        </span>

        <span>
            V14
        </span>

    </div>

</footer>

</div>


<div
    id="modalBackdrop"
    class="modal-backdrop"
>

    <div
        class="modal"
        id="modalBox"
    >

        <div class="modal-header">

            <h2 id="modalTitle">
                MultiScript
            </h2>

            <button
                class="modal-close"
                onclick="closeModal()"
            >
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody"
        ></div>

        <div
            class="modal-footer"
            id="modalFooter"
        ></div>

    </div>

</div>


<input
    type="file"
    id="phpInput"
    accept=".php"
    multiple
    hidden
>


<script>
"use strict";

/* =========================================================
   PROJETO
========================================================= */

let project = {

    name: "MEU-PROJETO",

    files: {

        "index.html": createInitialHTML(
            "MEU-PROJETO"
        ),

        "style.css": `

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

`,

        "script.js": `

console.log(
    "script.js carregado."
);

`,

        "multiscript.js": createMultiScriptJS(
            "MEU-PROJETO"
        )

    },

    plugins: {}

};


let currentFile = "index.html";


/* =========================================================
   INICIALIZAÇÃO
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadProject();

        renderProjectName();

        renderFiles();

        renderPlugins();

        openFile(
            project.files[currentFile]
                ? currentFile
                : "index.html"
        );

        previewPage();

        log(
            "MultiScript HTML Editor V14 iniciado.",
            "success"
        );

        log(
            "multiscript.js está sendo gerenciado pelo projeto.",
            "info"
        );

    }
);


/* =========================================================
   NOVO PROJETO
========================================================= */

function openNewProject() {

    const body = `

        <div class="form-group">

            <label class="form-label">
                Nome do projeto
            </label>

            <input
                id="newProjectName"
                class="form-control"
                value="MEU-PROJETO"
                placeholder="Ex.: meu-site"
            >

        </div>


        <div class="option-box">

            <label class="option-check">

                <input
                    type="checkbox"
                    id="newCreateIndex"
                    checked
                >

                <div>

                    <strong>
                        Criar index.html
                    </strong>

                    <span>
                        Página inicial do projeto.
                    </span>

                </div>

            </label>

        </div>


        <div class="option-box">

            <label class="option-check">

                <input
                    type="checkbox"
                    id="newCreateCSS"
                    checked
                >

                <div>

                    <strong>
                        Criar style.css
                    </strong>

                    <span>
                        Folha de estilos principal.
                    </span>

                </div>

            </label>

        </div>


        <div class="option-box">

            <label class="option-check">

                <input
                    type="checkbox"
                    id="newCreateJS"
                    checked
                >

                <div>

                    <strong>
                        Criar script.js
                    </strong>

                    <span>
                        JavaScript principal do projeto.
                    </span>

                </div>

            </label>

        </div>


        <div class="option-box">

            <label class="option-check">

                <input
                    type="checkbox"
                    id="newCreateMultiScript"
                    checked
                >

                <div>

                    <strong>
                        Criar multiscript.js
                    </strong>

                    <span>
                        Arquivo auxiliar exclusivo deste projeto.
                    </span>

                </div>

            </label>

        </div>


        <div class="option-box">

            <label class="option-check">

                <input
                    type="checkbox"
                    id="newCreatePlugins"
                    checked
                >

                <div>

                    <strong>
                        Criar pasta plugins/
                    </strong>

                    <span>

function createNewProject() {

    const rawName =
        document.getElementById(
            "newProjectName"
        ).value.trim();


    if (!rawName) {

        alert(
            "Informe o nome do projeto."
        );

        return;

    }


    const name =
        rawName
            .replace(
                /[<>:"/\\|?*]/g,
                "-"
            )
            .trim();


    if (!name) {

        alert(
            "Nome de projeto inválido."
        );

        return;

    }


    const createIndex =
        document.getElementById(
            "newCreateIndex"
        ).checked;


    const createCSS =
        document.getElementById(
            "newCreateCSS"
        ).checked;


    const createJS =
        document.getElementById(
            "newCreateJS"
        ).checked;


    const createMultiScript =
        document.getElementById(
            "newCreateMultiScript"
        ).checked;


    const createPlugins =
        document.getElementById(
            "newCreatePlugins"
        ).checked;


    const files = {};


    if (createIndex) {

        files["index.html"] =
            createInitialHTML(
                name
            );

    }


    if (createCSS) {

        files["style.css"] =
`body {
    margin: 0;
    font-family: Arial, sans-serif;
}`;

    }


    if (createJS) {

        files["script.js"] =
`console.log(
    "Projeto ${escapeJSString(name)} iniciado."
);`;

    }


    if (createMultiScript) {

        files["multiscript.js"] =
            createMultiScriptJS(
                name
            );

    }


    /*
       O navegador não precisa armazenar uma pasta
       vazia. No ZIP, a pasta plugins/ será criada.
    */

    if (createPlugins) {

        files[
            "plugins/.gitkeep"
        ] = "";

    }


    project = {

        name: name,

        files: files,

        plugins: {}

    };


    currentFile =
        createIndex
            ? "index.html"
            : Object.keys(files)[0];


    saveProject();

    renderProjectName();

    renderFiles();

    renderPlugins();

    openFile(
        currentFile
    );

    closeModal();


    log(
        "Novo projeto criado: " +
        name,
        "success"
    );


    if (createMultiScript) {

        log(
            "multiscript.js criado automaticamente.",
            "success"
        );

    }


    if (createPlugins) {

        log(
            "Pasta plugins/ preparada.",
            "info"
        );

    }

}

function loadProject() {

    try {

        const saved =
            localStorage.getItem(
                "multiscript-v14-project"
            );


        if (!saved) {
            return;
        }


        const parsed =
            JSON.parse(saved);


        if (
            parsed &&
            parsed.files
        ) {

            project = parsed;

        }


        if (!project.plugins) {

            project.plugins = {};

        }

    } catch (error) {

        log(
            "Erro ao carregar projeto.",
            "error"
        );

    }

}

/* =========================================================
   FILE TREE
========================================================= */

function renderFiles() {

    const tree =
        document.getElementById(
            "fileTree"
        );


    tree.innerHTML = "";


    const files =
        Object.keys(
            project.files
        ).sort();


    const folders = {};


    files.forEach(
        function (file) {

            const parts =
                file.split("/");


            if (
                parts.length === 1
            ) {

                addFileItem(
                    tree,
                    file,
                    0
                );

            } else {

                const folder =
                    parts
                        .slice(0, -1)
                        .join("/");


                if (!folders[folder]) {

                    folders[folder] = [];

                }


                folders[folder].push(
                    file
                );

            }

        }
    );


    Object.keys(folders)
        .sort()
        .forEach(
            function (folder) {

                const folderDiv =
                    document.createElement(
                        "div"
                    );


                folderDiv.className =
                    "folder";


                folderDiv.textContent =
                    "▾ " + folder;


                tree.appendChild(
                    folderDiv
                );


                folders[folder]
                    .forEach(
                        function (file) {

                            addFileItem(
                                tree,
                                file,
                                1
                            );

                        }
                    );

            }
        );

}


function addFileItem(
    container,
    file,
    level
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "file-item" +
        (
            file === currentFile
                ? " active"
                : ""
        );


    item.style.paddingLeft =
        (
            9 +
            level * 17
        ) + "px";


    const icon =
        document.createElement(
            "span"
        );


    const ext =
        file
            .split(".")
            .pop()
            .toLowerCase();


    if (
        file.endsWith(
            "multiscript.js"
        )
    ) {

        icon.className =
            "file-ms";

        icon.textContent =
            "MS";

    } else if (
        ext === "html"
    ) {

        icon.className =
            "file-html";

        icon.textContent =
            "▤";

    } else if (
        ext === "css"
    ) {

        icon.className =
            "file-css";

        icon.textContent =
            "#";

    } else if (
        ext === "js"
    ) {

        icon.className =
            "file-js";

        icon.textContent =
            "JS";

    } else if (
        ext === "php"
    ) {

        icon.className =
            "file-php";

        icon.textContent =
            "PHP";

    } else {

        icon.textContent =
            "•";

    }


    const name =
        document.createElement(
            "span"
        );


    name.textContent =
        file.split("/").pop();


    item.appendChild(icon);

    item.appendChild(name);


    item.onclick =
        function () {

            openFile(file);

        };


    container.appendChild(item);

}


/* =========================================================
   PLUGINS
========================================================= */

function renderPlugins() {

    const tree =
        document.getElementById(
            "pluginTree"
        );


    tree.innerHTML = "";


    const plugins =
        Object.keys(
            project.plugins || {}
        );


    if (!plugins.length) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.color =
            "#66717f";

        empty.style.fontSize =
            "10px";

        empty.style.padding =
            "7px";


        empty.textContent =
            "Nenhum plugin PHP importado.";


        tree.appendChild(
            empty
        );

        return;

    }


    plugins.forEach(
        function (plugin) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "file-item";


            const icon =
                document.createElement(
                    "span"
                );


            icon.className =
                "file-php";

            icon.textContent =
                "PHP";


            const name =
                document.createElement(
                    "span"
                );


            name.textContent =
                plugin.replace(
                    /^plugins\//,
                    ""
                );


            item.appendChild(icon);

            item.appendChild(name);


            item.onclick =
                function () {

                    openFile(plugin);

                };


            tree.appendChild(item);

        }
    );

}

========================================================= */

function openFile(file) {

    if (!project.files[file]) {
        return;
    }


    currentFile =
        file;


    document.getElementById(
        "editor"
    ).value =
        project.files[file];


    document.getElementById(
        "currentTab"
    ).innerHTML =
        getFileIcon(file) +
        "<span>" +
        escapeHTML(
            file.split("/").pop()
        ) +
        "</span>";


    document.getElementById(
        "previewFile"
    ).textContent =
        file;


    document.getElementById(
        "fileStatus"
    ).textContent =
        file;


    updateLineNumbers();

    renderFiles();


    if (
        file.toLowerCase()
            .endsWith(".html")
    ) {

        previewPage();

    }

}


function getFileIcon(file) {

    if (
        file.endsWith(
            "multiscript.js"
        )
    ) {

        return '<span class="file-ms">MS</span>';

    }


    const ext =
        file
            .split(".")
            .pop()
            .toLowerCase();


    if (ext === "html") {

        return '<span class="file-html">▤</span>';

    }


    if (ext === "css") {

        return '<span class="file-css">#</span>';

    }


    if (ext === "js") {

        return '<span class="file-js">JS</span>';

    }


    if (ext === "php") {

        return '<span class="file-php">PHP</span>';

    }


    return "<span>•</span>";

}


/* =========================================================
   EDITOR
========================================================= */

function editorInput() {

    project.files[currentFile] =
        document.getElementById(
            "editor"
        ).value;


    updateLineNumbers();


    if (
        currentFile
            .toLowerCase()
            .endsWith(".html")
    ) {

        previewPage();

    }


    saveProject();

}


function updateLineNumbers() {

    const editor =
        document.getElementById(
            "editor"
        );


    const count =
        editor.value
            .split("\n")
            .length;


    let output = "";


    for (
        let i = 1;
        i <= count;
        i++
    ) {

        output +=
            i + "\n";

    }


    document.getElementById(
        "lineNumbers"
    ).textContent =
        output;

}


function syncEditorScroll() {

    document.getElementById(
        "lineNumbers"
    ).scrollTop =
        document.getElementById(
            "editor"
        ).scrollTop;

}


function handleEditorKey(event) {

    if (
        event.key === "Tab"
    ) {

        event.preventDefault();


        const editor =
            document.getElementById(
                "editor"
            );


        const start =
            editor.selectionStart;


        const end =
            editor.selectionEnd;


        editor.value =
            editor.value.substring(
                0,
                start
            ) +
            "    " +
            editor.value.substring(
                end
            );


        editor.selectionStart =
            editor.selectionEnd =
            start + 4;


        editorInput();

    }

}


/* =========================================================
   PREVIEW
========================================================= */

function previewPage() {

    if (
        !currentFile
            .toLowerCase()
            .endsWith(".html")
    ) {

        return;

    }


    let html =
        project.files[currentFile];


    const css =
        project.files["style.css"] || "";


    const js =
        project.files["script.js"] || "";


    const safeJS =
        js.replace(
            /<\/script/gi,
            "<" + "/script"
        );


    if (
        html.includes("<head>")
    ) {

        html =
            html.replace(
                "<head>",
                "<head><style>" +
                css +
                "</style>"
            );

    }


    if (
        html.includes("</body>")
    ) {

        html =
            html.replace(
                "</body>",
                "<script>" +
                safeJS +
                "<" + "/script></body>"
            );

    }


    document.getElementById(
        "previewFrame"
    ).srcdoc =
        html;

}

/* =========================================================
   GERAR PÁGINA
========================================================= */

function generatePage(type) {

    const name =
        document.getElementById(
            "pageName"
        ).value.trim();


    const content =
        document.getElementById(
            "pageContent"
        ).value;


    if (!name) {

        alert(
            "Informe o nome da página."
        );

        return;

    }


    const slug =
        slugify(name);


    let path = "";


    if (
        type === "category" ||
        type === "institutional"
    ) {

        path =
            slug +
            ".html";

    }


    if (
        type === "subpage"
    ) {

        const parent =
            document.getElementById(
                "parentCategory"
            ).value.trim();


        if (!parent) {

            alert(
                "Informe a categoria."
            );

            return;

        }


        path =
            slugify(parent) +
            "/" +
            slug +
            ".html";

    }


    if (
        project.files[path] &&
        !confirm(
            "O arquivo " +
            path +
            " já existe.\n\n" +
            "Deseja substituir?"
        )
    ) {

        return;

    }


    const plugins =
        Array.from(
            document.querySelectorAll(
                ".generator-plugin:checked"
            )
        ).map(
            function (input) {

                return input.value;

            }
        );


    const bootstrap =
        document.getElementById(
            "useBootstrap"
        )?.checked || false;


    project.files[path] =
        createPageTemplate(
            type,
            name,
            content,
            plugins,
            bootstrap
        );


    saveProject();

    renderFiles();

    closeModal();

    openFile(path);


    log(
        "Página criada: " +
        path,
        "success"
    );

}

/* =========================================================
   SLUG
========================================================= */

function slugify(value) {

    return String(value)
        .normalize("NFD")
        .replace(
            /[\u0300-\u036f]/g,
            ""
        )
        .toLowerCase()
        .trim()
        .replace(
            /[^a-z0-9]+/g,
            "-"
        )
        .replace(
            /^-+|-+$/g,
            "");

}


/* =========================================================
   PHP IMPORT
========================================================= */

function openPHPImporter() {

    document.getElementById(
        "phpInput"
    ).click();

}


document.getElementById(
    "phpInput"
).addEventListener(
    "change",
    async function (event) {

        const files =
            Array.from(
                event.target.files || []
            );


        for (
            const file of files
        ) {

            if (
                !file.name
                    .toLowerCase()
                    .endsWith(".php")
            ) {

                continue;

            }


            const content =
                await file.text();


            const path =
                "plugins/" +
                file.name;


            project.files[path] =
                content;


            project.plugins[path] =
                true;


            log(
                "Plugin importado: " +
                path,
                "success"
            );

        }


        renderFiles();

        renderPlugins();

        saveProject();

        event.target.value = "";

    }
);


/* =========================================================
   PLUGIN MANAGER
========================================================= */

function openPluginManager() {

    const plugins =
        Object.keys(
            project.plugins || {}
        );


    let body = "";


    if (!plugins.length) {

        body = `

            <p
                style="
                    color:#8993a1;
                    font-size:12px;
                "
            >
                Nenhum plugin PHP do usuário
                foi importado.
            </p>

        `;

    } else {

        plugins.forEach(
            function (plugin) {

                body += `

                    <div
                        style="
                            display:flex;
                            align-items:center;
                            gap:10px;
                            padding:10px;
                            border-bottom:1px solid #303640;
                        "
                    >

                        <span class="file-php">
                            PHP
                        </span>

                        <span style="flex:1">
                            ${escapeHTML(plugin)}
                        </span>

                        <button
                            class="tool-btn"
                            onclick="openFile('${escapeAttribute(plugin)}');closeModal()"
                        >
                            Abrir
                        </button>

                        <button
                            class="tool-btn"
                            onclick="removePlugin('${escapeAttribute(plugin)}')"
                        >
                            Remover
                        </button>

                    </div>

                `;

            }
        );

    }


    openModal(
        "PLUGINS PHP DO USUÁRIO",
        body,
        `
            <button
                class="tool-btn"
                onclick="openPHPImporter();closeModal()"
            >
                + Importar PHP
            </button>

            <button
                class="tool-btn primary"
                onclick="closeModal()"
            >
                Fechar
            </button>
        `
    );

}


function removePlugin(path) {

    if (
        !confirm(
            "Remover o plugin " +
            path +
            "?"
        )
    ) {

        return;

    }


    delete project.files[path];

    delete project.plugins[path];


    if (
        currentFile === path
    ) {

        currentFile =
            project.files["index.html"]
                ? "index.html"
                : Object.keys(
                    project.files
                )[0];

    }


    saveProject();

    renderFiles();

    renderPlugins();

    openFile(
        currentFile
    );

    openPluginManager();

}

async function confirmExport(
    credit
) {

    closeModal();


    const zip =
        new JSZip();


    const files =
        {
            ...project.files
        };


    if (
        credit !== "none"
    ) {

        Object.keys(files)
            .forEach(
                function (path) {

                    if (
                        path
                            .toLowerCase()
                            .endsWith(".html")
                    ) {

                        files[path] =
                            insertCredits(
                                files[path],
                                credit
                            );

                    }

                }
            );

    }


    Object.keys(files)
        .forEach(
            function (path) {

                zip.file(
                    path,
                    files[path]
                );

            }
        );


    const blob =
        await zip.generateAsync({
            type: "blob"
        });


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        project.name +
        ".zip";


    document.body.appendChild(
        link
    );


    link.click();

    link.remove();


    URL.revokeObjectURL(
        url
    );


    log(
        "Projeto exportado em ZIP.",
        "success"
    );

}


/* =========================================================

========================================================= */

function insertCredits(
    html,
    credit
) {

    let name = "";

    let url = "";


    if (
        credit === "multipage"
    ) {

        name =
            "Multipage Mel";

        url =
            "https://multipagemel.pages.dev/";

    }


    if (
        credit === "corretores"
    ) {

        name =
            "Apenas Corretores";

        url =
            "https://apenascorretores.pages.dev/";

    }


    if (
        credit === "homemsite"
    ) {

        name =
            "HomemSite";

        url =
            "https://homemsite.pages.dev/";

    }


    if (
        credit === "homemsite-pr"
    ) {

        name =
            "HomemSite Paraná";

        url =
            "https://homemsite.pages.dev/parana/";

    }


    if (!name) {

        return html;

    }


    const block = `

<footer
    class="multiscript-credit"
    style="
        padding:20px;
        text-align:center;
        font-family:Arial,sans-serif;
        font-size:12px;
    "
>

    <p>
        Este site garante a segurança na coleta
        e tratamento de dados, em conformidade com a LGPD.
    </p>

    <p>
        © V14.0.0 by MultiScript HTML Editor
    </p>

    <p>

        <a
            href="${url}"
            target="_blank"
            rel="noopener"
        >
            ${name}
        </a>

    </p>

</footer>

`;


    if (
        html
            .toLowerCase()
            .includes("</body>")
    ) {

        return html.replace(
            /<\/body>/i,
            block +
            "<" +
            "/body>"
        );

    }


    return html + block;

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
    title,
    body,
    footer
) {

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    document.getElementById(
        "modalBody"
    ).innerHTML =
        body;


    document.getElementById(
        "modalFooter"
    ).innerHTML =
        footer || "";


    document.getElementById(
        "modalBackdrop"
    ).classList.add(
        "open"
    );

}


function closeModal() {

    document.getElementById(
        "modalBackdrop"
    ).classList.remove(
        "open"
    );

}


document.getElementById(
    "modalBackdrop"
).addEventListener(
    "click",
    function (event) {

        if (
            event.target === this
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   TERMINAL
========================================================= */

function log(
    message,
    type
) {

    const output =
        document.getElementById(
            "terminalOutput"
        );


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "log-line " +
        (
            type === "success"
                ? "log-success"
                : type === "error"
                    ? "log-error"
                    : type === "info"
                        ? "log-info"
                        : ""
        );


    line.textContent =
        "> " + message;


    output.appendChild(
        line
    );


    output.scrollTop =
        output.scrollHeight;

}


function setStatus(
    message
) {

    document.getElementById(
        "statusText"
    ).textContent =
        message;

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}


function escapeJSString(
    value
) {

    return String(value)
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /"/g,
            '\\"'
        )
        .replace(
            /\r?\n/g,
            "\\n"
        );

}
