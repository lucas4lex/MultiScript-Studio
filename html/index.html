<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<meta name="theme-color"
      content="#0d6efd">

<title>MultiScript HTML Editor V14</title>

<!-- Bootstrap 5 -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
>

<!-- JSZip -->
<script
    src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js">
</script>

<style>

:root {
    --ms-bg: #101419;
    --ms-panel: #191e24;
    --ms-panel-2: #1d232b;
    --ms-border: #303640;
    --ms-text: #e7eaf0;
    --ms-muted: #8993a1;
    --ms-blue: #0d6efd;
    --ms-terminal: #090c0f;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    overflow: hidden;
    background: var(--ms-bg);
    color: var(--ms-text);
    font-family: "Segoe UI", Arial, sans-serif;
}

/* =========================================================
   BOOTSTRAP AJUSTES
========================================================= */

.dropdown-menu {
    background: #20262e;
    border: 1px solid #3b434e;
    box-shadow: 0 15px 45px rgba(0,0,0,.45);
}

.dropdown-item {
    color: #dce2ea;
    font-size: 13px;
}

.dropdown-item:hover {
    background: #303741;
    color: white;
}

.dropdown-divider {
    border-color: #39414c;
}

.btn-ms {
    background: #242a32;
    border: 1px solid #39414c;
    color: #dfe4ec;
}

.btn-ms:hover {
    background: #303741;
    border-color: #4a5564;
    color: white;
}

.btn-ms-primary {
    background: #0d6efd;
    border: 1px solid #0d6efd;
    color: white;
}

.btn-ms-primary:hover {
    background: #0b5ed7;
    color: white;
}

/* =========================================================
   APLICAÇÃO
========================================================= */

.ms-app {
    width: 100vw;
    height: 100vh;

    display: grid;

    grid-template-rows:
        54px
        1fr
        25px;
}

/* =========================================================
   TOPBAR
========================================================= */

.ms-topbar {
    background: #1b2027;
    border-bottom: 1px solid var(--ms-border);

    display: flex;
    align-items: center;

    padding: 0 12px;

    gap: 10px;

    z-index: 100;
}

.ms-logo {
    width: 34px;
    height: 34px;

    border-radius: 7px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
    font-weight: 800;

    color: white;

    background:
        linear-gradient(
            135deg,
            #0d6efd,
            #744cff
        );
}

.ms-title {
    line-height: 15px;
}

.ms-title-main {
    font-size: 14px;
    font-weight: 700;
}

.ms-title-version {
    color: #7f8997;
    font-size: 10px;
}

.ms-top-actions {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 6px;
}

.ms-mobile-menu {
    display: none;
}

/* =========================================================
   MAIN DESKTOP
========================================================= */

.ms-main {
    min-height: 0;

    display: grid;

    grid-template-columns:
        54px
        250px
        minmax(400px, 1fr)
        40%;
}

/* =========================================================
   ACTIVITY BAR
========================================================= */

.ms-activity {
    background: #171b20;
    border-right: 1px solid var(--ms-border);

    display: flex;
    flex-direction: column;

    align-items: center;

    padding-top: 9px;

    gap: 5px;
}

.ms-activity-button {
    width: 42px;
    height: 42px;

    border: 0;

    background: transparent;

    color: #818a98;

    border-radius: 6px;

    font-size: 18px;
}

.ms-activity-button:hover,
.ms-activity-button.active {
    background: #272d35;
    color: white;
}

/* =========================================================
   SIDEBAR
========================================================= */

.ms-sidebar {
    min-height: 0;

    background: #191e24;

    border-right: 1px solid var(--ms-border);

    overflow: auto;
}

.ms-sidebar-header {
    height: 43px;

    display: flex;
    align-items: center;

    padding: 0 14px;

    color: #aab3c0;

    font-size: 11px;
    font-weight: 700;

    letter-spacing: .7px;
}

.ms-project-name {
    padding: 6px 14px;

    color: #dce2eb;

    font-size: 12px;
    font-weight: 700;
}

.ms-tree {
    padding: 4px 7px;
}

.ms-tree-title {
    color: #7f8997;

    font-size: 10px;

    padding: 8px 7px 5px;

    letter-spacing: .7px;

    font-weight: 700;
}

.ms-file-item {
    height: 31px;

    padding: 0 9px;

    display: flex;
    align-items: center;

    gap: 8px;

    border-radius: 4px;

    color: #cbd1db;

    font-size: 12px;

    cursor: pointer;
}

.ms-file-item:hover {
    background: #272d35;
}

.ms-file-item.active {
    background: #303742;
    color: white;
}

.ms-folder {
    color: #8e99a8;

    font-size: 11px;

    padding: 8px 7px 4px;
}

.ms-plugin-area {
    margin-top: 14px;

    border-top: 1px solid #2c323a;

    padding-top: 6px;
}

.file-html {
    color: #e44d26;
}

.file-css {
    color: #1677ff;
}

.file-js {
    color: #f3d34a;
}

.file-php {
    color: #777bb4;
}

/* =========================================================
   EDITOR
========================================================= */

.ms-editor-area {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-rows:
        39px
        minmax(0, 1fr)
        145px;

    background: #101419;
}

.ms-tabs {
    min-width: 0;

    display: flex;

    overflow: hidden;

    background: #191e24;

    border-bottom: 1px solid var(--ms-border);
}

.ms-tab {
    min-width: 145px;

    height: 39px;

    display: flex;
    align-items: center;

    padding: 0 12px;

    gap: 8px;

    border-right: 1px solid var(--ms-border);

    color: #9da6b4;

    font-size: 12px;
}

.ms-tab.active {
    color: white;

    background: #101419;

    border-top: 2px solid #0d6efd;
}

.ms-editor-wrapper {
    min-height: 0;

    display: grid;

    grid-template-columns:
        48px
        1fr;

    overflow: hidden;
}

.ms-lines {
    background: #0d1115;

    color: #56606d;

    text-align: right;

    padding: 13px 9px;

    font:
        13px/20px
        Consolas,
        monospace;

    user-select: none;

    overflow: hidden;
}

#editor {
    width: 100%;
    height: 100%;

    resize: none;

    border: 0;
    outline: 0;

    padding: 13px 15px;

    background: #101419;

    color: #d9dee7;

    font:
        13px/20px
        Consolas,
        "Courier New",
        monospace;

    tab-size: 4;

    white-space: pre;

    overflow: auto;
}

/* =========================================================
   TERMINAL
========================================================= */

.ms-terminal {
    min-height: 0;

    background: var(--ms-terminal);

    border-top: 1px solid var(--ms-border);

    padding: 9px 12px;

    overflow: auto;

    font:
        12px/19px
        Consolas,
        monospace;
}

.ms-terminal-title {
    color: #788392;

    margin-bottom: 5px;
}

.log-line {
    color: #9fa8b5;
}

.log-success {
    color: #6bd58c;
}

.log-error {
    color: #ff7272;
}

.log-info {
    color: #62a9ff;
}

/* =========================================================
   PREVIEW
========================================================= */

.ms-preview {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-rows:
        39px
        minmax(0, 1fr);

    background: #dfe3e8;

    border-left: 1px solid var(--ms-border);
}

.ms-preview-header {
    background: #191e24;

    border-bottom: 1px solid var(--ms-border);

    display: flex;
    align-items: center;

    padding: 0 12px;

    color: #aeb6c2;

    font-size: 11px;
}

.ms-preview-header strong {
    color: white;

    margin-right: 8px;
}

#previewFrame {
    width: 100%;
    height: 100%;

    border: 0;

    background: white;
}

/* =========================================================
   STATUS BAR
========================================================= */

.ms-statusbar {
    background: #0d6efd;

    color: white;

    display: flex;
    align-items: center;

    padding: 0 12px;

    font-size: 10px;
}

.ms-status-right {
    margin-left: auto;

    display: flex;

    gap: 15px;
}

/* =========================================================
   MODAL
========================================================= */

.ms-modal-backdrop {
    position: fixed;

    inset: 0;

    z-index: 9999;

    background: rgba(0,0,0,.70);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.ms-modal-backdrop.open {
    display: flex;
}

.ms-modal {
    width: 720px;
    max-width: 100%;

    max-height: 90vh;

    background: #1b2027;

    border: 1px solid #3a424d;

    border-radius: 9px;

    box-shadow:
        0 25px 80px
        rgba(0,0,0,.55);

    overflow: hidden;

    display: flex;
    flex-direction: column;
}

.ms-modal-header {
    min-height: 52px;

    padding: 0 18px;

    display: flex;
    align-items: center;

    border-bottom: 1px solid var(--ms-border);
}

.ms-modal-header h2 {
    margin: 0;

    font-size: 14px;
}

.ms-modal-close {
    margin-left: auto;

    width: 31px;
    height: 31px;

    border: 0;

    background: transparent;

    color: #8f99a8;

    font-size: 20px;

    border-radius: 5px;
}

.ms-modal-close:hover {
    background: #2a3038;

    color: white;
}

.ms-modal-body {
    padding: 20px;

    overflow: auto;
}

.ms-modal-footer {
    min-height: 59px;

    padding: 10px 18px;

    border-top: 1px solid var(--ms-border);

    display: flex;
    justify-content: flex-end;

    gap: 8px;
}

/* =========================================================
   GERADOR
========================================================= */

.ms-type-question {
    text-align: center;

    margin-bottom: 23px;
}

.ms-type-question h3 {
    margin: 0 0 7px;

    color: white;

    font-size: 18px;
}

.ms-type-question p {
    margin: 0;

    color: #8e98a6;

    font-size: 12px;
}

.ms-type-grid {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 12px;
}

.ms-type-card {
    position: relative;
}

.ms-type-card input {
    position: absolute;

    opacity: 0;

    pointer-events: none;
}

.ms-type-card label {
    min-height: 145px;

    border: 1px solid #39414c;

    border-radius: 8px;

    background: #14191f;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    text-align: center;

    padding: 15px;

    cursor: pointer;

    transition: .15s;
}

.ms-type-card label:hover {
    background: #20262e;

    border-color: #536071;
}

.ms-type-card input:checked + label {
    background: #172b48;

    border-color: #0d6efd;

    box-shadow:
        inset 0 0 0 1px #0d6efd;
}

.ms-type-icon {
    width: 48px;
    height: 48px;

    border-radius: 10px;

    background: #262d36;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 22px;

    margin-bottom: 12px;
}

.ms-type-name {
    color: white;

    font-size: 13px;

    font-weight: 700;
}

.ms-type-desc {
    color: #818b99;

    font-size: 10px;

    margin-top: 5px;
}

/* =========================================================
   PLUGINS
========================================================= */

.ms-plugin-list {
    border: 1px solid #353d48;

    border-radius: 5px;

    background: #11151a;

    max-height: 170px;

    overflow: auto;
}

.ms-plugin-row {
    display: flex;
    align-items: center;

    gap: 9px;

    padding: 9px 11px;

    border-bottom: 1px solid #252b33;

    font-size: 11px;
}

.ms-plugin-row:last-child {
    border-bottom: 0;
}

.ms-plugin-row input {
    accent-color: #0d6efd;
}

.ms-no-plugins {
    padding: 13px;

    color: #737d8a;

    font-size: 11px;
}

/* =========================================================
   CREDITOS
========================================================= */

.ms-credit-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;
}

.ms-credit-option {
    border: 1px solid #39414c;

    background: #14191f;

    border-radius: 6px;

    padding: 12px;

    cursor: pointer;
}

.ms-credit-option:hover {
    border-color: #596576;

    background: #1d232b;
}

.ms-credit-option strong {
    display: block;

    color: white;

    font-size: 12px;
}

.ms-credit-option span {
    display: block;

    margin-top: 4px;

    color: #7f8996;

    font-size: 10px;
}

/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {
    width: 10px;
    height: 10px;
}

::-webkit-scrollbar-track {
    background: #11151a;
}

::-webkit-scrollbar-thumb {
    background: #353d48;

    border-radius: 8px;
}

::-webkit-scrollbar-thumb:hover {
    background: #46505d;
}

/* =========================================================
   OFFCANVAS MOBILE
========================================================= */

.offcanvas {
    background: #191e24 !important;

    color: white;

    width: 290px !important;
}

.offcanvas-header {
    border-bottom: 1px solid var(--ms-border);
}

.offcanvas-title {
    font-size: 14px;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 991.98px) {

    body {
        overflow: hidden;
    }

    .ms-app {
        grid-template-rows:
            54px
            1fr
            25px;
    }

    .ms-mobile-menu {
        display: block;
    }

    .ms-top-actions {
        display: none;
    }

    .ms-title-version {
        display: none;
    }

    .ms-main {
        display: grid;

        grid-template-columns:
            minmax(0, 1fr);
    }

    .ms-activity,
    .ms-sidebar {
        display: none;
    }

    .ms-editor-area {
        grid-template-rows:
            39px
            minmax(0, 1fr)
            120px;
    }

    .ms-preview {
        display: none;
    }

    .ms-status-right {
        display: none;
    }

    .ms-statusbar {
        font-size: 9px;
    }

    .ms-type-grid {
        grid-template-columns: 1fr;
    }

    .ms-type-card label {
        min-height: 105px;

        flex-direction: row;

        justify-content: flex-start;

        text-align: left;

        gap: 14px;
    }

    .ms-type-icon {
        margin-bottom: 0;

        flex-shrink: 0;
    }

    .ms-credit-grid {
        grid-template-columns: 1fr;
    }

}

/* =========================================================
   MOBILE PEQUENO
========================================================= */

@media (max-width: 575.98px) {

    .ms-title-main {
        font-size: 12px;
    }

    .ms-logo {
        width: 31px;
        height: 31px;
    }

    .ms-editor-area {
        grid-template-rows:
            38px
            minmax(0, 1fr)
            105px;
    }

    .ms-editor-wrapper {
        grid-template-columns:
            39px
            1fr;
    }

    .ms-lines {
        padding-right: 7px;

        font-size: 11px;
    }

    #editor {
        padding: 11px;

        font-size: 12px;
    }

    .ms-tab {
        min-width: 125px;

        font-size: 11px;
    }

    .ms-terminal {
        font-size: 10px;
    }

    .ms-modal-backdrop {
        padding: 8px;
    }

    .ms-modal {
        max-height: 95vh;

        border-radius: 7px;
    }

    .ms-modal-body {
        padding: 15px;
    }

    .ms-modal-footer {
        padding: 9px 12px;
    }

}

</style>
</head>

<body>

<div class="ms-app">

    <!-- =====================================================
         TOPBAR
    ====================================================== -->

    <header class="ms-topbar">

        <!-- MOBILE MENU -->

        <button
            class="btn btn-ms ms-mobile-menu"
            data-bs-toggle="offcanvas"
            data-bs-target="#mobileExplorer"
            aria-label="Abrir menu"
        >
            <i class="bi bi-list"></i>
        </button>


        <!-- LOGO -->

        <div class="ms-logo">
            MS
        </div>


        <!-- TITLE -->

        <div class="ms-title">

            <div class="ms-title-main">
                MultiScript HTML Editor
            </div>

            <div class="ms-title-version">
                V14.0.0 — Page Generator
            </div>

        </div>


        <!-- DESKTOP ACTIONS -->

        <div class="ms-top-actions">

            <button
                class="btn btn-sm btn-ms"
                onclick="openGenerator()"
            >
                <i class="bi bi-file-earmark-plus"></i>
                Gerar Página
            </button>


            <div class="dropdown">

                <button
                    class="btn btn-sm btn-ms dropdown-toggle"
                    data-bs-toggle="dropdown"
                >
                    <i class="bi bi-three-dots"></i>
                    Ações
                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="openPHPImporter()"
                        >
                            <i class="bi bi-filetype-php"></i>
                            Plugin PHP
                        </button>
                    </li>

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="openPluginManager()"
                        >
                            <i class="bi bi-puzzle"></i>
                            Gerenciar Plugins
                        </button>
                    </li>

                    <li>
                        <hr class="dropdown-divider">
                    </li>

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="formatHTML()"
                        >
                            <i class="bi bi-code-square"></i>
                            Formatar HTML
                        </button>
                    </li>

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="previewPage()"
                        >
                            <i class="bi bi-eye"></i>
                            Atualizar Preview
                        </button>
                    </li>

                </ul>

            </div>


            <div class="dropdown">

                <button
                    class="btn btn-sm btn-ms dropdown-toggle"
                    data-bs-toggle="dropdown"
                >
                    <i class="bi bi-folder2-open"></i>
                    Projeto
                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="saveProject()"
                        >
                            <i class="bi bi-save"></i>
                            Salvar Projeto
                        </button>
                    </li>

                    <li>
                        <button
                            class="dropdown-item"
                            onclick="openCreditDialog()"
                        >
                            <i class="bi bi-file-zip"></i>
                            Exportar ZIP
                        </button>
                    </li>

                </ul>

            </div>


            <button
                class="btn btn-sm btn-ms-primary"
                onclick="openCreditDialog()"
            >
                <i class="bi bi-box-arrow-down"></i>
                Exportar
            </button>

        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="ms-main">


        <!-- ACTIVITY BAR -->

        <aside class="ms-activity">

            <button
                class="ms-activity-button active"
                title="Explorer"
                onclick="openDesktopExplorer()"
            >
                <i class="bi bi-files"></i>
            </button>


            <button
                class="ms-activity-button"
                title="Gerar Página"
                onclick="openGenerator()"
            >
                <i class="bi bi-file-earmark-plus"></i>
            </button>


            <button
                class="ms-activity-button"
                title="Plugins"
                onclick="openPluginManager()"
            >
                <i class="bi bi-puzzle"></i>
            </button>


            <button
                class="ms-activity-button"
                title="Salvar"
                onclick="saveProject()"
            >
                <i class="bi bi-save"></i>
            </button>

        </aside>


        <!-- SIDEBAR DESKTOP -->

        <aside class="ms-sidebar">

            <div class="ms-sidebar-header">
                EXPLORER
            </div>

            <div class="ms-project-name">
                <i class="bi bi-chevron-down"></i>
                MEU-PROJETO
            </div>

            <div
                id="fileTree"
                class="ms-tree"
            ></div>


            <div class="ms-plugin-area">

                <div class="ms-tree-title">
                    PLUGINS DO USUÁRIO
                </div>

                <div
                    id="pluginTree"
                    class="ms-tree"
                ></div>

            </div>

        </aside>


        <!-- EDITOR -->

        <section class="ms-editor-area">


            <!-- TABS -->

            <div class="ms-tabs">

                <div
                    class="ms-tab active"
                    id="currentTab"
                >

                    <span class="file-html">
                        <i class="bi bi-filetype-html"></i>
                    </span>

                    <span>
                        index.html
                    </span>

                </div>

            </div>


            <!-- EDITOR -->

            <div class="ms-editor-wrapper">

                <div
                    id="lineNumbers"
                    class="ms-lines"
                >
                    1
                </div>


                <textarea
                    id="editor"
                    spellcheck="false"
                    oninput="editorInput()"
                    onscroll="syncEditorScroll()"
                    onkeydown="handleEditorKey(event)"
                ></textarea>

            </div>


            <!-- TERMINAL -->

            <div class="ms-terminal">

                <div class="ms-terminal-title">

                    <i class="bi bi-terminal"></i>

                    TERMINAL — MULTISCRIPT

                </div>

                <div
                    id="terminalOutput"
                ></div>

            </div>

        </section>


        <!-- PREVIEW -->

        <section class="ms-preview">

            <div class="ms-preview-header">

                <strong>
                    <i class="bi bi-eye"></i>
                    PREVIEW
                </strong>

                <span id="previewFile">
                    index.html
                </span>

            </div>


            <iframe
                id="previewFrame"
                title="Preview"
            ></iframe>

        </section>

    </main>


    <!-- =====================================================

let project = {

/* =========================================================
   LOCAL STORAGE
========================================================= */

function saveProject() {

    try {

        localStorage.setItem(
            "multiscript-v14-project",
            JSON.stringify(project)
        );

        log(
            "Projeto salvo no armazenamento local.",
            "success"
        );

        setStatus(
            "Projeto salvo"
        );

    } catch (error) {

        log(
            "Erro ao salvar projeto: " +
            error.message,
            "error"
        );

    }

}


function loadProject() {

    try {

        const saved =
            localStorage.getItem(
                "multiscript-v14-project"
            );


        if (saved) {

            const parsed =
                JSON.parse(saved);


            if (
                parsed &&
                parsed.files
            ) {

                project = parsed;

            }

        }

    } catch (error) {

        log(
            "Não foi possível carregar o projeto salvo.",
            "error"
        );

    }

}


/* =========================================================
   FILE TREE
========================================================= */

function renderFiles() {

    const tree =
        document.getElementById(
            "fileTree"
        );


    tree.innerHTML = "";


    const files =
        Object.keys(project.files)
        .sort(function(a, b) {

            const ad =
                a.split("/").length;

            const bd =
                b.split("/").length;


            if (ad !== bd) {
                return ad - bd;
            }


            return a.localeCompare(b);

        });


    const folders = {};


    files.forEach(function(file) {

        const parts =
            file.split("/");


        if (parts.length === 1) {

            addFileItem(
                tree,
                file,
                0
            );

        } else {

            const folder =
                parts
                .slice(0, -1)
                .join("/");


            if (!folders[folder]) {

                folders[folder] = [];

            }


            folders[folder].push(file);

        }

    });


    Object.keys(folders)
    .sort()
    .forEach(function(folder) {

        const folderDiv =
            document.createElement(
                "div"
            );


        folderDiv.className =
            "ms-folder";


        folderDiv.innerHTML =
            '<i class="bi bi-folder2-open"></i> ' +
            escapeHTML(folder);


        tree.appendChild(
            folderDiv
        );


        folders[folder]
        .forEach(function(file) {

            addFileItem(
                tree,
                file,
                1
            );

        });

    });

}


function renderMobileFiles() {

    const tree =
        document.getElementById(
            "mobileFileTree"
        );


    if (!tree) {
        return;
    }


    tree.innerHTML = "";


    const files =
        Object.keys(project.files)
        .sort();


    files.forEach(function(file) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "ms-file-item";


        if (
            file === currentFile
        ) {

            item.classList.add(
                "active"
            );

        }


        item.innerHTML =
            getFileIcon(file) +
            "<span>" +
            escapeHTML(
                file
            ) +
            "</span>";


        item.onclick =
            function() {

                openFile(file);

                closeMobileExplorer();

            };


        tree.appendChild(
            item
        );

    });

}


function addFileItem(
    container,
    file,
    level
) {

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "ms-file-item";


    if (
        file === currentFile
    ) {

        item.classList.add(
            "active"
        );

    }


    item.style.paddingLeft =
        (
            9 +
            level * 17
        ) + "px";


    const icon =
        document.createElement(
            "span"
        );


    const ext =
        file
        .split(".")
        .pop()
        .toLowerCase();


    if (ext === "html") {

        icon.className =
            "file-html";

        icon.innerHTML =
            '<i class="bi bi-filetype-html"></i>';

    }

    else if (ext === "css") {

        icon.className =
            "file-css";

        icon.innerHTML =
            '<i class="bi bi-filetype-css"></i>';

    }

    else if (ext === "js") {

        icon.className =
            "file-js";

        icon.innerHTML =
            '<i class="bi bi-filetype-js"></i>';

    }

    else if (ext === "php") {

        icon.className =
            "file-php";

        icon.innerHTML =
            '<i class="bi bi-filetype-php"></i>';

    }

    else {

        icon.textContent = "•";

    }


    const name =
        document.createElement(
            "span"
        );


    name.textContent =
        file.split("/").pop();


    item.appendChild(icon);

    item.appendChild(name);


    item.onclick =
        function() {

            openFile(file);

        };


    container.appendChild(item);

}


/* =========================================================
   PLUGINS
========================================================= */

function renderPlugins() {

    const tree =
        document.getElementById(
            "pluginTree"
        );


    tree.innerHTML = "";


    const plugins =
        Object.keys(
            project.plugins || {}
        );


    if (!plugins.length) {

        const empty =
            document.createElement(
                "div"
            );


        empty.style.color =
            "#66717f";

        empty.style.fontSize =
            "10px";

        empty.style.padding =
            "7px";


        empty.textContent =
            "Nenhum plugin PHP importado.";


        tree.appendChild(
            empty
        );


        return;

    }


    plugins.forEach(function(plugin) {

        const item =
            document.createElement(
                "div"
            );


        item.className =
            "ms-file-item";


        item.innerHTML =
            '<span class="file-php">' +
            '<i class="bi bi-filetype-php"></i>' +
            '</span>' +
            '<span>' +
            escapeHTML(
                plugin.replace(
                    /^plugins\//,
                    ""
                )
            ) +
            '</span>';


        item.onclick =
            function() {

                openFile(plugin);

            };


        tree.appendChild(
            item
        );

    });

}


/* =========================================================
   OPEN FILE
========================================================= */

function openFile(file) {

    if (!project.files[file]) {
        return;
    }


    currentFile =
        file;


    document.getElementById(
        "editor"
    ).value =
        project.files[file];


    document.getElementById(
        "currentTab"

        getFileIcon(file) +
        "<span>" +
        escapeHTML(
            file.split("/").pop()
        ) +
        "</span>";


    document.getElementById(
        "previewFile"
    ).textContent =
        file;


    document.getElementById(
        "fileStatus"
    ).textContent =
        file;


    updateLineNumbers();

    renderFiles();

    renderMobileFiles();


    if (
        file
        .toLowerCase()
        .endsWith(".html")
    ) {

        previewPage();

    }

    else {

        document.getElementById(
            "previewFrame"
        ).srcdoc =
            "<body style='font-family:Arial;padding:30px'>" +
            "<h2>Preview indisponível</h2>" +
            "<p>O preview visual está disponível para arquivos HTML.</p>" +
            "</body>";

    }

}


function getFileIcon(file) {

    const ext =
        file
        .split(".")
        .pop()
        .toLowerCase();


    if (ext === "html") {

        return (
            '<span class="file-html">' +
            '<i class="bi bi-filetype-html"></i>' +
            '</span>'
        );

    }


    if (ext === "css") {

        return (
            '<span class="file-css">' +
            '<i class="bi bi-filetype-css"></i>' +
            '</span>'
        );

    }


    if (ext === "js") {

        return (
            '<span class="file-js">' +
            '<i class="bi bi-filetype-js"></i>' +
            '</span>'
        );

    }


    if (ext === "php") {

        return (
            '<span class="file-php">' +
            '<i class="bi bi-filetype-php"></i>' +
            '</span>'
        );

    }


    return "<span>•</span>";

}


/* =========================================================
   EDITOR
========================================================= */

function editorInput() {

    project.files[currentFile] =
        document.getElementById(
            "editor"
        ).value;


    updateLineNumbers();


    if (
        currentFile
        .toLowerCase()
        .endsWith(".html")
    ) {

        previewPage();

    }

}


function updateLineNumbers() {

    const editor =
        document.getElementById(
            "editor"
        );


    const lines =
        editor.value
        .split("\n")
        .length;


    let output = "";


    for (
        let i = 1;
        i <= lines;
        i++
    ) {

        output +=
            i + "\n";

    }


    document.getElementById(
        "lineNumbers"
    ).textContent =
        output;

}


function syncEditorScroll() {

    const editor =
        document.getElementById(
            "editor"
        );


    document.getElementById(
        "lineNumbers"
    ).scrollTop =
        editor.scrollTop;

}


function handleEditorKey(event) {

    if (
        event.key === "Tab"
    ) {

        event.preventDefault();


        const editor =
            document.getElementById(
                "editor"
            );


        const start =
            editor.selectionStart;


        const end =
            editor.selectionEnd;


        editor.value =
            editor.value.substring(
                0,
                start
            ) +
            "    " +
            editor.value.substring(
                end
            );


        editor.selectionStart =
            editor.selectionEnd =
                start + 4;


        editorInput();

    }

}


/* =========================================================
   PREVIEW
========================================================= */

function previewPage() {

    if (
        !currentFile
        .toLowerCase()
        .endsWith(".html")
    ) {

        return;

    }


    const html =
        project.files[currentFile];


    const css =
        project.files["style.css"] ||
        "";


    const js =
        project.files["script.js"] ||
        "";


    const safeJS =
        js.replace(
            /<\/script/gi,
            "<" + "/script"
        );


    let finalHTML =
        html;


    if (
        finalHTML.includes(
            "<head>"
        )
    ) {

        finalHTML =
            finalHTML.replace(
                "<head>",
                "<head><style>" +
                css +
                "</style>"
            );

    }


    if (
        finalHTML.includes(
            "</body>"
        )
    ) {

        finalHTML =
            finalHTML.replace(
                "</body>",
                "<script>" +
                safeJS +
                "<" + "/script></body>"
            );

    }


    document.getElementById(
        "previewFrame"
    ).srcdoc =
        finalHTML;

}


/* =========================================================
   FORMAT HTML
========================================================= */

function formatHTML() {

    if (
        !currentFile
        .toLowerCase()
        .endsWith(".html")
    ) {

        log(
            "Formatação disponível para HTML.",
            "error"
        );

        return;

    }


    let html =
        document.getElementById(
            "editor"
        ).value;


    html =
        html
        .replace(
            />\s+</g,
            "><"
        )
        .replace(
            /></g,
            ">\n<"
        );


    const lines =
        html.split("\n");


    let indent = 0;

    const formatted = [];


    lines.forEach(
        function(line) {

            line =
                line.trim();


            if (!line) {
                return;
            }


            if (
                /^<\/(body|html|head|div|section|main|header|footer|nav|article|ul|ol|li|form)/i
                .test(line)
            ) {

                indent =
                    Math.max(
                        0,
                        indent - 1
                    );

            }


            formatted.push(
                "    ".repeat(
                    indent
                ) +
                line
            );


            if (
                /^<(html|head|body|div|section|main|header|footer|nav|article|ul|ol|form)(\s|>)/i
                .test(line) &&
                !/<\/[^>]+>$/.test(line)
            ) {

                indent++;

            }

        }
    );


    document.getElementById(
        "editor"
    ).value =
        formatted.join("\n");


    editorInput();


    log(
        "HTML formatado.",
        "success"
    );

}

function getCategoryOptions() {

    const files =
        Object.keys(
            project.files
        );


    let html = "";


    files.forEach(
        function(file) {

            if (
                file.endsWith(".html") &&
                file.split("/").length === 1 &&
                file !== "index.html"
            ) {

                const name =
                    file
                    .replace(
                        ".html",
                        ""
                    )
                    .replace(
                        /-/g,
                        " "
                    );


                html +=
                    '<option value="' +
                    escapeAttribute(name) +
                    '">';

            }

        }
    );


    return html;

}


/* =========================================================
   GERAR PÁGINA
========================================================= */

function generatePage(type) {

    const nameElement =
        document.getElementById(
            "pageName"
        );


    const contentElement =
        document.getElementById(
            "pageContent"
        );


    const name =
        nameElement
        ? nameElement.value.trim()
        : "";


    const content =
        contentElement
        ? contentElement.value
        : "";


    if (!name) {

        alert(
            "Informe o nome da página."
        );

        return;

    }


    const slug =
        slugify(name);


    if (!slug) {

        alert(
            "O nome informado não pode gerar um arquivo válido."
        );

        return;

    }


    let path = "";


    if (
        type === "category"
    ) {

        path =
            slug +
            ".html";

    }


    if (
        type === "institutional"
    ) {

        path =
            slug +
            ".html";

    }


    if (
        type === "subpage"
    ) {

        const parentElement =
            document.getElementById(
                "parentCategory"
            );


        const parent =
            parentElement
            ? parentElement.value.trim()
            : "";


        if (!parent) {

            alert(
                "Informe a categoria da sub página."
            );

            return;

        }


        const parentSlug =
            slugify(parent);


        if (!parentSlug) {

            alert(
                "A categoria informada não é válida."
            );

            return;

        }


        path =
            parentSlug +
            "/" +
            slug +
            ".html";

    }


    if (
        project.files[path]
    ) {

        const overwrite =
            confirm(
                "O arquivo " +
                path +
                " já existe.\n\n" +
                "Deseja substituir?"
            );


        if (!overwrite) {
            return;
        }

    }


    const selectedPlugins =
        Array.from(
            document.querySelectorAll(
                ".generator-plugin:checked"
            )
        ).map(
            function(input) {
                return input.value;
            }
        );


    project.files[path] =
        createPageTemplate(
            type,
            name,
            content,
            selectedPlugins
        );


    saveProject();

    renderFiles();

    renderMobileFiles();

    closeModal();

    openFile(path);


    log(
        "Página criada: " +
        path,
        "success"
    );


    setStatus(
        "Página criada: " +
        path
    );

}


/* =========================================================
   TEMPLATE
========================================================= */

function createPageTemplate(
    type,
    name,
    content,
    plugins
) {

    const title =
        escapeHTML(name);


    let breadcrumb = "";


    if (
        type === "subpage"
    ) {

        breadcrumb = `

    <nav aria-label="Breadcrumb">

        <a href="../index.html">
            Início
        </a>

        /

        <span>
            ${title}
        </span>

    </nav>

`;

    }


    let pluginComment = "";


    if (
        plugins.length
    ) {

        pluginComment =
            "\n<!-- MultiScript — Plugins PHP associados:\n" +
            plugins
            .map(
                function(plugin) {

                    return (
                        "     " +
                        plugin
                    );

                }
            )
            .join("\n") +
            "\n-->\n";

    }


    let description =
        "Página criada pelo MultiScript HTML Editor V14.";


    if (
        type === "category"
    ) {

        description =
            "Página de categoria criada pelo MultiScript HTML Editor V14.";

    }


    if (
        type === "institutional"
    ) {

        description =
            "Página institucional criada pelo MultiScript HTML Editor V14.";

    }


    if (
        type === "subpage"
    ) {

        description =
            "Sub página criada pelo MultiScript HTML Editor V14.";

    }


    const base =
        type === "subpage"
        ? "../"
        : "";


    return `<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="${escapeAttribute(description)}"
    >

    <title>${title}</title>

    <link
        rel="stylesheet"
        href="${base}style.css"
    >

</head>

<body>
${pluginComment}

<header>

    <h1>${title}</h1>

    <nav>

        <a href="${base}index.html">
            Início
        </a>

    </nav>

</header>

<main>

${breadcrumb}

    <section>

        ${
            content ||
            `
        <h2>${title}</h2>

        <p>
            Conteúdo da página ${title}.
        </p>
            `
        }

    </section>

</main>

<footer>

    <p>
        Página criada com MultiScript HTML Editor V14.
    </p>

</footer>

<script src="${base}script.js"><\/script>

</body>

</html>`;

}


/* =========================================================
   SLUGIFY
========================================================= */

function slugify(value) {

    return String(value)

        .normalize("NFD")

        .replace(
            /[\u0300-\u036f]/g,
            ""
        )

        .toLowerCase()

        .trim()

        .replace(
            /[^a-z0-9]+/g,
            "-"
        )

        .replace(
            /^-+|-+$/g,
            ""
        );

}


/* =========================================================
   PHP IMPORT
========================================================= */

document.getElementById(
    "phpInput"
).addEventListener(
    "change",
    async function(event) {

        const files =
            Array.from(
                event.target.files || []
            );


        if (!files.length) {
            return;
        }


        for (
            const file of files
        ) {

            if (
                !file.name
                .toLowerCase()
                .endsWith(".php")
            ) {

                continue;

            }


            const content =
                await file.text();


            const path =
                "plugins/" +
                file.name;


            project.files[path] =
                content;


            project.plugins[path] =
                true;


            log(
                "Plugin PHP importado: " +
                path,
                "success"
            );

        }


        renderFiles();

        renderPlugins();

        renderMobileFiles();

        saveProject();


        event.target.value = "";

    }
);


function openPHPImporter() {

    document.getElementById(
        "phpInput"
    ).click();

}


/* =========================================================
   PLUGIN MANAGER
========================================================= */

function openPluginManager() {

    const plugins =
        Object.keys(
            project.plugins || {}
        );


    let body = "";


    if (!plugins.length) {

        body = `

            <div class="alert alert-dark border-secondary">

                <div class="fw-bold mb-2">
                    Nenhum plugin PHP
                </div>

                <div class="small text-secondary">

                    O MultiScript não possui plugins PHP
                    fixos.

                    Os arquivos .php são adicionados
                    pelo próprio usuário.

                </div>

            </div>

        `;

    }

    else {

        plugins.forEach(
            function(plugin) {

                body += `

                    <div
                        class="d-flex align-items-center gap-2 p-2 border-bottom border-secondary"
                    >

                        <span class="file-php">
                            <i class="bi bi-filetype-php"></i>
                        </span>

                        <span
                            class="flex-grow-1 small"
                        >
                            ${escapeHTML(plugin)}
                        </span>

                        <button
                            class="btn btn-sm btn-ms"
                            onclick="openFile('${escapeAttribute(plugin)}');closeModal()"
                        >
                            Abrir
                        </button>

                        <button
                            class="btn btn-sm btn-danger"
                            onclick="removePlugin('${escapeAttribute(plugin)}')"
                        >
                            Remover
                        </button>

                    </div>

                `;

            }
        );

    }


    openModal(
        "PLUGINS PHP DO USUÁRIO",
        body,
        `

            <button
                class="btn btn-ms"
                onclick="openPHPImporter();closeModal()"
            >
                <i class="bi bi-plus"></i>
                Importar PHP
            </button>

            <button
                class="btn btn-ms-primary"
                onclick="closeModal()"
            >
                Fechar
            </button>

        `
    );

}


function removePlugin(path) {

    const confirmed =
        confirm(
            "Remover o plugin " +
            path +
            "?"
        );


    if (!confirmed) {
        return;
    }


    delete project.files[path];

    delete project.plugins[path];


    if (
        currentFile === path
    ) {

        openFile(
            "index.html"
        );

    }


    saveProject();

    renderFiles();

    renderPlugins();

    renderMobileFiles();


    openPluginManager();


    log(
        "Plugin removido: " +
        path,
        "success"
    );

}

async function confirmExport(
    credit
) {

    closeModal();


    setStatus(
        "Preparando ZIP..."
    );


    const zip =
        new JSZip();


    const files =
        {
            ...project.files
        };


    if (
        credit !== "none"
    ) {

        Object.keys(files)
        .forEach(
            function(path) {

                if (
                    path
                    .toLowerCase()
                    .endsWith(".html")
                ) {

                    files[path] =
                        insertCredits(
                            files[path],
                            credit
                        );

                }

            }
        );

    }


    Object.keys(files)
    .forEach(
        function(path) {

            zip.file(
                path,
                files[path]
            );

        }
    );


    const blob =
        await zip.generateAsync({
            type: "blob"
        });


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        project.name +
        ".zip";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );


    setStatus(
        "ZIP exportado"
    );


    log(
        "Projeto exportado com sucesso.",
        "success"
    );

}


/* =========================================================
   CRÉDITOS
========================================================= */

function insertCredits(
    html,
    credit
) {

    let name = "";

    let url = "";


    if (
        credit === "multipage"
    ) {

        name =
            "Multipage Mel";

        url =
            "https://multipagemel.pages.dev/";

    }


    if (
        credit === "corretores"
    ) {

        name =
            "Apenas Corretores";

        url =
            "https://apenascorretores.pages.dev/";

    }


    if (
        credit === "homemsite"
    ) {

        name =
            "HomemSite";

        url =
            "https://homemsite.pages.dev/";

    }


    if (
        credit === "homemsite-pr"
    ) {

        name =
            "HomemSite Paraná";

        url =
            "https://homemsite.pages.dev/parana/";

    }


    if (!name) {
        return html;
    }


    const block = `

<!-- MULTISCRIPT CREDITOS INICIO -->

<footer
    class="multiscript-credit"
    style="
        padding:20px;
        text-align:center;
        font-family:Arial,sans-serif;
        font-size:12px;
    "
>

    <p>
        Este site garante a segurança
        na coleta e tratamento de dados,
        em conformidade com a LGPD.
    </p>

    <p>
        © V14.0.0 by MultiScript HTML Editor
    </p>

    <p>

        <a
            href="${url}"
            target="_blank"
            rel="noopener"
        >
            ${name}
        </a>

    </p>

</footer>

<!-- MULTISCRIPT CREDITOS FIM -->

`;


    if (
        html
        .toLowerCase()
        .includes("</body>")
    ) {

        return html.replace(
            /<\/body>/i,
            block +
            "<" +
            "/body>"
        );

    }


    return (
        html +
        block
    );

}


/* =========================================================
   MODAL
========================================================= */

function openModal(
    title,
    body,
    footer
) {

    document.getElementById(
        "modalTitle"
    ).textContent =
        title;


    document.getElementById(
        "modalBody"
    ).innerHTML =
        body;


    document.getElementById(
        "modalFooter"
    ).innerHTML =
        footer || "";


    document.getElementById(
        "modalBackdrop"
    ).classList.add(
        "open"
    );

}


function closeModal() {

    document.getElementById(
        "modalBackdrop"
    ).classList.remove(
        "open"
    );

}


document.getElementById(
    "modalBackdrop"
).addEventListener(
    "click",
    function(event) {

        if (
            event.target === this
        ) {

            closeModal();

        }

    }
);


/* =========================================================
   MOBILE
========================================================= */

function closeMobileExplorer() {

    const element =
        document.getElementById(
            "mobileExplorer"
        );


    const instance =
        bootstrap.Offcanvas
        .getInstance(
            element
        );


    if (instance) {

        instance.hide();

    }

}


function mobileAction(
    action
) {

    closeMobileExplorer();


    setTimeout(
        function() {

            if (
                action === "generator"
            ) {

                openGenerator();

            }


            if (
                action === "plugin"
            ) {

                openPHPImporter();

            }


            if (
                action === "plugins"
            ) {

                openPluginManager();

            }


            if (
                action === "save"
            ) {

                saveProject();

            }


            if (
                action === "export"
            ) {

                openCreditDialog();

            }

        },
        250
    );

}


function openDesktopExplorer() {

    if (
        window.innerWidth <= 991
    ) {

        const element =
            document.getElementById(
                "mobileExplorer"
            );


        const instance =
            bootstrap.Offcanvas
            .getOrCreateInstance(
                element
            );


        instance.show();

    }

}


/* =========================================================
   TERMINAL
========================================================= */

function log(
    message,
    type
) {

    const output =
        document.getElementById(
            "terminalOutput"
        );


    const line =
        document.createElement(
            "div"
        );


    line.className =
        "log-line " +
        (
            type === "success"
                ? "log-success"
                : type === "error"
                    ? "log-error"
                    : type === "info"
                        ? "log-info"
                        : ""
        );


    line.textContent =
        "> " +
        message;


    output.appendChild(
        line
    );


    output.scrollTop =
        output.scrollHeight;

}


function setStatus(
    message
) {

    document.getElementById(
        "statusText"
    ).textContent =
        message;

}


/* =========================================================
   UTILITÁRIOS
========================================================= */

function escapeHTML(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(
        value
    );

}
