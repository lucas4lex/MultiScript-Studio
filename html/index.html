<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MultiScript HTML Editor V14</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#0b1120;
    color:#dbe4f0;
}

button,input,select,textarea{font:inherit}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}

/* TOPBAR */
.topbar{
    height:56px;
    background:#111827;
    border-bottom:1px solid #273449;
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 10px;
    flex-shrink:0;
}

.logo{
    font-size:16px;
    font-weight:bold;
    color:#fff;
    margin-right:12px;
    white-space:nowrap;
}

.topbar button{
    background:#182235;
    color:#dbeafe;
    border:1px solid #334155;
    border-radius:5px;
    padding:7px 10px;
    cursor:pointer;
    white-space:nowrap;
}

.topbar button:hover{background:#24324a}

.topbar .primary{
    background:#2563eb;
    border-color:#2563eb;
    color:white;
}

.topbar .primary:hover{background:#1d4ed8}

/* WORKSPACE */
.workspace-main{
    flex:1;
    display:flex;
    min-height:0;
}

/* EXPLORER */
.explorer{
    width:245px;
    background:#0f172a;
    border-right:1px solid #273449;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
}

.explorer-head{
    padding:12px;
    border-bottom:1px solid #273449;
    font-size:12px;
    font-weight:bold;
    color:#94a3b8;
}

.project-name{
    color:#fff;
    font-size:13px;
    margin-top:5px;
}

.tree{
    padding:8px;
    overflow:auto;
    flex:1;
}

.tree-folder{
    color:#fbbf24;
    padding:5px 7px;
    font-size:12px;
    font-weight:bold;
}

.file{
    display:flex;
    align-items:center;
    gap:7px;
    padding:7px 9px;
    border-radius:4px;
    cursor:pointer;
    color:#cbd5e1;
    font-size:12px;
    margin:1px 0;
}

.file:hover{background:#172033}

.file.active{
    background:#1e3a5f;
    color:#fff;
}

.file.locked{color:#fbbf24}

.file-icon{
    width:18px;
    text-align:center;
}

.tree-indent{padding-left:18px}

/* CENTER */
.center{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
}

.tabs{
    height:38px;
    background:#0b1220;
    border-bottom:1px solid #273449;
    display:flex;
    overflow-x:auto;
    flex-shrink:0;
}

.tab{
    padding:10px 14px;
    border-right:1px solid #273449;
    color:#94a3b8;
    font-size:12px;
    cursor:pointer;
    white-space:nowrap;
}

.tab.active{
    background:#111827;
    color:white;
    border-top:2px solid #3b82f6;
}

/* EDITOR */
.editor-wrap{
    flex:1;
    min-height:0;
    position:relative;
    background:#0b1120;
    display:flex;
}

.line-numbers{
    width:48px;
    padding:13px 7px;
    text-align:right;
    color:#475569;
    background:#0b1120;
    border-right:1px solid #1e293b;
    overflow:hidden;
    font:13px/1.55 Consolas,monospace;
    user-select:none;
}

#editor{
    flex:1;
    width:0;
    height:100%;
    resize:none;
    outline:none;
    border:0;
    padding:13px;
    background:#0b1120;
    color:#dbeafe;
    font:13px/1.55 Consolas,"Courier New",monospace;
    tab-size:4;
    white-space:pre;
    overflow:auto;
}

/* TERMINAL */
.terminal{
    height:150px;
    background:#050914;
    border-top:1px solid #273449;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
}

.terminal-head{
    padding:6px 10px;
    color:#94a3b8;
    font-size:11px;
    border-bottom:1px solid #1e293b;
}

#terminalOutput{
    flex:1;
    overflow:auto;
    padding:8px 10px;
    color:#86efac;
    font:12px/1.5 Consolas,monospace;
}

/* STATUS */
.status{
    height:25px;
    background:#2563eb;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 9px;
    font-size:11px;
    flex-shrink:0;
}

/* MODAL */
.modal-bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(850px,100%);
    max-height:90vh;
    overflow:auto;
    background:#111827;
    border:1px solid #334155;
    border-radius:9px;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.modal-head{
    padding:15px 18px;
    border-bottom:1px solid #334155;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-head h2{
    margin:0;
    font-size:17px;
    color:#fff;
}

.modal-close{
    border:0;
    background:none;
    color:#94a3b8;
    font-size:20px;
    cursor:pointer;
}

.modal-body{padding:18px}

.modal-footer{
    padding:12px 18px;
    border-top:1px solid #334155;
    display:flex;
    justify-content:flex-end;
    gap:8px;
}

/* GENERATOR */
.generator-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.generator-card{
    border:1px solid #334155;
    background:#172033;
    border-radius:7px;
    padding:18px;
    cursor:pointer;
}

.generator-card:hover{
    background:#1d2b43;
    border-color:#3b82f6;
}

.generator-card .icon{
    font-size:27px;
    margin-bottom:8px;
}

.generator-card strong{
    color:white;
    display:block;
}

.generator-card small{
    color:#94a3b8;
}

/* FORMS */
.form-group{margin-bottom:13px}

.form-group label{
    display:block;
    color:#94a3b8;
    font-size:12px;
    margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    padding:9px;
    border:1px solid #334155;
    border-radius:5px;
    background:#0b1220;
    color:#fff;
    outline:none;
}

.form-group textarea{
    min-height:130px;
    resize:vertical;
}

.btn{
    border:1px solid #334155;
    background:#182235;
    color:#dbeafe;
    border-radius:5px;
    padding:8px 13px;
    cursor:pointer;
}

.btn:hover{background:#24324a}

.btn-primary{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
}

/* PLUGINS */
.plugin-item{
    padding:10px;
    border:1px solid #334155;
    background:#172033;
    border-radius:5px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

/* IMAGE EDITOR */
.image-editor{
    position:fixed;
    inset:0;
    z-index:2000;
    background:#0b1120;
    display:none;
    flex-direction:column;
}

.image-top{
    height:52px;
    background:#111827;
    border-bottom:1px solid #334155;
    display:flex;
    align-items:center;
    gap:6px;
    padding:7px;
}

.image-top button{
    border:1px solid #334155;
    background:#182235;
    color:#dbeafe;
    border-radius:4px;
    padding:7px 10px;
    cursor:pointer;
}

.image-top button:hover{background:#24324a}

.image-top .save{
    background:#2563eb;
    border-color:#2563eb;
    color:#fff;
}

.image-layout{
    flex:1;
    min-height:0;
    display:flex;
}

.image-tools{
    width:75px;
    background:#0f172a;
    border-right:1px solid #334155;
    padding:6px;
}

.image-tool{
    width:63px;
    height:53px;
    background:transparent;
    border:1px solid transparent;
    border-radius:5px;
    color:#cbd5e1;
    cursor:pointer;
    font-size:10px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:3px;
}

.image-tool span{font-size:19px}

.image-tool:hover{background:#172033}

.image-tool.active{
    background:#1d4ed8;
    border-color:#3b82f6;
    color:#fff;
}

.image-canvas-area{
    flex:1;
    min-width:0;
    overflow:auto;
    position:relative;
    background:
        linear-gradient(45deg,#151d2b 25%,transparent 25%),
        linear-gradient(-45deg,#151d2b 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#151d2b 75%),
        linear-gradient(-45deg,transparent 75%,#151d2b 75%);
    background-size:28px 28px;
    background-position:0 0,0 14px,14px -14px,-14px 0;
}

.image-workspace{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%) scale(1);
    transform-origin:center;
    box-shadow:0 20px 70px #000;
}

#svgCanvas{
    display:block;
    background:white;
}

.image-properties{
    width:285px;
    overflow:auto;
    background:#0f172a;
    border-left:1px solid #334155;
}

.image-panel{
    padding:13px;
    border-bottom:1px solid #273449;
}

.image-panel h3{
    margin:0 0 10px;
    font-size:11px;
    text-transform:uppercase;
    color:#94a3b8;
}

.image-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:7px;
}

.image-field{margin-bottom:8px}

.image-field label{
    display:block;
    color:#94a3b8;
    font-size:10px;
    margin-bottom:3px;
}

.image-field input,
.image-field select{
    width:100%;
    background:#0b1220;
    color:#fff;
    border:1px solid #334155;
    border-radius:4px;
    padding:6px;
}

.layers{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.layer{
    display:flex;
    gap:6px;
    align-items:center;
    padding:7px;
    background:#172033;
    border:1px solid #273449;
    border-radius:4px;
    cursor:pointer;
    font-size:11px;
}

.layer.active{
    border-color:#3b82f6;
    background:#17325c;
}

.layer-eye{
    border:0;
    background:none;
    color:#cbd5e1;
    cursor:pointer;
}

.image-status{
    height:27px;
    background:#111827;
    border-top:1px solid #334155;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 9px;
    color:#94a3b8;
    font-size:10px;
}

/* PREVIEW */
.preview-frame{
    width:100%;
    height:75vh;
    border:0;
    background:white;
}

/* RESPONSIVE */
@media(max-width:900px){
    .explorer{width:190px}
    .image-properties{width:230px}
}

@media(max-width:700px){
    .explorer{display:none}
    .topbar{overflow-x:auto}
    .image-properties{display:none}
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">

        <div class="logo">⚡ MultiScript V14</div>

        <button onclick="newProject()">＋ Novo Projeto</button>
        <button onclick="openGeneratorMenu()">＋ Gerar Página</button>
        <button onclick="document.getElementById('phpInput').click()">＋ Plugin PHP</button>
        <button onclick="openPlugins()">Plugins</button>
        <button onclick="openImageManager()">🎨 Imagens</button>
        <button onclick="formatHTML()">Formatar</button>
        <button class="primary" onclick="saveProject()">💾 Salvar</button>
        <button onclick="previewProject()">👁 Preview</button>
        <button onclick="exportZip()">📦 Exportar ZIP</button>

        <input
            id="phpInput"
            type="file"
            accept=".php"
            multiple
            hidden
        >

    </header>

    <div class="workspace-main">

        <aside class="explorer">

            <div class="explorer-head">
                EXPLORER
                <div class="project-name" id="projectName">
                    MEU-PROJETO
                </div>
            </div>

            <div class="tree" id="explorer"></div>

        </aside>

        <main class="center">

            <div class="tabs" id="tabs"></div>

            <div class="editor-wrap">

                <div class="line-numbers" id="lineNumbers">
                    1
                </div>

                <textarea
                    id="editor"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    oninput="editorInput()"
                    onscroll="syncEditorScroll()"
                    onkeydown="editorKeydown(event)"
                ></textarea>

            </div>

            <div class="terminal">

                <div class="terminal-head">
                    TERMINAL
                </div>

                <div id="terminalOutput">
                    MultiScript V14 iniciado.
                </div>

            </div>

        </main>

    </div>

    <div class="status">
        <span id="statusLeft">HTML</span>
        <span id="statusRight">UTF-8 · V14.0.0</span>
    </div>

</div>


<!-- MODAL GENÉRICO -->
<div class="modal-bg" id="modal">

    <div class="modal-box">

        <div class="modal-head">

            <h2 id="modalTitle">
                MultiScript
            </h2>

            <button
                class="modal-close"
                onclick="closeModal()">
                ×
            </button>

        </div>

        <div
            class="modal-body"
            id="modalBody">
        </div>

        <div
            class="modal-footer"
            id="modalFooter">
        </div>

    </div>

</div>


<!-- IMAGE EDITOR -->
<div class="image-editor" id="imageEditor">

    <div class="image-top">

        <strong style="color:#fff;margin-right:10px">
            🎨 MultiScript Image Editor
        </strong>

        <button onclick="imageNew()">Novo</button>
        <button onclick="imageUndo()">↶</button>
        <button onclick="imageRedo()">↷</button>

        <button onclick="imageZoom(-.1)">−</button>
        <button onclick="imageZoom(0)">100%</button>
        <button onclick="imageZoom(.1)">+</button>

        <button onclick="importSVGImage()">🖼 Imagem</button>

        <button onclick="exportImagePNG()">PNG</button>

        <button
            class="save"
            onclick="saveImageSVG()">
            💾 Salvar SVG
        </button>

        <button onclick="closeImageEditor()">
            ✕ Fechar
        </button>

    </div>

    <div class="image-layout">

        <aside class="image-tools">

            <button
                class="image-tool active"
                data-itool="select"
                onclick="setImageTool('select')">
                <span>↖</span>
                Seleção
            </button>

            <button
                class="image-tool"
                data-itool="rect"
                onclick="setImageTool('rect')">
                <span>▭</span>
                Retângulo
            </button>

            <button
                class="image-tool"
                data-itool="circle"
                onclick="setImageTool('circle')">
                <span>○</span>
                Círculo
            </button>

            <button
                class="image-tool"
                data-itool="line"
                onclick="setImageTool('line')">
                <span>╱</span>
                Linha
            </button>

            <button
                class="image-tool"
                data-itool="text"
                onclick="setImageTool('text')">
                <span>T</span>
                Texto
            </button>

            <button
                class="image-tool"
                data-itool="free"
                onclick="setImageTool('free')">
                <span>✎</span>
                Pincel
            </button>

        </aside>

        <div
            class="image-canvas-area"
            id="imageCanvasArea">

            <div
                class="image-workspace"
                id="imageWorkspace">

                <svg
                    id="svgCanvas"
                    xmlns="http://www.w3.org/2000/svg"
                    width="1000"
                    height="600"
                    viewBox="0 0 1000 600">

                    <rect
                        id="svgBackground"
                        x="0"
                        y="0"
                        width="1000"
                        height="600"
                        fill="#ffffff"/>

                </svg>

            </div>

        </div>

        <aside class="image-properties">

            <div class="image-panel">

                <h3>Documento</h3>

                <div class="image-row">

                    <div class="image-field">
                        <label>Largura</label>
                        <input
                            id="svgWidth"
                            type="number"
                            value="1000"
                            onchange="changeSVGSize()">
                    </div>

                    <div class="image-field">
                        <label>Altura</label>
                        <input
                            id="svgHeight"
                            type="number"
                            value="600"
                            onchange="changeSVGSize()">
                    </div>

                </div>

                <div class="image-field">

                    <label>Fundo</label>

                    <input
                        id="svgBgColor"
                        type="color"
                        value="#ffffff"
                        onchange="changeSVGBackground()">

                </div>

            </div>


            <div class="image-panel">

                <h3>Objeto</h3>

                <div class="image-row">

                    <div class="image-field">
                        <label>X</label>
                        <input
                            id="objX"
                            type="number"
                            onchange="changeObject()">
                    </div>

                    <div class="image-field">
                        <label>Y</label>
                        <input
                            id="objY"
                            type="number"
                            onchange="changeObject()">
                    </div>

                </div>

                <div class="image-row">

                    <div class="image-field">
                        <label>Largura</label>
                        <input
                            id="objW"
                            type="number"
                            onchange="changeObject()">
                    </div>

                    <div class="image-field">
                        <label>Altura</label>
                        <input
                            id="objH"
                            type="number"
                            onchange="changeObject()">
                    </div>

                </div>

            </div>


            <div class="image-panel">

                <h3>Aparência</h3>

                <div class="image-field">

                    <label>Preenchimento</label>

                    <input
                        id="objFill"
                        type="color"
                        value="#2563eb"
                        onchange="changeObjectStyle()">

                </div>

                <div class="image-field">

                    <label>Borda</label>

                    <input
                        id="objStroke"
                        type="color"
                        value="#111827"
                        onchange="changeObjectStyle()">

                </div>

                <div class="image-field">

                    <label>Espessura</label>

                    <input
                        id="objStrokeWidth"
                        type="number"
                        value="0"
                        min="0"
                        onchange="changeObjectStyle()">

                </div>

                <div class="image-field">

                    <label>Opacidade</label>

                    <input
                        id="objOpacity"
                        type="range"
                        min="0"
                        max="1"
                        step=".01"
                        value="1"
                        onchange="changeObjectStyle()">

                </div>

            </div>


            <div
                class="image-panel"
                id="textProperties"
                style="display:none">

                <h3>Texto</h3>

                <div class="image-field">

                    <label>Texto</label>

                    <input
                        id="objText"
                        onchange="changeText()">

                </div>

                <div class="image-field">

                    <label>Tamanho</label>

                    <input
                        id="objTextSize"
                        type="number"
                        value="40"
                        onchange="changeText()">

                </div>

                <div class="image-field">

                    <label>Fonte</label>

                    <select
                        id="objFont"
                        onchange="changeText()">

                        <option>Arial</option>
                        <option>Verdana</option>
                        <option>Tahoma</option>
                        <option>Georgia</option>
                        <option>Times New Roman</option>
                        <option>Courier New</option>

                    </select>

                </div>

            </div>


            <div class="image-panel">

                <h3>Camadas</h3>

                <div
                    class="layers"
                    id="imageLayers">
                </div>

            </div>

        </aside>

    </div>

    <div class="image-status">

        <span id="imageFileStatus">
            Nenhuma imagem aberta
        </span>

        <span id="imageZoomStatus">
            100%
        </span>

    </div>

</div>


<script>
/* ==========================================================
   MULTISCRIPT V14
========================================================== */

const BOOTSTRAP_CSS =
'<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">';

const BOOTSTRAP_JS =
'<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"><\/script>';

let project={
    name:"MEU-PROJETO",

    files:{
        "index.html":"",
        "categorias.html":"",
        "institucional.html":"",
        "style.css":"",
        "script.js":"",
        "sitemap.xml":"",
        "multiscript.json":""
    },

    plugins:{},

    pages:{
        "index.html":{
            type:"menu",
            name:"Início",
            slug:"",
            url:"/"
        },

        "categorias.html":{
            type:"menu",
            name:"Categorias",
            slug:"categorias",
            url:"/categorias"
        },

        "institucional.html":{
            type:"menu",
            name:"Institucional",
            slug:"institucional",
            url:"/institucional"
        }
    },

    protectedFiles:[
        "multiscript.json"
    ]
};

let currentFile="index.html";

let tabs=[];


/* ==========================================================
   UTILS
========================================================== */

function terminal(message){

    const box=
        document.getElementById(
            "terminalOutput"
        );

    const line=
        document.createElement("div");

    line.textContent=
        "> "+message;

    box.appendChild(line);

    box.scrollTop=
        box.scrollHeight;
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeXML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&apos;");

}


function slugify(value){

    return String(value)
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9]+/g,"-")
        .replace(/^-+|-+$/g,"");

}

/* ==========================================================
   EXPLORER
========================================================== */

function getFileIcon(path){

if(path==="multiscript.json")return "🔒";

if(path.startsWith("images/"))return "🎨";

if(path.startsWith("plugins/"))return "🧩";

if(path.endsWith(".html"))return "🌐";

if(path.endsWith(".css"))return "🎨";

if(path.endsWith(".js"))return "⚙️";

if(path.endsWith(".php"))return "🐘";

if(path.endsWith(".xml"))return "🗺️";

return "📄";

}


function renderExplorer(){

const box=
document.getElementById(
    "explorer"
);

box.innerHTML="";

const files=
Object.keys(project.files);

const normal=
files.filter(
    f=>
        !f.startsWith("images/") &&
        !f.startsWith("plugins/")
);

normal.forEach(
    path=>addFileButton(
        box,
        path
    )
);


const images=
files.filter(
    f=>f.startsWith("images/")
);

if(images.length){

const folder=
document.createElement("div");

folder.className="tree-folder";

folder.textContent="📁 images";

box.appendChild(folder);

images.forEach(
    path=>{

        const item=
            document.createElement("div");

        item.className=
            "file tree-indent";

        item.innerHTML=
            `<span class="file-icon">🎨</span>
             <span>${escapeHTML(path.split("/").pop())}</span>`;

        if(path===currentFile)
            item.classList.add("active");

        item.onclick=()=>{
            openFile(path);
        };

        box.appendChild(item);

    }
);

}


const plugins=
files.filter(
    f=>f.startsWith("plugins/")
);

const folder=
document.createElement("div");

folder.className="tree-folder";

folder.textContent=
"📁 plugins";

box.appendChild(folder);

plugins.forEach(
    path=>{

        addFileButton(
            box,
            path,
            true
        );

    }
);

}


function addFileButton(
    box,
    path,
    indent=false
){

const item=
document.createElement("div");

item.className=
    "file" +
    (indent ? " tree-indent" : "") +
    (
        path===currentFile
            ? " active"
            : ""
    );

if(
    project.protectedFiles
        .includes(path)
){

    item.classList.add("locked");

}

item.innerHTML=
`<span class="file-icon">
${getFileIcon(path)}
</span>
<span>${escapeHTML(
    path.split("/").pop()
)}</span>`;

item.onclick=()=>{
    openFile(path);
};

box.appendChild(item);

}


/* ==========================================================
   OPEN FILE
========================================================== */

function openFile(path){

if(path==="multiscript.json"){

    showProtectedFile();

    return;

}

if(
    path.startsWith("images/") &&
    path.toLowerCase().endsWith(".svg")
){

    openImageEditor(path);

    return;

}

currentFile=path;

if(!tabs.includes(path))
    tabs.push(path);

document.getElementById("editor").value=
    project.files[path] || "";

renderExplorer();

renderTabs();

updateLineNumbers();

updateStatus();

terminal(
    "Arquivo aberto: "+path
);

}


function showProtectedFile(){

openModal(
    "🔒 Arquivo protegido",
    `<div style="padding:15px;background:#172033;border:1px solid #334155;border-radius:6px">
    <strong>multiscript.json</strong> é um arquivo interno do MultiScript
    e não pode ser editado manualmente.
    </div>`,
    `<button class="btn btn-primary" onclick="closeModal()">Entendi</button>`
);

}


/* ==========================================================
   TABS
========================================================== */

function renderTabs(){

const box=
document.getElementById("tabs");

box.innerHTML="";

tabs.forEach(
    path=>{

        const tab=
            document.createElement("div");

        tab.className=
            "tab"+
            (
                path===currentFile
                    ? " active"
                    : ""
            );

        tab.textContent=
            path.split("/").pop();

        tab.onclick=()=>{
            openFile(path);
        };

        box.appendChild(tab);

    }
);

}


/* ==========================================================
   EDITOR
========================================================== */

function editorInput(){

if(
    project.protectedFiles
        .includes(currentFile)
){

    openFile(currentFile);

    return;

}

project.files[currentFile]=
    document.getElementById(
        "editor"
    ).value;

updateLineNumbers();

}


function updateLineNumbers(){

const value=
document.getElementById(
    "editor"
).value;

const count=
Math.max(
    1,
    value.split("\n").length
);

document.getElementById(
    "lineNumbers"
).innerHTML=
Array.from(
    {length:count},
    (_,i)=>i+1
).join("<br>");

}


function syncEditorScroll(){

const editor=
document.getElementById("editor");

document.getElementById(
    "lineNumbers"
).scrollTop=
editor.scrollTop;

}


function editorKeydown(event){

if(event.key==="Tab"){

event.preventDefault();

const editor=
document.getElementById("editor");

const start=
editor.selectionStart;

const end=
editor.selectionEnd;

editor.value=
    editor.value.substring(0,start)+
    "    "+
    editor.value.substring(end);

editor.selectionStart=
editor.selectionEnd=
start+4;

editorInput();

}

}


/* ==========================================================
   STATUS
========================================================== */

function updateStatus(){

const ext=
currentFile.split(".").pop();

document.getElementById(
    "statusLeft"

/* ==========================================================
   FORMAT
========================================================== */

function formatHTML(){

if(
    project.protectedFiles
        .includes(currentFile)
){

    return;

}

let value=
project.files[currentFile] || "";

if(
    currentFile.endsWith(".html")
){

    value=
        value
        .replace(/>\s*</g,"><")
        .replace(/></g,">\n<");

}

project.files[currentFile]=value;

document.getElementById(
    "editor"
).value=value;

updateLineNumbers();

terminal(
    "Arquivo formatado: "+currentFile
);

}


/* ==========================================================
   SAVE
========================================================== */

function saveProject(){

if(
    !project.protectedFiles
        .includes(currentFile)
){

    project.files[currentFile]=
        document.getElementById(
            "editor"
        ).value;

}

updateProjectMetadata();

localStorage.setItem(
    "multiscript-v14",
    JSON.stringify(project)
);

terminal(
    "Projeto salvo no armazenamento local."
);

}


/* ==========================================================
   LOAD
========================================================== */

function loadProject(){

const saved=
localStorage.getItem(
    "multiscript-v14"
);

if(!saved){

    createInitialFiles();

    return;

}

try{

    project=
        JSON.parse(saved);

    if(!project.files)
        throw new Error();

    if(!project.plugins)
        project.plugins={};

    if(!project.pages)
        project.pages={};

    if(
        !project.protectedFiles
    ){

        project.protectedFiles=[
            "multiscript.json"
        ];

    }

    terminal(
        "Projeto restaurado."
    );

}catch(error){

    createInitialFiles();

}

}

renderExplorer();

openFile(filename);

closeModal();

terminal(

/* ==========================================================
   LOAD SVG
========================================================== */

function loadSVG(path){

const content=
project.files[path];

if(!content){

    imageNew();

    return;

}

const parser=
new DOMParser();

const parsed=
parser.parseFromString(
    content,
    "image/svg+xml"
);

const imported=
document.importNode(
    parsed.documentElement,
    true
);

const old=
document.getElementById(
    "svgCanvas"
);

old.replaceWith(imported);

imported.id="svgCanvas";

bindSVGCanvas();

imageCurrentFile=path;

document.getElementById(
    "imageFileStatus"
).textContent=
path;

imageHistory=[];

imageHistoryIndex=-1;

imageSaveHistory();

updateImageLayers();

updateImageProperties();

}


/* ==========================================================
   SVG EVENTS
========================================================== */

function bindSVGCanvas(){

const svg=
document.getElementById(
    "svgCanvas"
);

svg.addEventListener(
    "mousedown",
    imageMouseDown
);

svg.addEventListener(
    "mousemove",
    imageMouseMove
);

svg.addEventListener(
    "mouseup",
    imageMouseUp
);

svg.addEventListener(
    "mouseleave",
    imageMouseUp
);

}


/* ==========================================================
   SVG POINT
========================================================== */

function svgPoint(event){

const svg=
document.getElementById(
    "svgCanvas"
);

const rect=
svg.getBoundingClientRect();

return {
    x:(event.clientX-rect.left)/
        imageZoomLevel,

    y:(event.clientY-rect.top)/
        imageZoomLevel
};

}


/* ==========================================================
   TOOLS
========================================================== */

function setImageTool(tool){

imageTool=tool;

document
.querySelectorAll(".image-tool")
.forEach(
    button=>{
        button.classList.toggle(
            "active",
            button.dataset.itool===tool
        );
    }
);

}


function imageMouseDown(event){

const svg=
document.getElementById(
    "svgCanvas"
);

const point=
svgPoint(event);


if(imageTool==="select"){

    const target=
        event.target.closest(
            "[data-ms-layer]"
        );

    if(target){

        selectSVGElement(target);

    }else{

        selectedSVGElement=null;

        updateImageLayers();

    }

    return;

}


if(imageTool==="rect"){

    const rect=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "rect"
        );

    rect.setAttribute(
        "data-ms-layer",
        "true"
    );

    rect.setAttribute("x",point.x);

    rect.setAttribute("y",point.y);

    rect.setAttribute("width",180);

    rect.setAttribute("height",100);

    rect.setAttribute("fill","#2563eb");

    rect.setAttribute("stroke","#111827");

    rect.setAttribute("stroke-width","0");

    svg.appendChild(rect);

    selectSVGElement(rect);

    imageSaveHistory();

    return;

}


if(imageTool==="circle"){

    const circle=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle"
        );

    circle.setAttribute(
        "data-ms-layer",
        "true"
    );

    circle.setAttribute(
        "cx",
        point.x
    );

    circle.setAttribute(
        "cy",
        point.y
    );

    circle.setAttribute(
        "r",
        70
    );

    circle.setAttribute(
        "fill",
        "#ef4444"
    );

    svg.appendChild(circle);

    selectSVGElement(circle);

    imageSaveHistory();

    return;

}


if(imageTool==="line"){

    const line=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "line"
        );

    line.setAttribute(
        "data-ms-layer",
        "true"
    );

    line.setAttribute("x1",point.x);

    line.setAttribute("y1",point.y);

    line.setAttribute(
        "x2",
        point.x+200
    );

    line.setAttribute(
        "y2",
        point.y+100
    );

    line.setAttribute(
        "stroke",
        "#111827"
    );

    line.setAttribute(
        "stroke-width",
        "5"
    );

    svg.appendChild(line);

    selectSVGElement(line);

    imageSaveHistory();

    return;

}


if(imageTool==="text"){

    const text=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "text"
        );

    text.setAttribute(
        "data-ms-layer",
        "true"
    );

    text.setAttribute(
        "x",
        point.x
    );

    text.setAttribute(
        "y",
        point.y
    );

    text.setAttribute(
        "font-family",
        "Arial"
    );

    text.setAttribute(
        "font-size",
        "40"
    );

    text.setAttribute(
        "font-weight",
        "bold"
    );

    text.setAttribute(
        "fill",
        "#111827"
    );

    text.textContent="Novo Texto";

    svg.appendChild(text);

    selectSVGElement(text);

    imageSaveHistory();

    return;

}


if(imageTool==="free"){

    imageDrawing=true;

    imageDrawingPath=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    imageDrawingPath.setAttribute(
        "data-ms-layer",
        "true"
    );

    imageDrawingPath.setAttribute(
        "d",
        `M ${point.x} ${point.y}`
    );

    imageDrawingPath.setAttribute(
        "fill",
        "none"
    );

    imageDrawingPath.setAttribute(
        "stroke",
        "#111827"
    );

    imageDrawingPath.setAttribute(
        "stroke-width",
        "5"
    );

    imageDrawingPath.setAttribute(
        "stroke-linecap",
        "round"
    );

    svg.appendChild(
        imageDrawingPath
    );

    selectSVGElement(
        imageDrawingPath
    );

}

}


function imageMouseMove(event){

if(
    imageTool!=="free" ||
    !imageDrawing ||
    !imageDrawingPath
)return;

const point=
svgPoint(event);

imageDrawingPath.setAttribute(
    "d",
    imageDrawingPath.getAttribute("d")+
    ` L ${point.x} ${point.y}`
);

}


function imageMouseUp(){

if(
    imageTool==="free" &&
    imageDrawing
){

    imageDrawing=false;

    imageSaveHistory();

}

}


/* ==========================================================
   SELECT SVG
========================================================== */

function selectSVGElement(element){

selectedSVGElement=element;

updateImageProperties();

updateImageLayers();

}


function updateImageProperties(){

const el=
selectedSVGElement;

if(!el)return;

let x=0;
let y=0;
let w=0;
let h=0;

if(el.tagName==="rect"){

x=parseFloat(
    el.getAttribute("x")||0
);

y=parseFloat(
    el.getAttribute("y")||0
);

w=parseFloat(
    el.getAttribute("width")||0
);

h=parseFloat(
    el.getAttribute("height")||0
);

}

if(el.tagName==="circle"){

const r=
parseFloat(
    el.getAttribute("r")||0
);

x=
parseFloat(
    el.getAttribute("cx")||0
)-r;

y=
parseFloat(
    el.getAttribute("cy")||0
)-r;

w=r*2;

h=r*2;

}

if(el.tagName==="text"){

x=parseFloat(
    el.getAttribute("x")||0
);

y=parseFloat(
    el.getAttribute("y")||0
);

}

document.getElementById("objX").value=
Math.round(x);

document.getElementById("objY").value=
Math.round(y);

document.getElementById("objW").value=
Math.round(w);

document.getElementById("objH").value=
Math.round(h);

const fill=
el.getAttribute("fill");

if(fill && fill.startsWith("#"))
document.getElementById("objFill").value=
fill;

const stroke=
el.getAttribute("stroke");

if(stroke && stroke.startsWith("#"))
document.getElementById("objStroke").value=
stroke;

document.getElementById(
    "objStrokeWidth"
).value=
el.getAttribute("stroke-width")||0;

document.getElementById(
    "objOpacity"
).value=
el.getAttribute("opacity")||1;


const textPanel=
document.getElementById(
    "textProperties"
);

if(el.tagName==="text"){

textPanel.style.display="block";

document.getElementById(
    "objText"
).value=
el.textContent;

document.getElementById(
    "objTextSize"
).value=
el.getAttribute("font-size")||40;

document.getElementById(
    "objFont"
).value=
el.getAttribute("font-family")||"Arial";

}else{

textPanel.style.display="none";

}

}


/* ==========================================================
   OBJECT
========================================================== */

function changeObject(){

const el=
selectedSVGElement;

if(!el)return;

const x=
parseFloat(

)||0;

const y=
parseFloat(
    document.getElementById("objY").value
)||0;

const w=
parseFloat(
    document.getElementById("objW").value
)||0;

const h=
parseFloat(
    document.getElementById("objH").value
)||0;

if(el.tagName==="rect"){

el.setAttribute("x",x);
el.setAttribute("y",y);
el.setAttribute("width",w);
el.setAttribute("height",h);

}

if(el.tagName==="circle"){

const r=Math.min(w,h)/2;

el.setAttribute(
    "cx",
    x+r
);

el.setAttribute(
    "cy",
    y+r
);

el.setAttribute(
    "r",
    r
);

}

if(el.tagName==="text"){

el.setAttribute("x",x);
el.setAttribute("y",y);

}

imageSaveHistory();

}

/* ==========================================================
   LAYERS
========================================================== */

function updateImageLayers(){

const box=
document.getElementById(
    "imageLayers"
);

box.innerHTML="";

const svg=
document.getElementById(
    "svgCanvas"
);

const elements=
Array.from(
    svg.querySelectorAll(
        "[data-ms-layer]"
    )
).reverse();

elements.forEach(
    (el,index)=>{

        const row=
            document.createElement(
                "div"
            );

        row.className=
            "layer"+
            (
                el===selectedSVGElement
                    ?" active"
                    :""
            );

        const eye=
            document.createElement(
                "button"
            );

        eye.className=
            "layer-eye";

        eye.textContent=
            el.style.display==="none"
                ?"○"
                :"●";

        eye.onclick=
            event=>{

                event.stopPropagation();

                el.style.display=
                    el.style.display==="none"
                        ?""
                        :"none";

                updateImageLayers();

            };

        const name=
            document.createElement(
                "span"
            );

        name.textContent=
            imageLayerName(
                el,
                index
            );

        row.appendChild(eye);
        row.appendChild(name);

        row.onclick=
            ()=>{
                selectSVGElement(el);
            };

        box.appendChild(row);

    }
);

}


function imageLayerName(el,index){

if(el.tagName==="text")
return "🔤 "+(
    el.textContent||"Texto"
);

if(el.tagName==="rect")
return "▭ Retângulo "+(index+1);

if(el.tagName==="circle")
return "○ Círculo "+(index+1);

if(el.tagName==="line")
return "╱ Linha "+(index+1);

if(el.tagName==="path")
return "✎ Pincel "+(index+1);

if(el.tagName==="image")
return "🖼 Imagem "+(index+1);

return el.tagName;

}


/* ==========================================================
   IMAGE HISTORY
========================================================== */

function imageSaveHistory(){

const svg=
document.getElementById(
    "svgCanvas"
);

if(!svg)return;

imageHistory=
imageHistory.slice(
    0,
    imageHistoryIndex+1
);

imageHistory.push(
    svg.outerHTML
);

imageHistoryIndex=
imageHistory.length-1;

if(imageHistory.length>50){

imageHistory.shift();

imageHistoryIndex--;

}

updateImageLayers();

}


function imageRestoreHistory(code){

const parser=
new DOMParser();

const parsed=
parser.parseFromString(
    code,
    "image/svg+xml"
);

const newSVG=
document.importNode(
    parsed.documentElement,
    true
);

const old=
document.getElementById(
    "svgCanvas"
);

old.replaceWith(
    newSVG
);

newSVG.id="svgCanvas";

bindSVGCanvas();

selectedSVGElement=null;

updateImageLayers();

updateImageProperties();

}


function imageUndo(){

if(imageHistoryIndex<=0)return;

imageHistoryIndex--;

imageRestoreHistory(
    imageHistory[
        imageHistoryIndex
    ]
);

}


function imageRedo(){

if(
    imageHistoryIndex>=
    imageHistory.length-1
)return;

imageHistoryIndex++;

imageRestoreHistory(
    imageHistory[
        imageHistoryIndex
    ]
);

}

/* ==========================================================
   IMAGE ZOOM
========================================================== */

function imageZoom(value){

if(value===0){

imageZoomLevel=1;

}else{

imageZoomLevel=
Math.max(
    .2,
    Math.min(
        4,
        imageZoomLevel+value
    )
);

}

document.getElementById(
    "imageWorkspace"
).style.transform=
`translate(-50%,-50%) scale(${imageZoomLevel})`;

document.getElementById(
    "imageZoomStatus"
).textContent=
Math.round(
    imageZoomLevel*100
)+"%";

}


/* ==========================================================
   IMPORT IMAGE
========================================================== */

function importSVGImage(){

const input=
document.createElement("input");

input.type="file";

input.accept="image/*,.svg";

input.onchange=
function(){

const file=input.files[0];

if(!file)return;

const reader=
new FileReader();

reader.onload=
function(event){

const image=
document.createElementNS(
    "http://www.w3.org/2000/svg",
    "image"
);

image.setAttribute(
    "data-ms-layer",
    "true"
);

image.setAttribute(
    "x",
    100
);

image.setAttribute(
    "y",
    100
);

image.setAttribute(
    "width",
    300
);

image.setAttribute(
    "height",
    200
);

image.setAttribute(
    "preserveAspectRatio",
    "xMidYMid meet"
);

image.setAttribute(
    "href",
    event.target.result
);

document.getElementById(
    "svgCanvas"
).appendChild(image);

selectSVGElement(image);

imageSaveHistory();

};

reader.readAsDataURL(file);

};

input.click();

}

function saveImageSVG(){

document.getElementById(
    "svgCanvas"
);

clone
.querySelectorAll(

)

/* ==========================================================
   PNG
========================================================== */

function exportImagePNG(){

const svg=
document.getElementById(
    "svgCanvas"
);

const clone=
svg.cloneNode(true);

clone
.querySelectorAll(
    "[data-ms-layer]"
)
.forEach(
    el=>{
        el.removeAttribute(
            "data-ms-layer"
        );
    }
);

const source=
new XMLSerializer()
.serializeToString(
    clone
);

const blob=
new Blob(
    [source],
    {type:"image/svg+xml"}
);

const url=
URL.createObjectURL(blob);

const img=
new Image();

img.onload=
function(){

const canvas=
document.createElement("canvas");

canvas.width=
parseInt(
    svg.getAttribute("width")
);

canvas.height=
parseInt(
    svg.getAttribute("height")
);

const ctx=
canvas.getContext("2d");

ctx.drawImage(
    img,
    0,
    0
);

const link=
document.createElement("a");

link.href=
canvas.toDataURL(
    "image/png"
);

link.download=
imageCurrentFile
.split("/")
.pop()
.replace(
    ".svg",
    ".png"
);

link.click();

URL.revokeObjectURL(url);

};

img.src=url;

}

async function exportZipFinal(){

const credit=
document.getElementById(
    "creditSelect"
).value;

const zip=
new JSZip();

const folder=
zip.folder(
    project.name
);

const copy=
JSON.parse(
    JSON.stringify(
        project.files
    )
);


if(
    credit!=="Sem crédito"
){

for(const path of Object.keys(copy)){

if(
    path.endsWith(".html")
){

copy[path]=
copy[path].replace(
    "</body>",
    getCreditHTML(credit)+
    "</body>"
);

}

}

}


for(
    const [path,content]
    of Object.entries(copy)
){

folder.file(
    path,
    content
);

}

const blob=
await zip.generateAsync({
    type:"blob"
});

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=
project.name+".zip";

a.click();

URL.revokeObjectURL(url);

closeModal();

terminal(
    "ZIP exportado: "+project.name+".zip"
);

}
