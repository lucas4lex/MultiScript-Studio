<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>MultiScript Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    min-width:1100px;
    background:#101318;
    color:#e7ebf2;
    font-family:"Segoe UI",Arial,sans-serif;
}


/* ==================================================
   APLICATIVO
================================================== */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}


/* ==================================================
   BARRA DE TÍTULO
================================================== */

.titlebar{
    height:48px;

    background:#181b21;

    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;
}

.brand{
    display:flex;
    align-items:center;

    gap:10px;

    font-size:15px;
    font-weight:600;
}

.brand-icon{
    width:28px;
    height:28px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#2563eb;

    border-radius:6px;

    color:white;

    font-size:12px;
    font-weight:bold;
}

.brand span{
    color:#858e9e;
    font-weight:400;
}

.window-info{
    color:#747e8e;
    font-size:11px;
}


/* ==================================================
   TOOLBAR PRINCIPAL
================================================== */

.toolbar{
    height:52px;

    background:#20242b;

    border-bottom:1px solid #303640;

    display:flex;
    align-items:center;

    padding:0 12px;

    gap:5px;
}

.tool{
    height:32px;

    padding:0 11px;

    border:1px solid transparent;

    border-radius:5px;

    background:transparent;

    color:#cbd1db;

    font-family:inherit;

    font-size:13px;

    cursor:pointer;
}

.tool:hover{
    background:#2b3039;
    border-color:#3b424d;
}

.tool:active{
    background:#343b46;
}

.tool.primary{
    background:#2563eb;
    border-color:#3574ee;

    color:white;

    font-weight:600;
}

.tool.primary:hover{
    background:#1d4ed8;
}

.tool.danger:hover{
    color:#ff9a9a;
    background:#402228;
}

.separator{
    width:1px;
    height:26px;

    background:#363c47;

    margin:0 7px;
}


/* ==================================================
   ABA DO DOCUMENTO
================================================== */

.documentbar{
    height:42px;

    background:#171a20;

    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;
}

.document-tab{
    height:42px;

    padding:0 18px;

    display:flex;
    align-items:center;

    gap:9px;

    background:#101318;

    border-right:1px solid #292e37;

    color:#dce1e9;

    font-size:13px;
}

.document-tab::before{
    content:"";

    width:7px;
    height:7px;

    border-radius:50%;

    background:#60a5fa;
}


/* ==================================================
   ÁREA PRINCIPAL
================================================== */

.main{
    flex:1;

    display:flex;

    min-height:0;
}


/* ==================================================
   SIDEBAR
================================================== */

.sidebar{
    width:230px;

    flex-shrink:0;

    background:#171a20;

    border-right:1px solid #292e37;

    padding:14px;
}

.sidebar-title{
    color:#7f8999;

    font-size:11px;
    font-weight:bold;

    letter-spacing:.7px;

    text-transform:uppercase;

    margin-bottom:11px;
}

.info-box{
    background:#1d2128;

    border:1px solid #2d333d;

    border-radius:6px;

    padding:11px;

    margin-bottom:9px;
}

.info-label{
    color:#747e8e;

    font-size:10px;

    margin-bottom:4px;
}

.info-value{
    color:#dce1e9;

    font-size:13px;
}

.side-action{
    width:100%;

    padding:9px;

    border:0;

    border-radius:5px;

    background:transparent;

    color:#aeb6c4;

    text-align:left;

    font-family:inherit;

    font-size:13px;

    cursor:pointer;
}

.side-action:hover{
    background:#242932;
    color:#fff;
}


/* ==================================================
   WORKSPACE
================================================== */

.workspace{
    flex:1;

    min-width:0;

    display:flex;
    flex-direction:column;
}


/* ==================================================
   LOCALIZAR / SUBSTITUIR
================================================== */

.findbar{
    height:45px;

    background:#1b1f26;

    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;

    gap:7px;

    padding:0 10px;
}

.find-input,
.replace-input{
    height:29px;

    width:210px;

    background:#101318;

    border:1px solid #353b46;

    border-radius:4px;

    color:#e9edf4;

    padding:0 9px;

    outline:none;

    font-family:inherit;

    font-size:12px;
}

.find-input:focus,
.replace-input:focus{
    border-color:#4b82e8;
}

.find-btn{
    height:29px;

    background:#292e37;

    border:1px solid #3a414c;

    border-radius:4px;

    color:#cbd2de;

    padding:0 10px;

    cursor:pointer;

    font-size:12px;
}

.find-btn:hover{
    background:#343a45;
}


/* ==================================================
   BARRA DE FORMATAÇÃO
================================================== */

.formatbar{
    height:44px;

    background:#20242b;

    border-bottom:1px solid #303640;

    display:flex;
    align-items:center;

    gap:3px;

    padding:0 10px;
}

.format-button{
    min-width:34px;

    height:30px;

    padding:0 9px;

    border:1px solid transparent;

    border-radius:5px;

    background:transparent;

    color:#dce2eb;

    font-family:inherit;

    font-size:13px;

    cursor:pointer;
}

.format-button:hover{
    background:#2b3039;

    border-color:#3b424d;
}

.format-button.active{
    background:#344c70;

    border-color:#4c6d9c;

    color:white;
}

.format-separator{
    width:1px;
    height:24px;

    background:#363c47;

    margin:0 7px;
}


/* ==================================================
   EDITOR
================================================== */

.editor-area{
    flex:1;

    display:flex;

    min-height:0;

    background:#101318;

    overflow:hidden;
}

.line-numbers{
    width:55px;

    flex-shrink:0;

    padding-top:25px;

    background:#15181e;

    border-right:1px solid #282d36;

    color:#525b6a;

    text-align:right;

    padding-right:12px;

    font-family:Consolas,"Courier New",monospace;

    font-size:14px;

    line-height:1.7;

    user-select:none;

    overflow:hidden;
}


/*
    PÁGINA DE EDIÇÃO
*/

.document-editor{
    flex:1;

    overflow:auto;

    padding:35px 55px 100px 45px;

    background:#101318;

    color:#e7ebf2;

    font-family:"Segoe UI",Arial,sans-serif;

    font-size:15px;

    line-height:1.7;

    outline:none;

    white-space:normal;
}

.document-editor:focus{
    outline:none;
}

.document-editor:empty::before{
    content:"Comece a escrever...";

    color:#555e6d;

    pointer-events:none;
}

.document-editor p{
    margin:0 0 8px 0;
}

.document-editor h1{
    font-size:30px;
    margin:0 0 15px 0;
}

.document-editor h2{
    font-size:24px;
    margin:0 0 13px 0;
}

.document-editor h3{
    font-size:19px;
    margin:0 0 11px 0;
}

.document-editor ul,
.document-editor ol{
    padding-left:35px;

    margin-top:8px;
    margin-bottom:8px;
}

.document-editor li{
    margin-bottom:3px;
}


/* ==================================================
   STATUS BAR
================================================== */

.statusbar{
    height:28px;

    background:#2563eb;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 12px;

    font-size:11px;
}

.status-group{
    display:flex;
    align-items:center;

    gap:18px;
}


/* ==================================================
   MODAL
================================================== */

.modal-overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.68);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:100;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:520px;

    background:#1c2027;

    border:1px solid #383f4b;

    border-radius:8px;

    box-shadow:0 20px 60px rgba(0,0,0,.5);

    overflow:hidden;
}

.modal-header{
    padding:15px 18px;

    border-bottom:1px solid #303640;

    font-size:15px;

    font-weight:600;
}

.modal-content{
    padding:18px;
}

.modal-content label{
    display:block;

    margin-bottom:6px;

    color:#9da6b5;

    font-size:12px;
}

.modal-content input,
.modal-content select{
    width:100%;

    height:36px;

    margin-bottom:15px;

    background:#111419;

    border:1px solid #363d48;

    border-radius:5px;

    color:#fff;

    padding:0 10px;

    outline:none;

    font-family:inherit;
}

.modal-content input:focus,
.modal-content select:focus{
    border-color:#4b82e8;
}

.modal-footer{
    padding:12px 18px;

    border-top:1px solid #303640;

    display:flex;

    justify-content:flex-end;

    gap:7px;
}

.modal-btn{
    padding:8px 14px;

    border-radius:5px;

    border:1px solid #3a414d;

    background:#292e36;

    color:#dce1e8;

    cursor:pointer;
}

.modal-btn.primary{
    background:#2563eb;

    border-color:#3574ee;

    color:#fff;
}


/* ==================================================
   SCROLLBAR
================================================== */

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-track{
    background:#15181e;
}

::-webkit-scrollbar-thumb{
    background:#363c47;

    border-radius:5px;
}

::-webkit-scrollbar-thumb:hover{
    background:#464e5c;
}

</style>

</head>

<script>

/* ==================================================
   ELEMENTOS
================================================== */

const editor =
    document.getElementById("editor");

const lineNumbers =
    document.getElementById("lineNumbers");


/* ==================================================
   HISTÓRICO
================================================== */

let history = [""];

let historyIndex = 0;

let changingHistory = false;


function saveHistory(){

    if(changingHistory)
        return;


    const content =
        editor.innerHTML;


    if(
        history[historyIndex]
        !== content
    ){

        history =
            history.slice(
                0,
                historyIndex + 1
            );


        history.push(
            content
        );


        historyIndex++;

    }

}


/* ==================================================
   FORMATAÇÃO
================================================== */

function formatar(command){

    editor.focus();


    document.execCommand(
        command,
        false,
        null
    );


    saveHistory();

    updateStats();

}


/* ==================================================
   LISTA NUMERADA
================================================== */

function listaNumerada(){

    editor.focus();


    document.execCommand(
        "insertOrderedList",
        false,
        null
    );


    saveHistory();

    updateStats();

}


/* ==================================================
   LISTA COM MARCADORES
================================================== */

function listaMarcadores(){

    editor.focus();


    document.execCommand(
        "insertUnorderedList",
        false,
        null
    );


    saveHistory();

    updateStats();

}


/* ==================================================
   ORDENAR A-Z
================================================== */

function ordenarAZ(){

    const selection =
        window.getSelection();


    if(
        !selection.rangeCount
    ){

        alert(
            "Selecione as linhas que deseja ordenar."
        );

        return;

    }


    const range =
        selection.getRangeAt(0);


    const fragment =
        range.cloneContents();


    const elements =
        Array.from(
            fragment.children
        );


    if(elements.length < 2){

        /*
            Tenta ordenar parágrafos
            dentro da seleção.
        */

        const paragraphs =
            Array.from(
                editor.querySelectorAll(
                    "p"
                )
            );


        if(paragraphs.length < 2){

            alert(
                "É necessário ter pelo menos duas linhas."
            );

            return;

        }


        paragraphs.sort(
            function(a,b){

                return a.innerText
                    .trim()
                    .localeCompare(
                        b.innerText.trim(),
                        "pt-BR",
                        {
                            sensitivity:"base"
                        }
                    );

            }
        );


        paragraphs.forEach(
            function(paragraph){

                editor.appendChild(
                    paragraph
                );

            }
        );

    }else{

        elements.sort(
            function(a,b){

                return a.innerText
                    .trim()
                    .localeCompare(
                        b.innerText.trim(),
                        "pt-BR",
                        {
                            sensitivity:"base"
                        }
                    );

            }
        );


        elements.forEach(
            function(element){

                fragment.appendChild(
                    element
                );

            }
        );


        range.deleteContents();

        range.insertNode(
            fragment
        );

    }


    saveHistory();

    updateStats();

}


/* ==================================================
   ESTATÍSTICAS
================================================== */

function updateStats(){

    const text =
        editor.innerText;


    document.getElementById(
        "characters"
    ).textContent =
        text.length.toLocaleString(
            "pt-BR"
        );


    const words =
        text.trim()
        ? text.trim().split(/\s+/).length
        : 0;


    document.getElementById(
        "words"
    ).textContent =
        words.toLocaleString(
            "pt-BR"
        );


    const lines =
        text
        ? text.split("\n").length
        : 1;


    document.getElementById(
        "lines"
    ).textContent =
        lines;


    updateLineNumbers();

    updateCursor();

}


/* ==================================================
   NÚMEROS DAS LINHAS
================================================== */

function updateLineNumbers(){

    const text =
        editor.innerText;


    const count =
        text
        ? text.split("\n").length
        : 1;


    let html = "";


    for(
        let i = 1;
        i <= count;
        i++
    ){

        html +=
            i + "<br>";

    }


    lineNumbers.innerHTML =
        html;

}


/* ==================================================
   SCROLL
================================================== */

editor.addEventListener(
    "scroll",
    function(){

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);


/* ==================================================
   INPUT
================================================== */

editor.addEventListener(
    "input",
    function(){

        saveHistory();

        updateStats();

    }
);


/* ==================================================
   CURSOR
================================================== */

function updateCursor(){

    const selection =
        window.getSelection();


    if(
        !selection.rangeCount
    )
        return;


    const range =
        selection.getRangeAt(0);


    if(
        !editor.contains(
            range.startContainer
        )
    )
        return;


    let node =
        range.startContainer;


    let offset =
        range.startOffset;


    while(
        node &&
        node !== editor
    ){

        if(
            node.previousSibling
        ){

            let sibling =
                node.previousSibling;


            while(
                sibling.lastChild
            ){

                sibling =
                    sibling.lastChild;

            }


            offset +=
                sibling.textContent
                .length;

        }


        node =
            node.parentNode;

    }


    const before =
        editor.innerText
        .substring(
            0,
            offset
        );


    const rows =
        before.split("\n");


    const line =
        rows.length;


    const column =
        rows[rows.length - 1].length + 1;


    document.getElementById(
        "cursorPosition"
    ).textContent =
        `Ln ${line}, Col ${column}`;

}


editor.addEventListener(
    "keyup",
    updateCursor
);

editor.addEventListener(
    "click",
    updateCursor
);

editor.addEventListener(
    "mouseup",
    updateCursor
);


/* ==================================================
   UNDO
================================================== */

function undo(){

    if(historyIndex <= 0)
        return;


    historyIndex--;


    changingHistory = true;


    editor.innerHTML =
        history[historyIndex];


    changingHistory = false;


    updateStats();

}


/* ==================================================
   REDO
================================================== */

function redo(){

    if(
        historyIndex >=
        history.length - 1
    )
        return;


    historyIndex++;


    changingHistory = true;


    editor.innerHTML =
        history[historyIndex];


    changingHistory = false;


    updateStats();

}


/* ==================================================
   SELECIONAR
================================================== */

function selectAll(){

    editor.focus();


    const range =
        document.createRange();


    range.selectNodeContents(
        editor
    );


    const selection =
        window.getSelection();


    selection.removeAllRanges();

    selection.addRange(
        range
    );

}


/* ==================================================
   COPIAR
================================================== */

function copyText(){

    const selection =
        window.getSelection();


    if(
        selection.toString()
    ){

        navigator.clipboard.writeText(
            selection.toString()
        );

    }else{

        navigator.clipboard.writeText(
            editor.innerText
        );

    }

}


/* ==================================================
   DATA
================================================== */

function insertDate(){

    insertText(
        new Date()
        .toLocaleDateString(
            "pt-BR"
        )
    );

}


/* ==================================================
   HORA
================================================== */

function insertTime(){

    insertText(
        new Date()
        .toLocaleTimeString(

            {
                hour:"2-digit",

            }
        )

/* ==================================================
   INSERIR TEXTO
================================================== */

function insertText(text){

    editor.focus();


    document.execCommand(
        "insertText",
        false,
        text
    );


    saveHistory();

    updateStats();

}


/* ==================================================
   QUEBRA DE PÁGINA
================================================== */

function insertPageBreak(){

    editor.focus();


    const pageBreak =
        document.createElement(
            "div"
        );


    pageBreak.style.cssText = `
        border-top:2px dashed #596273;
        margin:25px 0;
        height:1px;
    `;


    pageBreak.innerHTML =
        "<br>";


    const selection =
        window.getSelection();


    if(
        selection.rangeCount
    ){

        const range =
            selection.getRangeAt(0);

        range.deleteContents();

        range.insertNode(
            pageBreak
        );

        range.setStartAfter(
            pageBreak
        );

        range.collapse(true);

        selection.removeAllRanges();

        selection.addRange(
            range
        );

    }


    saveHistory();

}


/* ==================================================
   FIND
================================================== */

function findText(){

    const search =
        document.getElementById(
            "find"
        ).value;


    if(!search)
        return;


    const found =
        window.find(
            search
        );


    if(!found){

        alert(
            "Texto não encontrado."
        );

    }

}


/* ==================================================
   REPLACE
================================================== */

function replaceText(){

    const search =
        document.getElementById(
            "find"
        ).value;

    const replacement =
        document.getElementById(
            "replace"
        ).value;


    if(!search)
        return;


    const selection =
        window.getSelection();


    if(
        selection.toString() === search
    ){

        document.execCommand(
            "insertText",
            false,
            replacement
        );

    }else{

        const found =
            window.find(
                search
            );


        if(!found){

            alert(
                "Texto não encontrado."
            );

            return;

        }


        document.execCommand(
            "insertText",
            false,
            replacement
        );

    }


    saveHistory();

    updateStats();

}


/* ==================================================
   REPLACE ALL
================================================== */

function replaceAllText(){

    const search =
        document.getElementById(
            "find"
        ).value;

    const replacement =
        document.getElementById(
            "replace"
        ).value;


    if(!search)
        return;


    const walker =
        document.createTreeWalker(
            editor,
            NodeFilter.SHOW_TEXT
        );


    const nodes = [];


    while(
        walker.nextNode()
    ){

        nodes.push(
            walker.currentNode
        );

    }


    nodes.forEach(
        function(node){

            node.nodeValue =
                node.nodeValue.split(
                    search
                ).join(
                    replacement
                );

        }
    );


    saveHistory();

    updateStats();

}


/* ==================================================
   SALVAR
================================================== */

function saveText(){

    localStorage.setItem(
        "multiscript_html",
        editor.innerHTML
    );


    document.getElementById(
        "documentName"
    ).textContent =
        "Documento salvo";


    setTimeout(
        function(){

            document.getElementById(
                "documentName"
            ).textContent =
                "Documento sem título";

        },
        2000
    );

}


/* ==================================================
   ABRIR
================================================== */

function loadText(){

    const saved =
        localStorage.getItem(
            "multiscript_html"
        );


    if(saved === null){

        alert(
            "Nenhum documento salvo."
        );

        return;

    }


    editor.innerHTML =
        saved;


    saveHistory();

    updateStats();

}


/* ==================================================
   LIMPAR
================================================== */

function clearDocument(){

    if(
        !editor.innerText.trim()
    )
        return;


    if(
        confirm(
            "Deseja realmente limpar o documento?"
        )
    ){

        editor.innerHTML = "";

        saveHistory();

        updateStats();

    }

}


/* ==================================================
   MODAL PDF
================================================== */

function openPDFModal(){

    if(
        !editor.innerText.trim()
    ){

        alert(
            "O documento está vazio."
        );

        return;

    }


    document
        .getElementById(
            "pdfModal"
        )
        .classList.add(
            "active"
        );

}


function closePDFModal(){

    document
        .getElementById(
            "pdfModal"
        )
        .classList.remove(
            "active"
        );

}


/* ==================================================
   PDF
================================================== */

function generatePDF(){

    const {
        jsPDF
    } = window.jspdf;


    const title =
        document.getElementById(
            "pdfTitle"
        ).value ||
        "Documento";


    let filename =
        document.getElementById(
            "pdfFilename"
        ).value ||
        "documento";


    filename =
        filename.replace(
            /\.pdf$/i,
            ""
        );


    const fontSize =
        Number(
            document.getElementById(
                "pdfFontSize"
            ).value
        );


    const pdf =
        new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });


    const pageWidth =
        pdf.internal.pageSize.getWidth();


    const pageHeight =
        pdf.internal.pageSize.getHeight();


    const margin = 20;


    const usableWidth =
        pageWidth -
        margin * 2;


    /* TÍTULO */

    pdf.setFont(
        "helvetica",
        "bold"
    );


    pdf.setFontSize(18);


    pdf.setTextColor(
        30,
        30,
        30
    );


    pdf.text(
        title,
        margin,
        margin
    );


    pdf.setDrawColor(
        190,
        190,
        190
    );


    pdf.line(
        margin,
        margin + 5,
        pageWidth - margin,
        margin + 5
    );


    /*
        Percorre os elementos HTML
    */

    let y =
        margin + 15;


    function ensureSpace(height){

        if(
            y + height >
            pageHeight - margin
        ){

            pdf.addPage();

            y = margin;

        }

    }


    function writeText(
        text,
        style
    ){

        if(!text)
            return;


        let fontStyle =
            "normal";


        if(
            style.bold &&
            style.italic
        ){

            fontStyle =
                "bolditalic";

        }else if(
            style.bold
        ){

            fontStyle =
                "bold";

        }else if(
            style.italic
        ){

            fontStyle =
                "italic";

        }


        pdf.setFont(
            "helvetica",
            fontStyle
        );


        pdf.setFontSize(
            fontSize
        );


        pdf.setTextColor(
            30,
            30,
            30
        );


        const lines =
            pdf.splitTextToSize(
                text,
                usableWidth
            );


        const lineHeight =
            fontSize * 0.45;


        lines.forEach(
            function(line){

                ensureSpace(
                    lineHeight
                );


                pdf.text(
                    line,
                    margin,
                    y
                );


                y +=
                    lineHeight;

            }
        );

    }


    function processNode(
        node,
        style = {
            bold:false,
            italic:false,
            underline:false
        }
    ){

        if(
            node.nodeType ===
            Node.TEXT_NODE
        ){

            writeText(
                node.nodeValue,
                style
            );

            return;

        }


        if(
            node.nodeType !==
            Node.ELEMENT_NODE
        )
            return;


        const tag =
            node.tagName.toLowerCase();


        const newStyle = {
            bold:
                style.bold ||
                tag === "b" ||
                tag === "strong",

            italic:
                style.italic ||
                tag === "i" ||
                tag === "em",

            underline:
                style.underline ||
                tag === "u"
        };


        if(
            tag === "br"
        ){

            y += fontSize * 0.45;

            return;

        }


        if(
            tag === "p" ||
            tag === "div" ||
            /^h[1-6]$/.test(tag)
        ){

            if(
                /^h[1-6]$/.test(tag)
            ){

                pdf.setFont(
                    "helvetica",
                    "bold"
                );

                pdf.setFontSize(
                    tag === "h1"
                    ? 18
                    : tag === "h2"
                    ? 16
                    : 14
                );

            }


            Array.from(
                node.childNodes
            ).forEach(
                function(child){

                    processNode(
                        child,
                        newStyle
                    );

                }
            );


            y +=
                fontSize * 0.35;


            return;

        }


        if(
            tag === "ul" ||
            tag === "ol"
        ){

            const items =
                Array.from(
                    node.children
                );


            items.forEach(
                function(item,index){

                    const prefix =
                        tag === "ol"
                        ? `${index + 1}. `
                        : "• ";


                    pdf.setFont(
                        "helvetica",
                        newStyle.bold
                        ? "bold"
                        : "normal"
                    );


                    pdf.setFontSize(
                        fontSize
                    );


                    const text =
                        item.innerText
                        .trim();


                    const lines =
                        pdf.splitTextToSize(
                            prefix + text,
                            usableWidth - 8
                        );


                    lines.forEach(
                        function(line){

                            ensureSpace(
                                fontSize * .45
                            );


                            pdf.text(
                                line,
                                margin + 5,
                                y
                            );


                            y +=
                                fontSize * .45;

                        }
                    );

                }
            );


            y +=
                fontSize * .3;


            return;

        }


        Array.from(
            node.childNodes
        ).forEach(
            function(child){

                processNode(
                    child,
                    newStyle
                );

            }
        );

    }


    Array.from(
        editor.childNodes
    ).forEach(
        function(node){

            processNode(node);

        }
    );


    /* RODAPÉ */

    const pages =
        pdf.internal.getNumberOfPages();


    for(
        let i = 1;
        i <= pages;
        i++
    ){

        pdf.setPage(i);


        pdf.setFont(
            "helvetica",
            "normal"
        );


        pdf.setFontSize(8);


        pdf.setTextColor(
            120,
            120,
            120
        );


        pdf.text(
            `${title} · Página ${i} de ${pages}`,
            pageWidth / 2,
            pageHeight - 10,
            {
                align:"center"
            }
        );

    }


    pdf.save(
        filename + ".pdf"
    );


    closePDFModal();

}


/* ==================================================
   IMPRESSÃO
================================================== */

function printDocument(){

    if(
        !editor.innerText.trim()
    )
        return;


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    printWindow.document.write(`

<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>MultiScript</title>

<style>

@page{
    size:A4;
    margin:20mm;
}

body{
    font-family:Arial,sans-serif;
    font-size:12pt;
    line-height:1.6;
}

p{
    margin:0 0 8px 0;
}

</style>

</head>

<body>

${editor.innerHTML}

</body>

</html>

`);


    printWindow.document.close();

    printWindow.focus();

    printWindow.print();

}


/* ==================================================
   TECLA TAB
================================================== */

editor.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Tab"
        ){

            event.preventDefault();

            document.execCommand(
                "insertText",
                false,
                "    "
            );

        }

    }
);


/* ==================================================
   ATALHOS
================================================== */

document.addEventListener(
    "keydown",
    function(event){


        /* CTRL + S */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ){

            event.preventDefault();

            saveText();

        }


        /* CTRL + P */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "p"
        ){

            event.preventDefault();

            printDocument();

        }


        /* CTRL + F */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ){

            event.preventDefault();

            document
                .getElementById(
                    "find"
                )
                .focus();

        }


        /* CTRL + B */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "b"
        ){

            event.preventDefault();

            formatar("bold");

        }


        /* CTRL + I */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "i"
        ){

            event.preventDefault();

            formatar("italic");

        }


        /* CTRL + U */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "u"
        ){

            event.preventDefault();

            formatar("underline");

        }


        /* CTRL + Z */

        if(
            event.ctrlKey &&
            !event.shiftKey &&
            event.key.toLowerCase() === "z"
        ){

            event.preventDefault();

            undo();

        }


        /* CTRL + SHIFT + Z */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "z"
        ){

            event.preventDefault();

            redo();

        }

    }
);


/* ==================================================
   INICIALIZAÇÃO
================================================== */

updateStats();

updateCursor();

</script>
