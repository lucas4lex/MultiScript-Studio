<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>MultiScript Studio</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
}

body{
    min-width:1100px;
    background:#101318;
    color:#e6e9ef;
    font-family:"Segoe UI",Arial,sans-serif;
}


/* ==============================
   APP
============================== */

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
}


/* ==============================
   TITLEBAR
============================== */

.titlebar{
    height:48px;
    background:#181b21;
    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 16px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:15px;
    font-weight:600;
}

.brand-icon{
    width:27px;
    height:27px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:6px;

    background:#2563eb;

    font-size:14px;
}

.brand span{
    color:#8b95a7;
    font-weight:400;
}

.window-controls{
    display:flex;
    align-items:center;
    gap:8px;

    color:#7d8797;
    font-size:12px;
}


/* ==============================
   TOOLBAR
============================== */

.toolbar{
    height:52px;

    background:#20242b;

    border-bottom:1px solid #303640;

    display:flex;
    align-items:center;

    padding:0 12px;

    gap:5px;
}

.tool-group{
    display:flex;
    align-items:center;
    gap:4px;
}

.separator{
    width:1px;
    height:26px;
    background:#363c47;
    margin:0 8px;
}

.tool{
    height:32px;

    padding:0 11px;

    border:1px solid transparent;
    border-radius:5px;

    background:transparent;

    color:#cbd1db;

    font-size:13px;

    cursor:pointer;
}

.tool:hover{
    background:#2b3039;
    border-color:#3b424d;
}

.tool.primary{
    background:#2563eb;
    border-color:#3574ee;

    color:white;

    font-weight:600;
}

.tool.primary:hover{
    background:#1d4ed8;
}

.tool.danger:hover{
    background:#422127;
    color:#ff9b9b;
}


/* ==============================
   DOCUMENT BAR
============================== */

.documentbar{
    height:42px;

    background:#171a20;

    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;

    padding:0 14px;
}

.document-tab{
    height:42px;

    padding:0 18px;

    display:flex;
    align-items:center;

    gap:8px;

    background:#101318;

    border-right:1px solid #292e37;

    color:#dce1e9;

    font-size:13px;
}

.document-tab::before{
    content:"";
    width:7px;
    height:7px;

    border-radius:50%;

    background:#60a5fa;
}


/* ==============================
   MAIN
============================== */

.main{
    flex:1;

    display:flex;

    min-height:0;
}


/* ==============================
   SIDEBAR
============================== */

.sidebar{
    width:230px;

    background:#171a20;

    border-right:1px solid #292e37;

    padding:14px;

    flex-shrink:0;
}

.sidebar-title{
    color:#7f8999;

    font-size:11px;
    font-weight:700;

    text-transform:uppercase;

    letter-spacing:.7px;

    margin-bottom:12px;
}

.info-box{
    border:1px solid #2d333d;

    background:#1d2128;

    border-radius:6px;

    padding:12px;

    margin-bottom:10px;
}

.info-label{
    color:#747e8e;

    font-size:11px;

    margin-bottom:5px;
}

.info-value{
    color:#dce1e9;

    font-size:13px;
}

.side-action{
    width:100%;

    border:0;

    background:transparent;

    color:#aeb6c4;

    text-align:left;

    padding:9px;

    border-radius:5px;

    cursor:pointer;

    font-size:13px;
}

.side-action:hover{
    background:#242932;
    color:#fff;
}


/* ==============================
   WORKSPACE
============================== */

.workspace{
    flex:1;

    min-width:0;

    display:flex;
    flex-direction:column;
}


/* ==============================
   FIND BAR
============================== */

.findbar{
    height:45px;

    background:#1b1f26;

    border-bottom:1px solid #292e37;

    display:flex;
    align-items:center;

    gap:7px;

    padding:0 10px;
}

.find-input{
    width:210px;
}

.replace-input{
    width:210px;
}

.find-input,
.replace-input{
    height:29px;

    background:#101318;

    border:1px solid #353b46;

    border-radius:4px;

    color:#e9edf4;

    padding:0 9px;

    outline:none;

    font-family:inherit;
}

.find-input:focus,
.replace-input:focus{
    border-color:#4b82e8;
}

.find-btn{
    height:29px;

    background:#292e37;

    border:1px solid #3a414c;

    border-radius:4px;

    color:#cbd2de;

    padding:0 10px;

    cursor:pointer;

    font-size:12px;
}

.find-btn:hover{
    background:#343a45;
}


/* ==============================
   EDITOR
============================== */

.editor{
    flex:1;

    display:flex;

    min-height:0;

    background:#101318;
}

.line-numbers{
    width:55px;

    padding-top:20px;

    background:#15181e;

    border-right:1px solid #282d36;

    color:#525b6a;

    text-align:right;

    padding-right:12px;

    font-family:Consolas,"Courier New",monospace;

    font-size:14px;

    line-height:1.65;

    user-select:none;

    overflow:hidden;
}

textarea{
    flex:1;

    width:100%;
    height:100%;

    resize:none;

    border:0;
    outline:0;

    padding:20px;

    background:#101318;

    color:#e7ebf2;

    font-family:Consolas,"Courier New",monospace;

    font-size:15px;

    line-height:1.65;

    tab-size:4;

    white-space:pre;

    overflow:auto;
}

textarea::selection{
    background:#264f78;
}


/* ==============================
   STATUS BAR
============================== */

.statusbar{
    height:28px;

    background:#2563eb;

    color:white;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 12px;

    font-size:11px;
}

.status-left,
.status-right{
    display:flex;
    align-items:center;
    gap:18px;
}


/* ==============================
   MODAL
============================== */

.modal-overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.68);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:100;
}

.modal-overlay.active{
    display:flex;
}

.modal{
    width:520px;

    background:#1c2027;

    border:1px solid #383f4b;

    border-radius:8px;

    box-shadow:0 20px 60px rgba(0,0,0,.5);

    overflow:hidden;
}

.modal-header{
    padding:15px 18px;

    border-bottom:1px solid #303640;

    font-size:15px;

    font-weight:600;
}

.modal-content{
    padding:18px;
}

.modal-content label{
    display:block;

    margin-bottom:6px;

    color:#9da6b5;

    font-size:12px;
}

.modal-content input{
    width:100%;

    height:36px;

    margin-bottom:15px;

    background:#111419;

    border:1px solid #363d48;

    border-radius:5px;

    color:#fff;

    padding:0 10px;

    outline:none;
}

.modal-content input:focus{
    border-color:#4b82e8;
}

.modal-footer{
    padding:12px 18px;

    border-top:1px solid #303640;

    display:flex;

    justify-content:flex-end;

    gap:7px;
}

.modal-btn{
    padding:8px 14px;

    border-radius:5px;

    border:1px solid #3a414d;

    background:#292e36;

    color:#dce1e8;

    cursor:pointer;
}

.modal-btn.primary{
    background:#2563eb;

    border-color:#3574ee;

    color:#fff;
}


/* ==============================
   SCROLLBAR
============================== */

::-webkit-scrollbar{
    width:10px;
    height:10px;
}

::-webkit-scrollbar-track{
    background:#15181e;
}

::-webkit-scrollbar-thumb{
    background:#363c47;
    border-radius:5px;
}

::-webkit-scrollbar-thumb:hover{
    background:#464e5c;
}

</style>
</head>


<body>

<div class="app">


<!-- =================================
     TITLEBAR
================================= -->

<div class="titlebar">

    <div class="brand">

        <div class="brand-icon">
            MS
        </div>

        MultiScript
        <span>Studio</span>

    </div>

    <div class="window-controls">

        DOCUMENTO DE TEXTO

    </div>

</div>


<!-- =================================
     TOOLBAR
================================= -->

<div class="toolbar">

    <div class="tool-group">

        <button class="tool" onclick="undo()">
            ↶ Desfazer
        </button>

        <button class="tool" onclick="redo()">
            ↷ Refazer
        </button>

    </div>


    <div class="separator"></div>


    <div class="tool-group">

        <button class="tool" onclick="copyText()">
            Copiar
        </button>

        <button class="tool" onclick="selectAll()">
            Selecionar
        </button>

    </div>


    <div class="separator"></div>


    <div class="tool-group">

        <button class="tool" onclick="saveText()">
            💾 Salvar
        </button>

        <button class="tool" onclick="loadText()">
            Abrir
        </button>

    </div>


    <div class="separator"></div>


    <div class="tool-group">

        <button class="tool" onclick="printDocument()">
            🖨 Imprimir
        </button>

        <button
            class="tool primary"
            onclick="openPDFModal()"
        >
            📄 Gerar PDF
        </button>

    </div>


    <div style="flex:1"></div>


    <button
        class="tool danger"
        onclick="clearDocument()"
    >
        Limpar
    </button>

</div>


<!-- =================================
     DOCUMENT BAR
================================= -->

<div class="documentbar">

    <div class="document-tab">

        <span id="documentName">
            Documento sem título
        </span>

    </div>

</div>


<!-- =================================
     MAIN
================================= -->

<div class="main">


<!-- =================================
     SIDEBAR
================================= -->

<aside class="sidebar">

    <div class="sidebar-title">
        Documento
    </div>


    <div class="info-box">

        <div class="info-label">
            CARACTERES
        </div>

        <div
            class="info-value"
            id="characters"
        >
            0
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            PALAVRAS
        </div>

        <div
            class="info-value"
            id="words"
        >
            0
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            LINHAS
        </div>

        <div
            class="info-value"
            id="lines"
        >
            1
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            FORMATO
        </div>

        <div class="info-value">
            A4 · PDF
        </div>

    </div>


    <div class="sidebar-title" style="margin-top:25px">
        Inserir
    </div>


    <button
        class="side-action"
        onclick="insertDate()"
    >
        📅 Data atual
    </button>


    <button
        class="side-action"
        onclick="insertTime()"
    >
        🕐 Hora atual
    </button>


    <button
        class="side-action"
        onclick="insertPageBreak()"
    >
        ─ Quebra de página
    </button>

</aside>


<!-- =================================
     WORKSPACE
================================= -->

<section class="workspace">


<!-- FIND -->

<div class="findbar">

    <input
        class="find-input"
        id="find"
        placeholder="Localizar..."
    >

    <input
        class="replace-input"
        id="replace"
        placeholder="Substituir por..."
    >

    <button
        class="find-btn"
        onclick="findText()"
    >
        Localizar
    </button>

    <button
        class="find-btn"
        onclick="replaceText()"
    >
        Substituir
    </button>

    <button
        class="find-btn"
        onclick="replaceAllText()"
    >
        Substituir tudo
    </button>

</div>


<!-- EDITOR -->

<div class="editor">

    <div
        class="line-numbers"
        id="lineNumbers"
    >
        1
    </div>

    <textarea
        id="editor"
        spellcheck="false"
        placeholder="Comece a escrever..."
    ></textarea>

</div>


</section>

</div>


<!-- =================================
     STATUS BAR
================================= -->

<div class="statusbar">

    <div class="status-left">

        <span>
            MultiScript Studio
        </span>

        <span>
            UTF-8
        </span>

        <span>
            A4
        </span>

    </div>


    <div class="status-right">

        <span id="cursorPosition">
            Ln 1, Col 1
        </span>

        <span>
            Português (Brasil)
        </span>

    </div>

</div>


</div>


<!-- =================================
     PDF MODAL
================================= -->

<div
    class="modal-overlay"
    id="pdfModal"
>

<div class="modal">

    <div class="modal-header">

        Gerar documento PDF

    </div>


    <div class="modal-content">

        <label>
            Título do documento
        </label>

        <input
            type="text"
            id="pdfTitle"
            value="Documento"
        >


        <label>
            Nome do arquivo
        </label>

        <input
            type="text"
            id="pdfFilename"
            value="documento"
        >

    </div>


    <div class="modal-footer">

        <button
            class="modal-btn"
            onclick="closePDFModal()"
        >
            Cancelar
        </button>

        <button
            class="modal-btn primary"
            onclick="generatePDF()"
        >
            Gerar PDF
        </button>

    </div>

</div>

</div>


<script>

/* =================================
   ELEMENTOS
================================= */

const editor =
    document.getElementById("editor");

const lineNumbers =
    document.getElementById("lineNumbers");


/* =================================
   HISTÓRICO
================================= */

let history = [""];
let historyIndex = 0;

let changingHistory = false;


function saveHistory(){

    if(changingHistory)
        return;

    if(
        history[historyIndex]
        !== editor.value
    ){

        history =
            history.slice(
                0,
                historyIndex + 1
            );

        history.push(
            editor.value
        );

        historyIndex++;

    }

}


/* =================================
   ESTATÍSTICAS
================================= */

function updateStats(){

    const text =
        editor.value;

    document.getElementById(
        "characters"
    ).textContent =
        text.length.toLocaleString("pt-BR");


    const words =
        text.trim()
        ? text.trim().split(/\s+/).length
        : 0;

    document.getElementById(
        "words"
    ).textContent =
        words.toLocaleString("pt-BR");


    const lineCount =
        text
        ? text.split("\n").length
        : 1;

    document.getElementById(
        "lines"
    ).textContent =
        lineCount;


    updateLineNumbers();

}


/* =================================
   LINHAS
================================= */

function updateLineNumbers(){

    const count =
        editor.value
        ? editor.value.split("\n").length
        : 1;

    let html = "";

    for(let i=1;i<=count;i++){

        html += i + "<br>";

    }

    lineNumbers.innerHTML =
        html;

}


/* =================================
   SINCRONIZAR SCROLL
================================= */

editor.addEventListener(
    "scroll",
    function(){

        lineNumbers.scrollTop =
            editor.scrollTop;

    }
);


/* =================================
   CURSOR
================================= */

function updateCursor(){

    const position =
        editor.selectionStart;

    const before =
        editor.value.substring(
            0,
            position
        );

    const rows =
        before.split("\n");

    const line =
        rows.length;

    const column =
        rows[rows.length - 1].length + 1;


    document.getElementById(
        "cursorPosition"
    ).textContent =
        `Ln ${line}, Col ${column}`;

}


editor.addEventListener(
    "keyup",
    updateCursor
);

editor.addEventListener(
    "click",
    updateCursor
);


/* =================================
   INPUT
================================= */

editor.addEventListener(
    "input",
    function(){

        saveHistory();

        updateStats();

        updateCursor();

    }
);


/* =================================
   UNDO
================================= */

function undo(){

    if(historyIndex <= 0)
        return;

    historyIndex--;

    changingHistory = true;

    editor.value =
        history[historyIndex];

    changingHistory = false;

    updateStats();
    updateCursor();

}


/* =================================
   REDO
================================= */

function redo(){

    if(
        historyIndex >=
        history.length - 1
    )
        return;

    historyIndex++;

    changingHistory = true;

    editor.value =
        history[historyIndex];

    changingHistory = false;

    updateStats();
    updateCursor();

}


/* =================================
   SELECIONAR
================================= */

function selectAll(){

    editor.focus();

    editor.select();

}


/* =================================
   COPIAR
================================= */

function copyText(){

    navigator.clipboard.writeText(
        editor.value
    );

}


/* =================================
   DATA
================================= */

function insertDate(){

    insertText(
        new Date()
        .toLocaleDateString("pt-BR")
    );

}


/* =================================
   HORA
================================= */

function insertTime(){

    insertText(
        new Date()
        .toLocaleTimeString(
            "pt-BR",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        )
    );

}


/* =================================
   INSERIR TEXTO
================================= */

function insertText(text){

    const start =
        editor.selectionStart;

    const end =
        editor.selectionEnd;


    editor.setRangeText(
        text,
        start,
        end,
        "end"
    );

    saveHistory();

    updateStats();

    updateCursor();

    editor.focus();

}


/* =================================
   QUEBRA DE PÁGINA
================================= */

function insertPageBreak(){

    insertText(
        "\n\n──────────── QUEBRA DE PÁGINA ────────────\n\n"
    );

}


/* =================================
   FIND
================================= */

function findText(){

    const search =
        document.getElementById(
            "find"
        ).value;

    if(!search)
        return;


    const start =
        editor.selectionEnd;


    let position =
        editor.value.indexOf(
            search,
            start
        );


    if(position === -1){

        position =
            editor.value.indexOf(
                search
            );

    }


    if(position === -1){

        alert(
            "Texto não encontrado."
        );

        return;

    }


    editor.focus();

    editor.setSelectionRange(
        position,
        position + search.length
    );

    updateCursor();

}


/* =================================
   REPLACE
================================= */

function replaceText(){

    const search =
        document.getElementById(
            "find"
        ).value;

    const replacement =
        document.getElementById(
            "replace"
        ).value;


    if(!search)
        return;


    const selected =
        editor.value.substring(
            editor.selectionStart,
            editor.selectionEnd
        );


    if(selected === search){

        editor.setRangeText(
            replacement,
            editor.selectionStart,
            editor.selectionEnd,
            "end"
        );

    }else{

        const position =
            editor.value.indexOf(
                search
            );

        if(position === -1){

            alert(
                "Texto não encontrado."
            );

            return;

        }

        editor.setRangeText(
            replacement,
            position,
            position + search.length,
            "end"
        );

    }


    saveHistory();

    updateStats();

    updateCursor();

}


/* =================================
   REPLACE ALL
================================= */

function replaceAllText(){

    const search =
        document.getElementById(
            "find"
        ).value;

    const replacement =
        document.getElementById(
            "replace"
        ).value;


    if(!search)
        return;


    editor.value =
        editor.value.split(
            search
        ).join(
            replacement
        );


    saveHistory();

    updateStats();

    updateCursor();

}


/* =================================
   SALVAR
================================= */

function saveText(){

    localStorage.setItem(
        "multiscript_document",
        editor.value
    );


    document.getElementById(
        "documentName"
    ).textContent =
        "Documento salvo";


    setTimeout(
        function(){

            document.getElementById(
                "documentName"
            ).textContent =
                "Documento sem título";

        },
        2000
    );

}


/* =================================
   ABRIR
================================= */

function loadText(){

    const saved =
        localStorage.getItem(
            "multiscript_document"
        );


    if(saved === null){

        alert(
            "Nenhum documento salvo."
        );

        return;

    }


    editor.value =
        saved;


    saveHistory();

    updateStats();

    updateCursor();

}


/* =================================
   LIMPAR
================================= */

function clearDocument(){

    if(!editor.value)
        return;


    if(
        confirm(
            "Deseja realmente limpar o documento?"
        )
    ){

        editor.value = "";

        saveHistory();

        updateStats();

        updateCursor();

    }

}


/* =================================
   MODAL PDF
================================= */

function openPDFModal(){

    if(!editor.value.trim()){

        alert(
            "O documento está vazio."
        );

        return;

    }


    document
        .getElementById(
            "pdfModal"
        )
        .classList.add(
            "active"
        );

}


function closePDFModal(){

    document
        .getElementById(
            "pdfModal"
        )
        .classList.remove(
            "active"
        );

}


/* =================================
   GERAR PDF
================================= */

function generatePDF(){

    const text =
        editor.value;


    if(!text.trim())
        return;


    const {
        jsPDF
    } = window.jspdf;


    const title =
        document.getElementById(
            "pdfTitle"
        ).value ||
        "Documento";


    let filename =
        document.getElementById(
            "pdfFilename"
        ).value ||
        "documento";


    filename =
        filename
        .replace(
            /\.pdf$/i,
            ""
        );


    const pdf =
        new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });


    const pageWidth =
        pdf.internal.pageSize.getWidth();

    const pageHeight =
        pdf.internal.pageSize.getHeight();


    const margin = 20;

    const contentWidth =
        pageWidth -
        margin * 2;


    /* CABEÇALHO */

    pdf.setFont(
        "helvetica",
        "bold"
    );

    pdf.setFontSize(18);

    pdf.text(
        title,
        margin,
        margin
    );


    pdf.setDrawColor(
        180,
        180,
        180
    );

    pdf.line(
        margin,
        margin + 5,
        pageWidth - margin,
        margin + 5
    );


    /* TEXTO */

    pdf.setFont(
        "helvetica",
        "normal"
    );

    pdf.setFontSize(11);


    const lines =
        pdf.splitTextToSize(
            text,
            contentWidth
        );


    let y =
        margin + 15;


    const lineHeight = 5.5;


    lines.forEach(
        function(line){

            if(
                y + lineHeight >
                pageHeight - margin
            ){

                pdf.addPage();

                y = margin;

            }


            pdf.text(
                line,
                margin,
                y
            );


            y += lineHeight;

        }
    );


    /* RODAPÉ */

    const pages =
        pdf.internal.getNumberOfPages();


    for(
        let i = 1;
        i <= pages;
        i++
    ){

        pdf.setPage(i);

        pdf.setFontSize(8);

        pdf.setTextColor(
            120,
            120,
            120
        );

        pdf.text(
            `${title} · Página ${i} de ${pages}`,
            pageWidth / 2,
            pageHeight - 10,
            {
                align:"center"
            }
        );

    }


    pdf.save(
        filename + ".pdf"
    );


    closePDFModal();

}


/* =================================
   IMPRESSÃO
================================= */

function printDocument(){

    if(!editor.value.trim())
        return;


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    printWindow.document.write(`
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Documento</title>

<style>

@page{
    size:A4;
    margin:20mm;
}

body{
    font-family:Arial,sans-serif;
    font-size:12pt;
    line-height:1.6;
    white-space:pre-wrap;
}

</style>

</head>

<body>

${escapeHTML(editor.value)}

</body>

</html>
`);


    printWindow.document.close();

    printWindow.focus();

    printWindow.print();

}


/* =================================
   ESCAPE HTML
================================= */

function escapeHTML(text){

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =================================
   TAB NO EDITOR
================================= */

editor.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Tab"){

            event.preventDefault();

            insertText("    ");

        }

    }
);


/* =================================
   ATALHOS
================================= */

document.addEventListener(
    "keydown",
    function(event){

        /* CTRL + S */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "s"
        ){

            event.preventDefault();

            saveText();

        }


        /* CTRL + P */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "p"
        ){

            event.preventDefault();

            printDocument();

        }


        /* CTRL + F */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ){

            event.preventDefault();

            document
                .getElementById(
                    "find"
                )
                .focus();

        }


        /* CTRL + Z */

        if(
            event.ctrlKey &&
            !event.shiftKey &&
            event.key.toLowerCase() === "z"
        ){

            event.preventDefault();

            undo();

        }


        /* CTRL + SHIFT + Z */

        if(
            event.ctrlKey &&
            event.shiftKey &&
            event.key.toLowerCase() === "z"
        ){

            event.preventDefault();

            redo();

        }

    }
);


/* =================================
   INICIALIZAÇÃO
================================= */

updateStats();

updateCursor();

</script>

</html>
